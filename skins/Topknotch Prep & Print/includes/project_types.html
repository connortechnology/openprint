<? eval ( 
	require openprint::ProjectTypeCategory;
	@{$$variable{'ProjectTypeCategories'}} = openprint::ProjectTypeCategory::find(); ) ?>
<ul id="ProjectTypes">
	<? while ( $$variable{'ProjectTypeCategory'} = shift @{$$variable{'ProjectTypeCategories'}} ) ?>
	<li class="Category"><? echo ( $$variable{'ProjectTypeCategory'}->name(); ) ?></li>
	<? eval ( @{$$variable{'ProjectTypes'}} = $$variable{'ProjectTypeCategory'}->project_types(); ) ?>
<? echo (
		my $html;
		while ( $$variable{'ProjectType'} = shift @{$$variable{'ProjectTypes'}} ) {
		$html .= sprintf('<li><a href="/content/%4$s?ProjectType=%1$s&amp;ProjectTypeName=%3$s" title="%3$s">%2$s</a></li>',
			$$variable{'ProjectType'}->strid(), 
			ssi::htmlize( $$variable{'ProjectType'}->name() ),
			URI::Escape::uri_escape($$variable{'ProjectType'}->name()), 
			$$variable{'ProjectType'}->url()
			);
		} # end while
		return $html;
	) ?>
	<? endwhile ( $$variable{'ProjectTypeCategory'} = shift @{$$variable{'ProjectTypeCategories'}} ) ?>
</ul>
