	<table class="List" style="table-layout: auto;">
		<tr> 
			<th align="left">Services</th>
			<? if ( $$variable{'Quantity1'} ) ?><th width="210" align="right"><?Quantity1?></th><? endif ( $$variable{'Quantity1'} ) ?>
			<? if ( $$variable{'Quantity2'} ) ?><th width="210" align="right"><?Quantity2?></th><? endif ( $$variable{'Quantity2'} ) ?>
			<? if ( $$variable{'Quantity3'} ) ?><th width="210" align="right"><?Quantity3?></th><? endif ( $$variable{'Quantity3'} ) ?>
			<th width="90" align="right">Status</th>
		</tr>
		<? if ( @{$$variable{'SERVICES'}} ) ?>
		<? while ( @$variable{'index','name','url','price1','price2','price3','status'} = splice @{$$variable{'SERVICES'}},0,7; ) ?>
		<tr <?rowclass?>> 
			<td>
				<b><?name?></b><? echo ( ' - '.$$variable{'txtServiceDescription'} if $$variable{'txtServiceDescription'} ) ?><br/><? echo ( openprint::service::summary( @$variable{'ProjectIndex','index'} ); ) ?>
			</td>
	<? if ( $$variable{'Quantity1'} ) ?>
			<td align="right">
			<? echo ( 
				my $specs = openprint::service::get_specs_ref( @$variable{'Project','index'} );
				if ( $$specs{txtQuantity1} and $$specs{txtQuantity1} != $$variable{Quantity1} ) {
					return "($$specs{txtQuantity1}) ";
				} # end if
				return '';
			) ?>
			<b><? if ($$variable{'price1'} ne '-') ?><?CurrencySymbol?><? endif ($$variable{'price1'} ne '-') ?><?price1?></b><br/>
			<? echo ( my $summary = openprint::service::summary( @$variable{'ProjectIndex','index'}, 1 );
				$summary =~ s/\n/<br\/>/g;
				return $summary;
			 ) ?>
			</td>
	<? endif ( $$variable{'Quantity1'} ) ?>
	<? if ( $$variable{'Quantity2'} ) ?>
			<td align="right">
			<? echo ( 
				my $specs = openprint::service::get_specs_ref( @$variable{'Project','index'} );
				if ( $$specs{txtQuantity2} and $$specs{txtQuantity2} != $$variable{Quantity2} ) {
					return "($$specs{txtQuantity2}) ";
				} # end if
				return '';
			) ?>
			<b><? if ($$variable{'price1'} ne '-') ?><?CurrencySymbol?><? endif ($$variable{'price1'} ne '-') ?><?price2?></b><br/>
			<? echo ( openprint::service::summary( @$variable{'ProjectIndex','index'}, 2 ); ) ?>
			</td>
	<? endif ( $$variable{'Quantity2'} ) ?>
	<? if ( $$variable{'Quantity3'} ) ?>
			<td align="right">
			<? echo ( 
				my $specs = openprint::service::get_specs_ref( @$variable{'Project','index'} );
				if ( $$specs{txtQuantity3} and $$specs{txtQuantity3} != $$variable{Quantity3} ) {
					return "($$specs{txtQuantity3}) ";
				} # end if
				return '';
			) ?>
			<b><? if ($$variable{'price1'} ne '-') ?><?CurrencySymbol?><? endif ($$variable{'price1'} ne '-') ?><?price3?></b><br/>
			<? echo ( openprint::service::summary( @$variable{'ProjectIndex','index'}, 3 ); ) ?>
			</td>
	<? endif ( $$variable{'Quantity3'} ) ?>
			<td align="right"><?status?></td>
		</tr>
	<? eval ( $$variable{'rowclass'} = $$variable{'rowclass'} eq 'class="colRow"' ? '' : 'class="colRow"' ) ?>
	<? endwhile ( @$variable{'index','name','url','price1','price2','price3','status'} = splice @{$$variable{'SERVICES'}},0,7; ) ?>
	<? endif ( @{$$variable{'SERVICES'}} ) ?>
		<tr class="totals"> 
			<td align="left">Unit Prices:</td>
	<? if ( $$variable{'Quantity1'} ) ?><td align="right"><?CurrencySymbol?><?UnitPrice1?></td><? endif ( $$variable{'Quantity1'} ) ?>
	<? if ( $$variable{'Quantity2'} ) ?><td align="right"><?CurrencySymbol?><?UnitPrice2?></td><? endif ( $$variable{'Quantity2'} ) ?>
	<? if ( $$variable{'Quantity3'} ) ?><td align="right"><?CurrencySymbol?><?UnitPrice3?></td><? endif ( $$variable{'Quantity3'} ) ?>
			<td align="right">&nbsp;</td>
			<td class="unprintable" align="right">&nbsp;</td>
		</tr>
		<tr> 
			<td align="left">Total Before Taxes:</td>
	<? if ( $$variable{'Quantity1'} ) ?><td align="right"><?CurrencySymbol?><?Total1?></td><? endif ( $$variable{'Quantity1'} ) ?>
	<? if ( $$variable{'Quantity2'} ) ?><td align="right"><?CurrencySymbol?><?Total2?></td><? endif ( $$variable{'Quantity2'} ) ?>
	<? if ( $$variable{'Quantity3'} ) ?><td align="right"><?CurrencySymbol?><?Total3?></td><? endif ( $$variable{'Quantity3'} ) ?>
			<td align="right">&nbsp;</td>
			<td class="unprintable" align="right">&nbsp;</td>
		</tr>
	</table>
