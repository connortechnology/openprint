<script type="text/javascript">
	function load_contents( form ) {
		$('Results').innerHTML = 'Please wait...';
		new Ajax.Updater('Results','/employee/reports/_project_history_results.html', {parameters:Form.serialize(form)});
	} // end function
</script>
<div class="PageTitle">
<h1>REPORTS</h1>
<h2>Project History</h2>
</div>
<form id="f1" name="f1" method="post" action="/employee/reports/project_history.html">
	<fieldset class="filters"><legend>Report Criteria</legend>
		<ul>
		<li>
			<label>Company</label>
			<input type="text" onkeyup="filterDDM(this, f1.company_id);" size="4" />
			<select name="company_id">
				<option value="">All</option>
				<? echo ( openprint::Company::get_dropdown( $session{'/employee/reports/project_history.html?company_id'} ); ) ?>
			</select>
		</li>
		<li>
			<label>Estimator</label>
			<select name="Estimator" size="1">
			<? echo (
					my @options = ( '', 'All', 'Non Employee', 'Non Employee' );
					push @options, map { $_->id(), $_->name() } openprint::User->find('type'=>['E','A'], 'usergroup any'=>'Sales', 'order'=>'lower(firstname),lower(lastname)');
					return ssi::make_drop_down( \@options, $session{'/employee/reports/project_history.html?Estimator'} );
					) ?>
			</select>
		</li>
		<li>
			<label>Current Status</label>
			<select name="status" multiple="multiple" size="4" >
			<? echo (
				@{$$variable{options}} = sql::execute( undef, undef, q{SELECT name, name FROM Project_statuses ORDER BY sort, lower(name)} );
				my @selected = split(',', $session{'/employee/reports/project_history.html?status'} );
				@selected = @{$$variable{options}} if ! @selected;
				return ssi::make_drop_down( $$variable{options}, \@selected );
			) ?>
			</select>
		</li>
		<li>
			<label>Previous Status</label>
			<select name="previous_status" multiple="multiple" size="4" >
			<? echo (
				my @selected = split(',', $session{'/employee/reports/project_history.html?previous_status'} );
				@selected = @{$$variable{options}} if ! @selected;
				return ssi::make_drop_down( $$variable{options}, \@selected );
			) ?>
			</select>
			<span class="DateSelectorCT"><? echo ( ssi::date_select_session('/employee/reports/project_history.html', 'status_on_start', { 'with_today'=>1,'with_clear'=>1 } ); ) ?></span> to
			<span class="DateSelectorCT"><? echo ( ssi::date_select_session('/employee/reports/project_history.html', 'status_on_end', { 'with_today'=>1,'with_clear'=>1 } ); ) ?></span>
		</li>
		<li>
			<label>Created On</label>
			<span class="DateSelectorCT"><? echo ( ssi::date_select_session('/employee/reports/project_history.html', 'created_on_start', { 'with_today'=>1,'with_clear'=>1 } ); ) ?></span> to
			<span class="DateSelectorCT"><? echo ( ssi::date_select_session('/employee/reports/project_history.html', 'created_on_end', { 'with_today'=>1,'with_clear'=>1 } ); ) ?></span>
		</li>
		<li>
			<label>Value</label>
			<input type="number" id="value_start" name="value_start" value="<? echo ( $param{'value_start'}; ) ?>" /> to
			<input type="number" id="value_end" name="value_end" value="<? echo ( $param{'value_end'}; ) ?>" />
		</li>
		<? if ( $session{'user_type'} eq 'A' or openprint::usergroup::is_user_in( ['Sales Admin'], $session{'user_id'} ) ) ?>
		<li>
			<label>CSR</label>
			<select name="CSR" size="1">
			<? echo (
					my @options = ( '', 'All' );
					push @options, map { $_->id(), $_->name() } openprint::User->find('type'=>['E','A'], 'usergroup any'=>'Sales', 'order'=>'lower(firstname),lower(lastname)');
					return ssi::make_drop_down( \@options, $session{'/employee/reports/project_history.html?CSR'} );
					) ?>
			 </select>
		</li>
		<? endif ( $session{'user_type'} eq 'A' or openprint::usergroup::is_user_in( ['Sales Admin'], $session{'user_id'} ) ) ?>
		<li><label>Reprint</label>
			<? echo (
				return ssi::radio( 'reprint', [ 'Y', 'Yes', 'N', 'No', '', 'Both' ], $session{'/employee/reports/project_history.html?reprint'} );
			) ?>
		</li>
		</ul>
		 <p class="buttons">
			 <? echo ( ssi::button( 'Go', { onclick=>'load_contents(f1);', text=>'Show Results' } ); ) ?>
		 </p>
	</fieldset>
</form>
<div id="Results">
<!--#include virtual="/employee/reports/_project_history_results.html"-->
</div>
