<script type="text/javascript">
	function load_contents( form ) {
		$('Results').innerHTML = 'Please wait...';
		new Ajax.Updater('Results','/employee/reports/_project_performance.html', {parameters:Form.serialize(form)});
	} // end function
</script>
<div class="PageTitle">
<h1>REPORTS</h1>
<h2>Project Performance</h2>
</div>
<form id="f1" name="f1" method="post" action="/employee/reports/project_performance.html">
	<fieldset class="filters"><legend>Report Criteria</legend>
<ul>
		<? if ( $session{'user_type'} eq 'A' or openprint::usergroup::is_user_in( ['Sales Admin','Reporting'], $session{'user_id'} ) ) ?>
		<li>
			<label>CSR:</label>
			<select name="CSR" size="1" onchange="new Ajax.Updater('company_id', '/includes/_company_ddm.html', { parameters: { salesrep_id: get_ddm_value(this), selected_id: get_ddm_value($('company_id')) } } );">
			<? echo (
					my @options = ( '', 'All' );
					push @options, map { $_->id(), $_->name() } openprint::User::find('type'=>['E','A'], 'usergroup'=>'Sales', 'order'=>'lower(strfirstname),lower(strlastname)');
					return ssi::make_drop_down( \@options, $session{'/employee/reports/project_performance.html?CSR'} );
					) ?>

			 </select>
		</li>
		<? endif ( $session{'user_type'} eq 'A' or openprint::usergroup::is_user_in( ['Sales Admin','Reporting'], $session{'user_id'} ) ) ?>
		<li>
			<label>Company:</label>
			<input type="text" onkeyup="filterDDM(this, f1.company_id);" class="filter" />
			<select name="company_id" id="company_id">
				<option value="">All</option>
				<? echo ( openprint::Company::get_dropdown( $session{'/employee/reports/project_performance.html?company_id'} ); ) ?>
			</select>
		</li>
		<? if ( $session{'user_type'} eq 'A' or openprint::usergroup::is_user_in( ['Sales Admin','Reporting'], $session{'user_id'} ) ) ?>
		<li class="estimator">
			<label>Estimator:</label>
			<select name="estimator">
			<? echo (
					my @options = ( '', 'All', 'All Employee', 'All Employee', 'Non Employee', 'Non Employee' );
					push @options, map { $_->id(), $_->name() } openprint::User::find('type'=>['E','A'], 'usergroup'=>'Sales', 'order'=>'lower(strfirstname),lower(strlastname)');
					return ssi::make_drop_down( \@options, $session{'/employee/reports/project_performance.html?Estimator'} );
					) ?>
			</select>
		</li>
		<li class="estimator_exclude">
			<label>Exclude:</label>
			<select name="estimator_exclude" multiple="multiple">
			<? echo (
					my @options = ( '', 'None' );
					push @options, map { $_->id(), $_->name() } openprint::User::find('type'=>['E','A'], 'usergroup'=>'Sales', 'order'=>'lower(strfirstname),lower(strlastname)');
					return ssi::make_drop_down( \@options, $session{'/employee/reports/project_performance.html?estimator_exclude'} );
					) ?>
			</select>
		</li>
		<? endif ( $session{'user_type'} eq 'A' or openprint::usergroup::is_user_in( ['Sales Admin','Reporting'], $session{'user_id'} ) ) ?>
		<li>
			<label>Created On:</label>
			<span class="DateSelectorCT"><? echo ( ssi::date_select_session('/employee/reports/project_performance.html', 'created_on_start', { 'with_today'=>1,'with_clear'=>1 } ); ) ?></span> to
			<span class="DateSelectorCT"><? echo ( ssi::date_select_session('/employee/reports/project_performance.html', 'created_on_end', { 'with_today'=>1,'with_clear'=>1 } ); ) ?></span>
		</li>
		</ul>
		 <p class="buttons">
			 <? echo ( ssi::button( 'Go', { onclick=>'load_contents(f1);', text=>'Show Results' } ); ) ?>
		 </p>
	</fieldset>
</form>
<div id="Results">

</div>
