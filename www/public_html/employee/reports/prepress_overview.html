<script type="text/javascript">
	function load_projects( form ) {
		LoadContent('ProjectList','/employee/reports/_prepress_project_list.html', Serialize( form ) );
	} // end function
</script>

<form name="f1" method="post" action="prepress_overview.html">
	<fieldset class="filters">

			<label>Docket #:</label>

			- <input type="text" name="EndDocket" value="<?EndDocket?>" size="13"  />
			<? echo ( ssi::writeButton( $log, $dbh, 'Go', 'go.gif', "load_projects( document.f1 );", '', 'Go' );) ?>

		</p>

	)?>
				</select>
		</p>
		<p>
			<label>Press:</label>
			<select name="ddmPress">
				<option value="">All Presses</option>
<? echo (
	ssi::make_drop_down( [ map { $_->strid(), $_->name() } openprint::Equipment::find('category'=>'Printing', 'order'=>'lower(strid)' ) ], $openprint::param{'ddmPress'} );
) ?>
			</select>
		</p>
	<? eval (
		if ( ! $openprint::param{'TakeOverStartYear'} ) {
			@openprint::param{'TakeOverStartYear','TakeOverStartMonth','TakeOverStartDay'} = Date::Calc::Today();
		} # end if
		@$variable{'TakeOverStartYears','TakeOverStartMonths','TakeOverStartDays','TakeOverStart'} = ssi::get_dates( $log, $dbh,
			@openprint::param{'TakeOverStartYear','TakeOverStartMonth','TakeOverStartDay'} );

		if ( ! $openprint::param{'TakeOverEndYear'} ) {
			@openprint::param{'TakeOverEndYear','TakeOverEndMonth','TakeOverEndDay'} = Date::Calc::Today();
		} # end if
		@$variable{'TakeOverEndYears','TakeOverEndMonths','TakeOverEndDays','TakeOverEnd'} = ssi::get_dates( $log, $dbh,
			@openprint::param{'TakeOverEndYear','TakeOverEndMonth','TakeOverEndDay'} );
	) ?>
		<p>
			<label>Take Over Date:</label>
			<select name="TakeOverStartYear" onchange="load_projects(this.form);"><?TakeOverStartYears?></select>
			<select name="TakeOverStartMonth" onchange="load_projects(this.form);"><?TakeOverStartMonths?></select>
			<select name="TakeOverStartDay" onchange="load_projects(this.form);"><?TakeOverStartDays?></select>
to

			<select name="TakeOverEndMonth" onchange="load_projects(this.form);"><?TakeOverEndMonths?></select>
			<select name="TakeOverEndDay" onchange="load_projects(this.form);"><?TakeOverEndDays?></select>
