<script type="text/javascript">
	function load_projects( form ) {
		LoadContent('ProjectList','/employee/reports/_prepress_project_list.html', form.serialize() );
	} // end function
</script>

<form name="f1" method="post" action="prepress_overview.html">
	<fieldset class="filters">
		<legend>Select By Docket #</legend>
		<p>
			<label>Docket #:</label>
			<input type="text" name="StartDocket" value="<?StartDocket?>" size="13"  />
			- <input type="text" name="EndDocket" value="<?EndDocket?>" size="13"  />
			<? echo ( ssi::writeButton( $log, $dbh, 'Go', 'go.gif', "load_projects( document.f1 );", '', 'Go' );) ?>
		</p>
	</fieldset><fieldset class="filters"><legend>Or Select From the Following</legend>
		<p>
			<label>Company:</label>
				<input type="text" onKeyUp="filterDDM(this, f1.ddmCustomer);" size="4" />
				<select name="ddmCustomer" onchange="load_projects(this.form);">
					<option value="">All</option>
					<? echo ( openprint::Company::get_dropdown( $param{'company_id'} ); ) ?>
				</select>
		</p>
		<p>
			<label>Operator:</label>
				<select name="ddmEmployee" size="1" onchange="load_projects(this.form);">
					<option value="">All Employees</option>
	<? echo (
		ssi::make_drop_down( [ map { $_->id(), $_->name() } openprint::User->find( 'type'=>['E','A'], 'order'=>'lower(FirstName),lower(lastname)' ) ], $param{'ddmEmployee'} );
	)?>
				</select>
		</p>
		<p>
			<label>Press:</label>
			<select name="ddmPress">
				<option value="">All Presses</option>
<? echo (
	ssi::make_drop_down( [ map { $_->strid(), $_->name() } openprint::Equipment->find('category'=>'Printing', 'order'=>'lower(strid)' ) ], $param{'ddmPress'} );
) ?>
			</select>
		</p>
	<? eval (
		if ( ! $param{'TakeOverStartYear'} ) {
			@param{'TakeOverStartYear','TakeOverStartMonth','TakeOverStartDay'} = Date::Calc::Today();
		} # end if
		@$variable{'TakeOverStartYears','TakeOverStartMonths','TakeOverStartDays','TakeOverStart'} = ssi::get_dates( $log, $dbh,
			@param{'TakeOverStartYear','TakeOverStartMonth','TakeOverStartDay'} );

		if ( ! $param{'TakeOverEndYear'} ) {
			@param{'TakeOverEndYear','TakeOverEndMonth','TakeOverEndDay'} = Date::Calc::Today();
		} # end if
		@$variable{'TakeOverEndYears','TakeOverEndMonths','TakeOverEndDays','TakeOverEnd'} = ssi::get_dates( $log, $dbh,
			@param{'TakeOverEndYear','TakeOverEndMonth','TakeOverEndDay'} );
	) ?>
		<p>
			<label>Take Over Date:</label>
			 <select name="TakeOverStartYear" onchange="setDaysDropDown(this.value,this.form.TakeOverStartMonth.value,this.form.TakeOverStartDay,this.form.TakeOverStartDay.value);load_projects(this.form);"><?TakeOverStartYears?></select>
			 <select name="TakeOverStartMonth" onchange="setDaysDropDown(this.form.TakeOverStartYear.value,this.value,this.form.TakeOverStartDay,this.form.TakeOverStartDay.value);load_projects(this.form);"><?TakeOverStartMonths?></select>
			 <select name="TakeOverStartDay" onchange="load_projects(this.form);"><?TakeOverStartDays?></select>
			to 
			 <select name="TakeOverEndYear" onchange="setDaysDropDown(this.value,this.form.TakeOverEndMonth.value,this.form.TakeOverEndDay,this.form.TakeOverEndDay.value);load_projects(this.form);"><?TakeOverEndYears?></select>
			 <select name="TakeOverEndMonth" onchange="setDaysDropDown(this.form.TakeOverEndYear.value,this.value,this.form.TakeOverEndDay,this.form.TakeOverEndDay.value);load_projects(this.form);"><?TakeOverEndMonths?></select>
			<select name="TakeOverEndDay" onchange="load_projects(this.form);"><?TakeOverEndDays?></select>
		</p>
	<p class="buttons">
		<? echo ( join('',
				ssi::writeButton( $log, $dbh, 'ShowResults', 'showResults.gif', 'f1.submit();', '', 'Show Results' ),
				ssi::writeButton( $log, $dbh, 'Reset', 'reset.gif', 'f1.reset();', '', 'Reset' ),
		); ) ?>
	</p>
	</fieldset>
	<hr/>
</form>
<br/>
<div id="ProjectList"> 
<!--#include virtual="_prepress_project_list.html"-->
</div>
