<div class="PageTitle">
<h1>REPORTS</h1>
<h2>Order Performance</h2>
</div>
<form id="f1" name="f1" action="/employee/reports/order_performance.html" method="post">
	<input type="hidden" name="action" />
	<fieldset class="filters"><legend>Report Criteria</legend>
		<ul>
		<li>
			<label>Company</label>
			<input type="text" onkeyup="filterDDM(this, f1.company_id);" class="filter" />
			<select name="company_id">
				<option value="">All</option>
				<? echo ( openprint::Company::get_dropdown( $param{'company_id'} ); ) ?>
			</select>
		</li>
		<li>
			<label>Status</label>
			<select name="status" multiple="multiple" size="4" >
			<? echo (
					my @options = map { $_->name(), $_->name() } openprint::Order_Status->find(order=>'lower(name)');
					return ssi::make_select( \@options, $param{status} ? $param{status} : \@options);
					) ?>
			</select>
		</li>
		 <li>
			 <label>Created</label>
			<span class="DateSelectorCT"><? echo ( ssi::date_select_session('/employee/reports/order_performance.html', 'created_on_start', { 'with_today'=>1,'with_clear'=>1 } ); ) ?></span> to
			<span class="DateSelectorCT"><? echo ( ssi::date_select_session('/employee/reports/order_performance.html', 'created_on_end', { 'with_today'=>1,'with_clear'=>1 } ); ) ?></span>
		</li>
		<li>
			<label>Press</label>
			<select id="press_id" name="press_id">
				<option value="">All</option>
				<? echo ( ssi::make_drop_down( [ map { $_->id(), $_->strid() . ': ' . $_->name() } openprint::Equipment->find('category'=>'Printing', 'order'=>'lower(strid)') ], $param{'press_id'} ); ) ?>
			</select>
		</li>
		<? if ( $session{'user_type'} eq 'A' or openprint::usergroup::is_user_in( ['Sales Admin','Reporting','Accounting'], $session{user_id} ) ) ?>
		<li>
			<label>CSR</label>
			<select name="CSR">
			<? echo (
					my @options = ( '', 'All' );
					push @options, map { $_->id(), $_->name() } openprint::User->find(type=>['E','A'], 'usergroup'=>'Sales', 'order'=>'lower(strfirstname),lower(strlastname)');
					return ssi::make_drop_down( \@options, $param{CSR} );
					) ?>

			 </select>
		</li>
		<li>
			<label>Reprint</label>
			<? echo ( radio( 'reprint', [ 'Y', 'Yes', 'N', 'No', '', 'Both' ], $param{reprint} ); ) ?>
		</li>
		<li>
			<label>POs</label>
			<? echo ( radio( 'pos', [ 'Y', 'Yes', 'N', 'No', '', 'Both' ], $param{pos} ); ) ?>
		</li>
		</ul>
		<? endif ( $session{'user_type'} eq 'A' or openprint::usergroup::is_user_in( ['Sales Admin','Reporting','Accounting'], $session{user_id} ) ) ?>
		 <p class="buttons">
			 <? echo ( join('',
					 ssi::button( 'Go', { onclick=>"AjaxLoadContent('Results','/employee/reports/_order_performance.html', f1.serialize() );", text=>'Show Results' } ),
); ) ?>
		 </p>
	</fieldset>
</form>
<div id="Results"><!--#include virtual="/employee/reports/_order_performance.html"--></div>
