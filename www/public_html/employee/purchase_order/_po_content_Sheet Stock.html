<? echo (
	my $C = $$variable{'C'};
	$C = new openprint::PurchaseOrder_Content( $param{'content_id'} ) if $param{'content_id'};
	my ( $mweight, $type, $name ) = $$C{'description'} =~ /^([\d\.]+)M *([\w\/]*) *(.*)$/;
	if ( ! sets::isin( $type, [ '', 'FSC', 'PEFC/SFI' ] ) ) {
		$name = $type . ' ' . $name;
		$type = '';
	} # end if

	my $html .= sprintf(q`
		<td><input type="text" class="SheetQTY" name="qty-%1$d" id="qty-%1$d" value="%2$d" onkeyup="calc_price(this);if(this.value!=this.defaultValue){$('line-%1$d').addClassName('changed');}else{$('line-%1$d').removeClassName('changed');}" />sheets</td>
	<td><input type="text" name="item-%1$d" id="item-%1$d" value="%3$s" onkeyup="if(this.value!=this.defaultValue){$('line-%1$d').addClassName('changed');}else{$('line-%1$d').removeClassName('changed');}"/></td>

<td>
		<input type="hidden" name="description-%1$d" id="description-%1$d" value="%4$s"/>
		<input type="text" class="SheetMWeight" name="mweight-%1$d" id="mweight-%1$d" value="%5$s" onkeyup="calc_price(this);set_description('%1$d');if(this.value!=this.defaultValue){$('line-%1$d').addClassName('changed');}else{$('line-%1$d').removeClassName('changed');}" />M
		<input type="text" class="SheetName" name="name-%1$d" id="name-%1$d" onkeyup="set_description('%1$d');if(this.value!=this.defaultValue){$('line-%1$d').addClassName('changed');}else{$('line-%1$d').removeClassName('changed');}" value="%6$s"/>
		<select id="stocktype-%1$d" name="stocktype-%1$d" onchange="set_description('%1$d');">%7$s</select>
</td>
	<td><input type="text" name="docket-%1$d" id="docket-%1$d" value="%8$s" onkeyup="if(this.value!=this.defaultValue){$('line-%1$d').addClassName('changed');}else{$('line-%1$d').removeClassName('changed');}new Ajax.Updater('similar_pos', '_similar_pos.html', { method: 'get', parameters: { docket: this.value, po_id: %9$d} });" onblur="$('similar_pos').innerHTML='';"/></td>
	<td class="price"><input type="text" name="price-%1$d" id="price-%1$d" value="%10$.4f" onkeyup="this.value=this.value.replace(/[^\d\.]/g,'');calc_price(this);if(this.value!=this.defaultValue){$('line-%1$d').addClassName('changed');}else{$('line-%1$d').removeClassName('changed');}" onkeydown="this.lastValue = this.value;return check_decimal(this,event);"/>/100lb<br/><span id="price-%1$d-alert" class="error"></span></td>
	<td class="total"><input type="text" name="total-%1$d" id="total-%1$d" value="%11$.2f" onkeyup="calc_price(this);" onkeydown="this.lastValue = this.value;return check_decimal(this,event);"/></td>
`, $C->id(), $C->qty(), $C->item(),
  $C->description(), $mweight, $name, ssi::make_drop_down( [ '', 'Normal','FSC', 'FSC','PEFC/SFI', 'PEFC/SFI' ], $type ),
  $C->docket(), $C->po_id(),
  $C->price(), $C->total(),
 );
	return $html;
) ?>
