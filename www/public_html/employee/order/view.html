<script type="text/javascript">
    function confirm_delete( form, payment_id ) {
        if ( confirm( "Are you sure you want to delete this payment?" ) ) {
            form.btnFunction.value = 'Delete Payment';
            form.payment_id.value = payment_id;
            form.submit();
        } // end if
    } // end function confirm_delete()
</script>
