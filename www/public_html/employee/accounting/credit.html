<div class="error"><?error?></div>
<form name="f1" method="post" action="credit.html">
	<fieldset class="filters"><legend>Select Customer:</legend>
		<p>
			<label>Account #:</label>
			<input type="text" name="txtSearchAccountNum" size="13"/>
			<? echo ( ssi::writeButton( $log, $dbh, 'Go1','go.gif',"f1.btnFunction.value='Go';fmCheck(f1);", '', 'Go' ); ) ?>
		</p>
		<p>
			<label>Customer:&nbsp;</label>
            <input type="text" onKeyUp="filterDDM(this, f1.ddmCustomer);" size="4"/>
			<select name="ddmCustomer" onchange="if(this.options[this.selectedIndex].value != '') { f1.btnFunction.value='Go'; f1.submit();}">
            <option value="">Select a Customer</option>
			<? echo ( openprint::obj_customer::get_customer_dropdown( $log, $dbh, $openprint::param{'ddmCustomer'} ); ) ?>
            </select>
            <? echo ( ssi::writeButton( $log, $dbh, 'Go2','go.gif',"f1.btnFunction.value='Go';fmCheck(f1);", '', 'Go' ); ) ?>
		</p>
	</fieldset>
<? if ( $$variable{'CompanyIndex'} ) ?>
<fieldset><legend>Credit Information:</legend>
    <p>
        <label>Deny Purchases after:</label>
		<input type="text" name="txtDenyDays" value="<?txtDenyDays?>" /> Days
    </p>
    <p>
        <label>Warn about credit after:</label>
		<input type="text" name="txtWarnDays" value="<?txtWarnDays?>" /> Days
    </p>
    <p>
        <label>Credit Account Limit:</label>
        <input type="text" name="txtCreditLimit" value="<?txtCreditLimit?>" />
    </p>
    <p>
        <label>Current Credit Balance:</label>
		<?CreditBalance?>
    </p>
    <p>
        <label>Remaining Credit:</label>
        <?CreditRemaining?>
    </p>
	<p>
        <label>Credit Hold:</label>
		<input type="radio" id="rdbCreditHoldY" name="rdbCreditHold" value="Y" <? echo ( 'checked' if $$variable{'rdbCreditHold'} eq 'Y' ) ?> />
		<label class="radio" for="rdbCreditHoldY">Yes</label>
		<input type="radio" id="rdbCreditHoldN" name="rdbCreditHold" value="N" <? echo ( 'checked' if $$variable{'rdbCreditHold'} ne 'Y' ) ?> />
		<label class="radio" for="rdbCreditHoldN">No</label>
    </p>
    <p>
        <label>Required Downpayment Amount:</label>
		<input type="text" name="txtDownpayment" value="<?txtDownpayment?>"/>
	</p>
	<p class="buttons">
		<? echo ( join('',
			ssi::writeButton( $log, $dbh, 'Save','save.gif',"f1.btnFunction.value='Save';f1.submit();", '', 'Save' ),
			ssi::writeButton( $log, $dbh, 'Reset','reset.gif',"f1.reset();", '', 'Reset' ),
			); ) ?>
    </p>
</fieldset>
<? endif ( $$variable{'CompanyIndex'} ) ?>
<fieldset><legend>Unpaid Orders</legend>
<? if ( $$variable{'UnpaidOrders'} and @{$$variable{'UnpaidOrders'}} ) ?>
	<table class="List">
		<tr> 
			<th align="left" width="65">Order ID</th>
			<th align="left" width="60">Docket</th>
			<th align="center" width="75">Date</th>
			<th align="left" width="90">Invoice #</th>
			<th align="right">P.O. #</th>
			<th align="right" width="75">Total</th>
			<th align="right" width="75">Balance</th>
			<th align="center" width="55"><? echo ( ssi::writeButton( $log, $dbh, 'Pay','pay.gif',"f1.btnFunction.value='Pay';f1.submit();", '', 'Pay' ); ) ?></th>
		</tr>
		<? eval (
			$$variable{'balance_total'} = 0;
			$$variable{'total_total'} = 0;
		) ?>
		<? while ( @$variable{'order_id','date','company','ponum','total','balance','docket','invoice_id'} = splice @{$$variable{'UnpaidOrders'}},0,8; ) ?>
		<tr<?rowclass?>> 
			<td><a href="/employee/accounting/details.html?order_id=<?order_id?>"><?order_id?></a></td>
			<td><a href="/employee/accounting/details.html?order_id=<?order_id?>"><?docket?></a></td>
			<td align="center"><?date?></td>
			<td align="left">&nbsp;<?invoice_id?></td>
			<td align="right">&nbsp;<?ponum?></td>
			<td align="right">$<?total?></td>
			<td align="right">$<?balance?></td>
			<td align="center"><input type="checkbox" name="PAID" value="<?order_id?>"/></td>
		</tr>
		<? eval ( 
			$$variable{'rowclass'} = $$variable{'rowclass'} ? '' : ' class="colRow"';
			$$variable{'balance_total'} += $$variable{'balance'};
			$$variable{'total_total'} += $$variable{'total'};
			) ?>
		<? endwhile ( @$variable{'order_id','date','company','ponum','total','balance','docket','invoice_id'} = splice @{$$variable{'UnpaidOrders'}},0,8; ) ?>
		<tr class="totals">
			<td colspan="5" align="right">Totals:</td>
			<td align="right">$<?total_total?></td>
			<td align="right">$<?balance_total?></td>
			<td>&nbsp;</td>
		</tr>
	</table>
<? else ( $$variable{'UnpaidOrders'} and @{$$variable{'UnpaidOrders'}} ) ?>
There are no unpaid orders.
<? endif ( $$variable{'UnpaidOrders'} and @{$$variable{'UnpaidOrders'}} ) ?>
</fieldset>
	<input type="hidden" name="btnFunction"/>
</form>
