<script type="text/javascript">
function load_content( form, options ) {
	var p = form.serialize(true);
	if ( options && options.order )
		p.order = options.order;
	
	new Ajax.Updater( 'Results','/employee/it/_blacklist.html', { method: 'get', parameters: p } );
} // end function load
</script>
<!--#include virtual="/includes/error_reporting.html"-->

	 		<input type="text" id="ip" name="ip" size="10" onkeyup="this.value=this.value.replace(/[^\.\d]/,'');" onkeydown="if(event.keyCode == 13){load_content($('f1'));}"/>
			<? echo ( ssi::writeButton( $log, $dbh, 'Load', 'load.gif', "load_content(\$('f1'));",'','Load' ); ) ?>
		</p>
	</fieldset>
</form>
