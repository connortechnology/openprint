<p>To begin this section, please use the dropdown menu below, to search for 
	a banner. <br/>
</p>
<form name="f1;" method="post" enctype="multipart/form-data" onSubmit="return fmCheck();">
	<fieldset><legend>Search:</legend>
	<p>
		<label>Banner:</label>
			<select name="ddmBanner" onchange="if(this.options[this.selectedIndex].value != '') f1.submit();">
				<option value="">Select a Banner</option>
				<?FILL_BANNER_NAME?>
			</select>
</p>
	<p class="buttons">
			<script type="text/javascript">
				writeButton('Previous1','prev.gif',"f1.btnFunction.value='<<';fmCheck(f1);",'','<<');
				writeButton('Next1','next.gif',"f1.btnFunction.value='>>';fmCheck(f1);",'','>>');
				writeButton('New1','new.gif',"addCheck(f1);",'','New');
				writeButton('Delete1','delete.gif',"f1.btnFunction.value='Delete';fmChange=2;fmCheck(f1);",'','Delete');
				writeButton('Save1','save.gif',"f1.btnFunction.value='Save';fmChange=3;fmCheck(f1);",'','Save');
				writeButton('Reset1','reset.gif','f1.reset();','','Reset');
			</script>
	</p>
	<p> 
		<label>Name:</label>
			<input type="text" name="txtBannerName" value="<?BANNER_NAME?>" />
	</p>
	<p> 
		<label>Banner Link:</label>
			<input type="text" name="txtBannerURL"  value="<?BANNER_URL?>" />
	</p>
	<p> 
		<label>Apply to Category:</label>
			<select name="selectCategories" size="4" multiple >
				<?FILL_CUSTOMER_CATEGORIES?>
			</select>
	</p>
	<p> 
		<label>Upload Image:</label>
			<input type="file" name="fileBannerImage" enctype="multipart/form-data"  />
	</p>
	<p> 
		<label>Current Image:</label>
			<? if ( $$variable{'BANNER_IMAGE'} ) ?>
			<img src="/images/banners/<?BANNER_IMAGE?>"/>
			<? else ( $$variable{'BANNER_IMAGE'} ) ?>
			No image uploaded yet.
			<? endif ( $$variable{'BANNER_IMAGE'} ) ?>
	</p>
	<p class="buttons">
			<script type="text/javascript">
				writeButton('Previous2','prev.gif',"f1.btnFunction.value='<<';fmCheck(f1);",'','<<');
				writeButton('Next2','next.gif',"f1.btnFunction.value='>>';fmCheck(f1);",'','>>');
				writeButton('New2','new.gif',"addCheck(f1);",'','New');
				writeButton('Delete2','delete.gif',"f1.btnFunction.value='Delete';fmChange=2;fmCheck(f1);",'','Delete');
				writeButton('Save2','save.gif',"f1.btnFunction.value='Save';fmChange=3;fmCheck(f1);",'','Save');
				writeButton('Reset2','reset.gif','f1.reset();','','Reset');
			</script>
	</p>
	</fieldset>
	<input type="hidden" name="btnFunction"/>
</form>
