<script type="text/javascript">
	function fill_users( form ) {
		clear_ddm( form.selectSpecificCustomers );
		var params = new Array();
		params[params.length] = get_rdb_value( form, 'rdbMailingList' );
		params[params.length] = get_rdb_value( form, 'rdbActive' );
		params[params.length] = get_select_value( form.selectMarketingCategory ).join(';');
		params[params.length] = get_select_value( form.selectSalesRep ).join(';');

		jsrsExecute( '/jsrs.htm', cbFillUsers, 'openprint::marketing::get_users', params );
	}
	function cbFillUsers ( results ) {
		var Users = new Array();
		var aOptionPairs = results.split('|');
		for ( var i = 0; i < aOptionPairs.length; i++ ){
			if ( aOptionPairs[i].indexOf('~') != -1 ) {
				var aOptions = aOptionPairs[i].split('~');
				switch ( aOptions[0] ) {
					case 'Users':
						var option = create_option( aOptions[1], aOptions[2] );
						Users[Users.length] = option;
						option.selected = true;
						break;
				} // end switch
			} // end if
		} // end for
		
		var form = getFormObj('f1');
		fill_ddm( form.selectSpecificCustomers, Users, '' );
	}
</script>	
<form name="f1" method="post" action="mail_confirmation.html" enctype="multipart/form-data">
	<fieldset><legend>Filter By:</legend>
		<p> 
			<label>Mailing List:</label>
			<input type="radio" id="rdbMailingListY" name="rdbMailingList" value="Y" onClick="fill_users(f1);" /> 
			<label class="radio" for="rdbMailingListY">Yes</label>
			<input type="radio" id="rdbMailingListN" name="rdbMailingList" value="N" onClick="fill_users(f1);" />
			<label class="radio" for="rdbMailingListN">No</label>
			<input type="radio" id="rdbMailingListB" name="rdbMailingList" value="" onClick="fill_users(f1);" checked />
			<label class="radio" for="rdbMailingListB">Both</label>
		</p>
		<p> 
			<label>Active:</label>
			<input type="radio" id="rdbActiveY" name="rdbActive" value="Y" onClick="fill_users(f1);" checked />
			<label class="radio" for="rdbActiveY">Yes</label>
			<input type="radio" id="rdbActiveN" name="rdbActive" value="N" onClick="fill_users(f1);" />
			<label class="radio" for="rdbActiveN">No</label>
			<input type="radio" id="rdbActiveB" name="rdbActive" value="" onClick="fill_users(f1);" />
			<label class="radio" for="rdbActiveB">Both</label>

			</label>
