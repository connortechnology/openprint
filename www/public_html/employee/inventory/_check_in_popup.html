<? eval (
	$ENV{'HTTP_REFERER'} =~ /.*\/(.*\.html)/;
	$$variable{'referer'} = $1;
	$$variable{'Paper'} = new openprint::Paper( $openprint::param{'paper_id'} );
	if ( exists $openprint::param{'quantity'} ) {
		$$variable{'quantity'} = $openprint::param{'quantity'};
	} else {
		$$variable{'quantity'} = $$variable{Paper}->in_stock() - $$variable{Paper}->allocated();
	} # end if
) ?>
<div class="PopupWindow" id="CheckIn">
	<form id="checkinform" name="checkinform" action="<?referer?>" method="post">
		<input type="hidden" name="btnFunction" value="CheckIn" />
		<input type="hidden" name="paper_id" value="<? echo ( $$variable{'Paper'}->id() ) ?>" />
		<input type="hidden" name="skid_id" value="<? echo ( $openprint::param{'skid_id'} ) ?>" />
		<fieldset><legend>Check In Paper</legend>
			<p>
				<label>Docket:</label>
				<input type="text" name="Docket" onkeypress="return input_handler( this, event);"/>
				<? echo ( ssi::writeButton( $log, $dbh, 'clearCheckInDocket', 'clear.gif', "checkinform.Docket.value='';", '', 'Clear' ); ) ?>
			</p>
			<p>
				<label>Project #:</label>
				<input type="text" name="Project_id" onkeypress="return input_handler( this, event);"/>
				<? echo ( ssi::writeButton( $log, $dbh, 'clearCheckInProject', 'clear.gif', "checkinform.Project.value='';", '', 'Clear' ); ) ?>
			</p>
			<p>
				<label>Quantity: ( <? echo ( $$variable{Paper}->type() eq 'Roll' ? 'lbs' : 'sheets' ) ?> )</label>
				<input type="text" name="Quantity" onkeypress="return input_handler( this, event);"/>
				<? echo ( ssi::writeButton( $log, $dbh, 'clearCheckInQuantity', 'clear.gif', "checkinform.Quantity.value='';", '', 'Clear' ); ) ?>
			</p>
			<hr/>
			<p style="float: right;">
			<? echo ( ssi::writeButton( $log, $dbh, 'SaveCheckIn', 'save.gif', 'if(check_inputs(checkinform)){checkinform.submit();}', '', 'Save' ); ) ?>
			<? echo ( ssi::writeButton( $log, $dbh, 'CancelCheckIn', 'cancel.gif', "hide_div('CheckIn');", '', 'Cancel' ); ) ?>
			</p>
		</fieldset>
	</form>
</div>
