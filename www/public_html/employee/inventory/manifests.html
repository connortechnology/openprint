<? if ( $$variable{'information'} ) ?>
<p class="information"><?information?></p>

Please select a Manifest to view/edit.<br>
<form name="f1" method="post" action="manifest_details.html">
	<fieldset class="filters"><legend>Choose Manifest</legend>
		<p>
			<label for="manifest_id">Manifest ID #</label>
			<input type="text" id="manifest_id" name="manifest_id" size="10" onkeypress="return input_handler( this, event);" onkeydown="if(event.keyCode == 13){f1.submit();}"/>
			<? echo ( ssi::writeButton( $log, $dbh, 'Go', 'go.gif', 'f1.submit();','','Go' ); ) ?>
			<input type="text" id="manifest_like" name="manifest_like" size="10" onkeydown="if(event.keyCode == 13){LoadContent( 'Results', '/employee/inventory/_manifests.html', Serialize( document.forms.f1 ) );}" />
			<? echo ( ssi::writeButton( $log, $dbh, 'Show', 'go.gif', "LoadContent( 'Results', '/employee/inventory/_manifests.html', Serialize( document.forms.f1 ) );",'','Show' ); ) ?>
		</p>
	</fieldset>
</form>
<form name="f2" method="post" action="manifests.html">
	<fieldset class="filters"><legend>Search Criteria</legend>
		<? eval (
			if ( ! $openprint::session{'/employee/inventory/manifests.html?StartYear'} ) {
				@openprint::session{'/employee/inventory/manifests.html?StartYear','/employee/inventory/manifests.html?StartMonth','/employee/inventory/manifests.html?StartDay'} = Date::Calc::Today();
			} # end if
			if ( ! $openprint::session{'/employee/inventory/manifests.html?EndYear'} ) {
				@openprint::session{'/employee/inventory/manifests.html?EndYear','/employee/inventory/manifests.html?EndMonth','/employee/inventory/manifests.html?EndDay'} = Date::Calc::Today();
			} # end if
		) ?>
		<p>
			<label>Received On:</label>
			<span class="DateSelector">
			<select name="StartYear" onchange="setDaysDropDown(this.value,this.form.StartMonth.value,this.form.StartDay,this.form.StartDay.value);"><option value=""> </option><? echo ( ssi::return_years( undef, undef, $openprint::session{'/employee/inventory/manifests.html?StartYear'} ? $openprint::session{'/employee/inventory/manifests.html?StartYear'} : ''); ) ?></select>
			<select name="StartMonth" onchange="setDaysDropDown(this.form.StartYear.value,this.value,this.form.StartDay,this.form.StartDay.value);"><option value=""> </option><? echo ( ssi::getmonths( $openprint::session{'/employee/inventory/manifests.html?StartMonth'} ? $openprint::session{'/employee/inventory/manifests.html?StartMonth'} : ''); ) ?></select>
			<select name="StartDay"><option value=""> </option><? echo ( ssi::getdays( $openprint::session{'/employee/inventory/manifests.html?StartDay'} ? $openprint::session{'/employee/inventory/manifests.html?StartDay'} : ''); ) ?></select>
			to 
			</span>
			<span class="DateSelector">
			<select name="EndYear" onchange="setDaysDropDown(this.value,this.form.EndMonth.value,this.form.EndDay,this.form.EndDay.value);"><option value=""> </option><? echo ( ssi::return_years( undef, undef, $openprint::session{'/employee/inventory/manifests.html?EndYear'} ? $openprint::session{'/employee/inventory/manifests.html?EndYear'} : ''); ) ?></select>
			<select name="EndMonth" onchange="setDaysDropDown(this.form.EndYear.value,this.value,this.form.EndDay,this.form.EndDay.value);"><option value=""> </option><? echo ( ssi::getmonths( $openprint::session{'/employee/inventory/manifests.html?EndMonth'} ? $openprint::session{'/employee/inventory/manifests.html?EndMonth'} : ''); ) ?></select>
			<select name="EndDay"><option value=""> </option><? echo ( ssi::getdays( $openprint::session{'/employee/inventory/manifests.html?EndDay'} ? $openprint::session{'/employee/inventory/manifests.html?EndDay'} : ''); ) ?></select>
			</span>
		</p>
		<p class="buttons">
			<? echo ( join('',
				ssi::writeButton( $log, $dbh, 'ShowResults', 'showResults.gif', "LoadContent( 'Results', '/employee/inventory/_manifests.html', Serialize( document.forms.f2 ) );", '', 'Show Results' ),
				ssi::writeButton( $log, $dbh, 'Add', 'add.gif', '', 'manifest_details.html', 'Add New Manifest' ),
				); ) ?>
		</p>
	</fieldset>
</form>
<script type="text/javascript">document.f1.manifest_id.focus();</script>
