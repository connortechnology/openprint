<script type="text/javascript">
	var allocateWin;
	function allocate_window( paper_id ) {
		if ( allocateWin == null ) {
			allocateWin = new Window({maximizable: false, resizable: true, hideEffect:Element.hide, showEffect:Element.show, destroyOnClose: true, className:"alphacube",width:300} );
			allocateWin.setHTMLContent('Loading... please wait');
			allocateWin.showCenter();
			// Set up a windows observer, check ou debug window to get messages
			myObserver = {
				onDestroy: function(eventName, win) {
					if (win == allocateWin) {
						allocateWin = null;
						Windows.removeObserver(this);
					}
				}
			}
			Windows.addObserver(myObserver);
		}
		allocateWin.setAjaxContent('/employee/inventory/_allocate_popup.html?referer=available_paper.html&paper_id='+paper_id, null , true);
	} // end function bug_report

	function check_inputs(form ) {
		if ( (form.Docket && form.Docket.value == '') && (form.Project && form.Project.value == '') ) {
			alert( 'Please enter the docket # or project # to allocate to.' );
			return false;
		} // end if
		if ( form.available_quantity && ( parseInt(form.Quantity.value) > parseInt(form.available_quantity.value) ) ) {
			if ( form.Units ) {
				alert( 'There are only ' + form.available_quantity.value + get_value( form.Units ) + ' available' );
			} else {
				alert( 'There are only ' + form.available_quantity.value + ' available' );
			} // end if
			return false;
		} // end if
		return true;
	} // end function check_inputs(form)
	// override this so we don't refresh paper dropdowns on load
	function body_onLoad() {
	} // end function body_onLoad();
	function calc( formName ) {
		var f1 = $(formName);
		if ( ! f1 ) {
			alert('No form. Tell Isaac about this please.');
		} 
		AjaxLoadContent( 'Results',  '_available_paper.html', f1.serialize() );
	} // end function calc

</script>
