<div id="Allocate">
	<form id="allocateform" name="allocateform" action="<?referer?>" method="post">
		<input type="hidden" name="btnFunction" value="Allocate" />
		<input type="hidden" name="paper_id" value="<? echo ( $$variable{'Paper'}->id() ) ?>" />
		<input type="hidden" name="skid_id" value="<? echo ( $param{'skid_id'} ) ?>" />
		<fieldset><legend>Allocate Paper</legend>
			<? echo ( 
			my $html = '';
			foreach my $skid_id ( split(',', $param{'skid_id'} ) ) {
				my $Skid = new openprint::Skid( $skid_id );
				if ( my $C = $Skid->Content( $$variable{'Paper'} ) ) {
					$html .= sprintf('skid %d contains %d%s<br/>', $skid_id, $C->quantity(), $$variable{'Paper'}->type() eq 'Roll' ? 'lbs' : ' sheets' ); 
				} # end if
			} # end foreach	
			return $html;
			) ?>
			<p>
				<label>Docket:</label>
				<input type="text" name="Docket" onkeypress="return input_handler( this, event);" onkeyup="this.value=this.value.replace(/\D/,'');"/>
				<? echo ( ssi::writeButton( $log, $dbh, 'clearAllocateDocket', 'clear.gif', "allocateform.Docket.value='';", '', 'Clear' ); ) ?>
			</p>
			<p>
				<label>Project:</label>
				<input type="text" name="Project" onkeypress="return input_handler( this, event);" onkeyup="this.value=this.value.replace(/\D/,'');"/>
				<? echo ( ssi::writeButton( $log, $dbh, 'clearAllocateProject', 'clear.gif', "allocateform.Project.value='';", '', 'Clear' ); ) ?>
			</p>
			<p>
				<label>Quantity: ( <? echo ( $$variable{Paper}->type() eq 'Roll' ? 'lbs' : 'sheets' ) ?> )</label>
				<input type="hidden" name="Units" value="<? echo ( $$variable{Paper}->type() eq 'Roll' ? 'lbs' : 'sheets' ) ?>" />
				<input type="hidden" name="available_quantity" value="<? echo ( 
					if ( $param{'skid_id'} ) {
						my $available = 0;
						foreach my $skid_id ( split(',', $param{'skid_id'} ) ) {
							my $Skid = new openprint::Skid( $skid_id );
							if ( my $C = $Skid->Content( $$variable{'Paper'}) ) {
							$available += ( $C->quantity() - $Skid->allocation('Paper'=>$$variable{'Paper'}) );
						} # end foreach Skid
						return $available;
					} else {
						return $$variable{Paper}->available();
					} # end if
) ?>"/>
				<input type="text" name="Quantity" value="<?quantity?>" onkeypress="return input_handler( this, event);" onkeyup="this.value=this.value.replace(/\D/,'');"/>
				<? echo ( ssi::writeButton( $log, $dbh, 'clearAllocateQuantity', 'clear.gif', "allocateform.Project.value='';", '', 'Clear' ); ) ?>
				
			</p>
			<p>
				<label><a title="Click to allocate specific skids on the floor.">Specific Skids:</label>
				<input type="checkbox" name="specific" id="specific" value="1" /><label class="radio" for="specific" title="Click to allocate specific skids on the floor.">Yes</label>
			</p>
			<hr/>
			<p class="buttons">
			<? echo ( 
				my $html = '';
				$html .= ssi::writeButton( $log, $dbh, 'SaveAllocate', 'save.gif', 'if(check_inputs(allocateform)){document.allocateform.submit();}', '', 'Save' );
				$html .= ssi::writeButton( $log, $dbh, 'CancelAllocate', 'cancel.gif', "allocateWin.destroy();", '', 'Cancel' ); 
				return $html;
			) ?>
			</p>
		</fieldset>
	</form>
</div>
