<script type="text/javascript">
	function submit_handler( form ) {
		if ( form.StartDocket.value || form.OrderID.value ) {
			form.action = '/employee/production/projects.html';
			form.submit();
		} else if ( form.project_id.value ) {
			form.action = '/employee/project/view.html';
			form.submit();
		} else if ( form.skid_id.value ) {
			form.action = '/employee/inventory/skid_details.html';
			form.submit();
		} else if ( form.paper_id.value ) {
			form.action = '/employee/inventory/paper_details.html';
			form.submit();
		} else if ( form.rfidtag_id.value ) {
			form.action = '/employee/inventory/rfidtag_details.html';
			form.submit();
		} else {
			alert( "Please enter or scan the a docket, order or project number!" );
		} // end if
	}
</script>
