<form id="JobForm" name="JobForm">
	<input type="hidden" name="schedule_id" value="<? echo ( $param{'schedule_id'} ) ?>" />
	<fieldset><legend>Job Scheduling Information</legend>
		<p>
			<label>Comment:</label>
			<textarea id="comment" name="comment"  rows="5" cols="" ><? echo ( $$variable{'Job'}->comment() ) ?></textarea>
		</p>
<? if ( $$variable{'Job'}->Equipment()->smartscheduling() eq 'Y' ) ?>
		<p>
			<label>Locked:</label>
			<input type="radio" id="locked1" name="locked" value="1" <? echo ( ssi::checked( $$variable{'Job'}{'locked'} ); ) ?> onclick="$('StartTime').show();" />
			<label class="radio" for="locked1">Yes</label>
			<input type="radio" id="locked0" name="locked" value="0" <? echo ( ssi::checked( ! $$variable{'Job'}{'locked'} ); ) ?> onclick="$('StartTime').hide();" />
			<label class="radio" for="locked0">No</label>
		</p>
		<p id="StartTime" <? echo ( $$variable{'Job'}{'locked'} ? '' : 'style="display:none;"' :'' ) ?>>
			<label>Start Time:</label>
			<span class="DateTimeSelector">
			<? echo ( 
				return ssi::datetime_select( 'starttime', ( $$variable{'Job'}{'starttime'} ? $$variable{'Job'}{'starttime'} : ''), { 'onchange'=>q`set_rdb_value($('locked'), 1 );` } );
			) ?>
			<? echo ( ssi::writeButton( $log, $dbh, 'Today', 't.gif', 'set_today( JobForm.starttime_year, JobForm.starttime_month, JobForm.starttime_day, JobForm.starttime_hour, JobForm.starttime_minute );', '', 'T' ); ) ?>
			</span>
		</p>
<? endif ( $$variable{'Job'}->Equipment()->smartscheduling() eq 'Y' ) ?>
		<p>
			<label>Impressions:</label>
			<input type="text" name="impressions" value="<? echo ( $$variable{'Job'}->impressions() ) ?>" />
		</p>
		<p>
			<label>Speed:</label>
			<input type="text" name="speed" value="<? echo ( $$variable{'Job'}->speed() ) ?>" onkeyup="this.value=this.value.replace(/[\D]/g,'');"/>/Hr
		</p>
		<p>
			<label>Runtime:</label>
			<input type="text" name="runtime" value="<? echo ( $$variable{'Job'}->runtime() ) ?>" onkeyup="this.value=this.value.replace(/[^\d:]/g,'');"/>
		</p>
		<p>
			<label>Forms:</label>
			<input type="text" name="forms" value="<? echo ( $$variable{'Job'}->forms() ) ?>" onkeyup="this.value=this.value.replace(/\D/g, '');" />
		</p>
	</fieldset>
		<p class="buttons">
			<? echo ( ssi::writeButton( $log, $dbh, 'SaveStartTime', 'save.gif', q`new Ajax.Request('_li_change.json',{parameters:JobForm.serialize(), onSuccess:function(){popupWin.destroy();}});`, '', 'Save' ); ) ?>
			<? echo ( ssi::writeButton( $log, $dbh, 'CancelStartTime', 'cancel.gif', "popupWin.destroy();", '', 'Cancel' ); ) ?>
		</p>
	<input type="hidden" name="action" value="SaveJob" />
</form>
