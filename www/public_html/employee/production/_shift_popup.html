<form id="ShiftForm" name="ShiftForm">
	<input type="hidden" name="shift_id" value="<? echo ( $param{'shift_id'} ) ?>" />
	<fieldset><legend>Shift Information</legend>
		<ul>
			<li>
				<label>Start Time:</label>
				<? echo ( return ssi::datetime_select( 'starttime', $$variable{'Shift'}{'starttime'}, {'onchange'=>q`check_time_starting(this.form,'starttime','endtime');update_duration(this.form,'starttime','endtime');`} ); ) ?>
			</li>
			<li>
				<label>End Time:</label>
				<? echo ( return ssi::datetime_select( 'endtime', $$variable{'Shift'}{'endtime'}, {'onchange'=>q`check_time_starting(this.form,'starttime','endtime');update_duration(this.form,'starttime','endtime');`} );) ?>
			</li>
			<li><label>Duration:</label>
				<span id="duration"> </span>
				<script type="text/javascript">update_duration(document.forms['ShiftForm'],'starttime','endtime');</script>
			</li>
			<li><label>Shift:</label>
				<select name="equipmentshift_id" id="equipmentshift_id">
					<option value=""> select </option>
					<? echo ( ssi::make_drop_down( [ map { $_->id(), $_->name() } openprint::Equipment_Shift::find('equipment_id'=>$$variable{'Shift'}{'equipment_id'}, 'order'=>'starttime' ) ], $$variable{'Shift'}{'shift_id'} ); ) ?>
				</select>
			</li>
			<li>
				<label>Operator:</label>
				<select id="operator_id" name="operator_id" size="1"><option value="">select one</option>
				<? echo ( 
				   ssi::make_drop_down ( [ map { $_->id(), $_->name() } openprint::User::find( 'type'=>'E', 'usergroup'=>$$variable{'Shift'}->Equipment()->category(),'order'=>'lower(strfirstname)' ) ], $$variable{'Shift'}->operator_id() );
				   ) ?>
				</select>
			</li>
		</ul>
	</fieldset>
	<p class="buttons">
		<? echo ( 
			join('', 
				ssi::writeButton( $log, $dbh, 'DeleteShift', 'delete.gif', q`new Ajax.Request('_shift_change.json?action=delete',{parameters:ShiftForm.serialize(), onSuccess:function(){popupWin.destroy();}});`, '', 'Delete' ),
				ssi::writeButton( $log, $dbh, 'SaveShift', 'save.gif', q`new Ajax.Request('_shift_change.json',{parameters:ShiftForm.serialize(), onSuccess:function(){popupWin.destroy();}});`, '', 'Save' ),
				ssi::writeButton( $log, $dbh, 'CancelShift', 'cancel.gif', "popupWin.destroy();", '', 'Cancel' ),
			);
		) ?>
	</p>
</form>
