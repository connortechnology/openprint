<? echo ( 
	my $html;
	@{$$variable{'pending_approved_drops'}} = ();
	if ( $session{'/employee/production/print_overview.html?pending_approved'} ) {
		my $Shift = new openprint::Shift();
		$Shift->name('Approved');
		foreach my $E ( @{$$variable{'Presses'}} ) {
			$html .= '<div class="PressColumn" style="width:'. int (100/(@{$$variable{'Presses'}})).'%;">';
			$Shift->equipment_id( $E->id() );
			push @{$$variable{'pending_approved_drops'}}, $Shift->ul_id();
			$html .= $Shift->get_ul( {'Status'=>'Approved'} );
			$html .= '</div>';
		} # end foreach press
	} # end if
	return $html;
) ?>
<? if ( @{$$variable{'pending_approved_drops'}} ) ?>
<script type="text/javascript">
  // <![CDATA[
	drops.push("<? echo ( join('","', @{$$variable{'pending_approved_drops'}} ) ) ?>");
<? if ( $r->uri() =~ /_pending/ ) ?>
	for ( var i = 0; i < drops.length; i += 1 ) {
		if ( $(drops[i]) ) {
			Sortable.create(drops[i], {dropOnEmpty:true,containment:drops,constraint:false, onUpdate:dropfunction });
		} // end if
	} // end foreach id in drops
	setup_dates();
<? endif ( $r->uri() =~ /_pending/ ) ?>
// ]]>
</script>
<? endif ( @{$$variable{'pending_approved_drops'}} ) ?>
