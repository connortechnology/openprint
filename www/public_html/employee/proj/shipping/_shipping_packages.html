<p>
	<label>Full Package Weight:</label>
	<span class="TwoColumns"><?txtPackageWeight?> lbs</span>
	<span class="TwoColumns">
	<input name="txtPackageWeightUsed" value="<? echo ( $$variable{'txtPackageWeightUsed'} ? $$variable{'txtPackageWeightUsed'} : $$variable{'txtPackageWeight'} ) ?>" type="text" size="9" onkeyup="this.value=this.value.replace(/[^\.\d]/g,'');" /> lbs
	</span>
</p>
<p>
	<label>Package Quantity:</label>
	<span class="TwoColumns"><? echo ( $$variable{'txtPackageQuantity'.$$variable{'QTYIndex'}} ) ?></span>
	<span class="TwoColumns">
	<input name="txtPackageQuantityUsed" value="<? echo ( $$variable{"txtPackageQuantityUsed"} ? $$variable{"txtPackageQuantityUsed"} : $$variable{"txtPackageQuantity".$$variable{'QTYIndex'}} ) ?>" type="text" size="9" onkeyup="this.value=this.value.replace(/\D/g,'');" />
	</span>
</p>
<p>
	<label>Total Weight:</label>
	<span class="TwoColumns"><? echo ( $$variable{"txtTotalWeight$$variable{'QTYIndex'}"} ) ?> lbs</span>
	<span class="TwoColumns">
	<input name="txtTotalWeightUsed" value="<? echo ( $$variable{"txtTotalWeightUsed"} ? $$variable{"txtTotalWeightUsed"} : $$variable{"txtTotalWeight".$$variable{'QTYIndex'}}) ?>" type="text" size="9" onkeyup="this.value=this.value.replace(/[^\.\d]/g,'');" /> lbs
	</span>
</p>
