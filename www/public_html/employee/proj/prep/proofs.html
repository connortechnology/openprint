<script type="text/javascript">
function check_input( form, signature_index ) {
    if ( form.elements['txtProofQuantity-'+signature_index].value ) {
        if ( ! form.elements['txtProofWidth-'+signature_index].value ) {
            alert('Please enter the width of the additional proofs');
            return false;
        } else if ( ! form.elements['txtProofHeight-'+signature_index].value ) {
            alert('Please enter the height of the additional proofs');
            return false;
        } else if ( ! get_ddm_value(form.elements['ddmProofType-'+signature_index] ) ) {
            alert('Please enter the type of the additional proofs');
            return false;
        } // end if
    } // end if
    return true;
} // end function check_input
</script>
