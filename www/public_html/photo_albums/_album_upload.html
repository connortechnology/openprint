<fieldset><legend>Photos</legend>
	<div id="assets" class="droparea">
<? if ( $$variable{'Album'}->can_edit() ) ?>
		<div id="Photos"><!--#include virtual="/photo_albums/_album_photos.html"--></div>
		<div id="uploadinstructions">
			To upload files to this album,
			<span id="dragndropuploadmessage" style="display:none;">
			simply drag and drop them here. Or </span>
			<span id="formuploadmessage">select the file using the input below and click on the Upload button. There is a 1GB file size limit.</span>
		</div>
		<input type="file" name="file" /><? echo ( ssi::button( 'Upload', { onclick=>q`$('f1').submit();` } ); ) ?>
		<ul id="upload_list" class="preview"></ul>
<div id="file-uploader"></div>
	</div>
	<div class="disclaimer"><? echo ( $config{'PhotoUploadDisclaimer'} ) ?></div>
<? else ( $$variable{'Album'}->can_edit() ) ?>
		<div id="Photos"><!--#include virtual="/photo_albums/_album_photos.html"--></div>
<? endif ( $$variable{'Album'}->can_edit() ) ?>
</fieldset>
<script type="text/javascript">
    if ( window.FileReader ) {
        $('dragndropuploadmessage').show();
    } else {
        $('dragndropuploadmessage').show();
        $('formuploadmessage').hide();
    }
if ( 0 ) {
var uploader = new qq.FileUploader({
    element: $('file-uploader'),
    droparea: $('assets'),
    action: '/upload.htm',
    limit: 5,
    allowedExtensions: ['jpg', 'jpeg', 'png', 'gif','bmp','pdf'],
    sizeLimit: 2147483647,
    params: {
        id: <? echo ( $$variable{'Album'}->id() ) ?>,
        UploadType: 'Photo_Album'
    },
    onComplete: function(id, fileName){
        new Ajax.Updater( 'Photos', '/photo_albums/_album_photos.html', { parameters: { album_id: <? echo ( $$variable{'Album'}->id() ) ?> } } );
    }

});
} else {
    var droparea = $('assets');
    //ul.addEventListener('dragstart',dragStart, false);
    droparea.addEventListener('dragenter',dragEnter, false);
    droparea.addEventListener('dragover',dragOver, false);
    droparea.addEventListener('dragleave',dragLeave, false);
    droparea.addEventListener('drop', handleDrop, false );
    droparea.upload_list = $('upload_list');
    droparea.refresh = function( filename ) {
        new Ajax.Updater( 'Photos', '/photo_albums/_album_photos.html', { parameters: { album_id: '<? echo ( $$variable{'Album'}->id() ) ?>', filename: filename, func: 'add' } } );
    };
    droparea.onComplete= function(id, fileName){
        new Ajax.Updater( 'Photos', '/photo_albums/_album_photos.html', { parameters: { album_id: <? echo ( $$variable{'Album'}->id() ) ?> } } );
    }
    droparea.destination = '/upload.htm?UploadType=Photo_Album&id=<? echo ( $$variable{'Album'}->id() ) ?>';
} 
</script>
