<fieldset><legend>Photos</legend>
<? if ( $$variable{'Album'}->can_edit() ) ?>
	<div id="assets" class="qq-uploader">
		<div class="droparea qq-upload-drop-area">
		<div id="Photos"><?include('/photo_albums/_album_photos.html') ?></div>
		<div id="uploadinstructions">
			To upload files to this album,
			<span id="dragndropuploadmessage" style="display:none;">
			simply drag and drop them here. Or </span>
			<span id="formuploadmessage"> click on the Upload button. There is a 1GB file size limit.</span>
		</div>
		<? echo ( button( 'Upload', { class=>'qq-upload-button' } ); ) ?>
		<span class="qq-drop-processing"><span></span><span class="qq-drop-processing-spinner"></span></span>
		<ul id="upload_list" class="qq-upload-list"></ul>
	</div>
</div>
	<fieldset><legend>Search for Assets</legend>
		<ul id="asset_search">
			<li><label>Name</label><input type="text" name="asset_name_search" onkeydown="if(event.keyCode == 13){new Ajax.Updater( 'asset_search_results', '/article/_asset_search_results.html', { parameters: { asset_name: this.value } } ); return false;};return true;"/></li>
		</ul>
		<ul id="asset_search_results"><? include('/article/_asset_search_results.html') ?></ul>
	</fieldset>
	<div class="disclaimer"><? echo ( sets::isin( $session{'user_type'}, ['E','A'] ) ? 'Disclaimer hidden.' : $config{'PhotoUploadDisclaimer'} ) ?></div>
<? else ( $$variable{'Album'}->can_edit() ) ?>
	<div id="Photos"><? include('/photo_albums/_album_photos.html') ?></div>
<? endif ( $$variable{'Album'}->can_edit() ) ?>
</fieldset>
<? if ( $$variable{'Album'}->can_edit() ) ?>
<script type="text/javascript">
    if ( window.FileReader ) {
        $('dragndropuploadmessage').show();
    } else {
        $('dragndropuploadmessage').show();
        $('formuploadmessage').hide();
    }

	var uploader = new qq.FineUploader({
		element: $('assets'),
		request: {
			endpoint: '/upload.htm',
			paramsInBody: false,
			params: {
				id: '<? echo ( $$variable{Album}->id() ) ?>',
				UploadType: '<? echo ( my $type = ref $$variable{Album}; $type =~ s/^openprint:://; return $type; ) ?>'
			}
		},
		validation: {
			allowedExtensions: ['jpg', 'jpeg', 'png', 'gif','bmp','pdf','flv','avi','mp4'],
			sizeLimit: 1024*1024*1024
		},
		template: null,
		callbacks: {
			onComplete: function(id, fileName){
				new Ajax.Updater( 'Photos', '/photo_albums/_album_photos.html', { parameters: { album_id: '<? echo ( $$variable{'Album'}->id() ) ?>', album_type: '<? echo ( ref $$variable{'Album'} ) ?>' } } );
			}
		},
		dragAndDrop: {
			hideDropzones: false
		},
		failedUploadTextDisplay: {
			mode: 'custom',
		}
	});
</script>
<? endif ( $$variable{'Album'}->can_edit() ) ?>
