<form name="f1" id="f1" action="/product/category.html?category_id=<? echo ( $$variable{Category}->id(); ) ?>" method="post">

		<legend>
		<? echo (
			return $param{category_id} ? 'Editing Category '. $$variable{Category}->name() : 'Add New Category';
		) ?>
		</legend>
		<div class="leftColumn">

		<li>

			<input type="text" id="name" name="name" value="<? hecho ( $$variable{Category}->name(); ) ?>"  />
		</li>
		<li>
			<label>Description</label>
			<textarea id="description" name="description" rows="4" onkeyup="textarea_resize(this);"><? hecho ( $$variable{Category}->description(); ) ?></textarea>
		</li>
		<li>
			<label>Sort</label>

		</ul>
		<p class="buttons">
			<? echo ( join("\n",

			button( 'Reset', { onclick=>'f1.reset();' } ),
			); ) ?>
		</p>
		</div>
		<div class="rightColumn" style="overflow: hidden;">
		<?eval($$variable{Object}=$$variable{Category};)?>

    <? eval ( $$variable{Album} = $$variable{Category};) ?>
    <?include(/photo_albums/_album_upload.html)?>
