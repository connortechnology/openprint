<fieldset><legend>Assets</legend>
	<div id="asset_droparea" class="droparea qq-upload-drop-area">
		<ul id="Assets"><!--#include virtual="/article/_assets.html"--></ul>
		<div id="uploadinstructions">
			To upload files,
			<span id="dragndropuploadmessage" style="display:none;">
			simply drag and drop them here. Or </span>
			<span id="formuploadmessage"> click on the Upload button. There is a 1GB file size limit.</span>
		</div>
		<? echo ( ssi::button( 'Upload', { class=>'qq-upload-button' } ); ) ?>
		<ul id="upload_list" class="preview qq-upload-list"></ul>
	</div>
	<fieldset><legend>Search for Assets</legend>
		<ul id="asset_search">
			<li><label>Name</label><input type="text" name="asset_name_search" onkeydown="if(event.keyCode == 13){new Ajax.Updater( 'asset_search_results', '_asset_search_results.html', { parameters: { asset_name: this.value } } ); };"/></li>
		</ul>
		<ul id="asset_search_results"><!--#include virtual="/article/_asset_search_results.html"--></ul>
	</fieldset>
</fieldset>
<script type="text/javascript">
    if ( window.FileReader ) {
        $('dragndropuploadmessage').show();
    } else {
        $('dragndropuploadmessage').show();
        $('formuploadmessage').hide();
    }

	var uploader = new qq.FileUploader({
		debug: true,
		element: $('asset_droparea'),
		template: null,
		droparea: $('asset_droparea'),
		action: '/upload.htm',
		limit: 5,
		allowedExtensions: ['jpg', 'jpeg', 'png', 'gif','bmp','pdf'],
		sizeLimit: 1024*1024*1024,
		params: {
			id: '<? echo ( $$variable{'Article'}->id() ) ?>',
			UploadType: '<? echo ( my $type = ref $$variable{'Article'}; $type =~ s/^openprint:://; return $type; ) ?>'
		},
		other_types: [ {
			type: 'application/x-moz-file-promise-dest-filename',
			onComplete: function(e,item) {
				 new Ajax.Updater( 'Assets', '/article/_assets.html', { 
					parameters: { 
						article_id: '<? echo ( $$variable{'Article'}->id() ) ?>',
						filename: e.dataTransfer.getData(item),
						func: 'add',
						} } );
			}
		} ],
		onComplete: function(id, fileName){
			new Ajax.Updater( 'Assets', '/article/_assets.html', { parameters: { article_id: '<? echo ( $$variable{'Article'}->id() ) ?>' } } );
		}

	});
</script>
