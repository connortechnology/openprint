<div class="Delivery">
	<h1>Delivery Information</h1>
	<div class="full-form">
		<ul class="full-form-frame">
			<li>
				<label>Pick-Up or Delivery</label>
				<input type="radio" name="UPSShipping" id="UPSShippingN" value="N" onclick="$('UPSOptions').hide();$('ShippingPrice').hide();calc(this.form.name);" <? echo ( ssi::checked( $$variable{'UPSShipping'} ne 'Y' ); ) ?> />
				<label class="radio" for="UPSShippingN">Pickup</label>
				<input type="radio" name="UPSShipping" id="UPSShippingY" value="Y" onclick="$('UPSOptions').show();$('ShippingPrice').show();calc(this.form.name);" <? echo ( ssi::checked( $$variable{'UPSShipping'} eq 'Y' ); ) ?> />
				<label class="radio" for="UPSShippingY">Delivery</label>
			</li>
		</ul>
	</div>
	<div class="full-form" id="UPSOptions" <? echo ( $$variable{'UPSShipping'} eq 'Y' ? '' : 'style="display:none;"' ) ?> >
		<ul class="full-form-frame">
			<li class="ToCountry">
				<label>Country:</label>
				<select id="ToCountry" name="ToCountry" onchange="Country_onchange(this);calc(this.form.name);">
				<option value=""> Select </option>
				<? echo ( ssi::return_countries( $$variable{'ToCountry'} ); ) ?>
				</select>
			</li>
			<li class="ToPostalCode">
				<label><span id="ToCountry_postal">
					<? echo (
                       if ( $$variable{'ToCountry'} eq 'US' ) {
                               return 'Zip Code:';
                       } elsif ( $$variable{'ToCountry'} eq 'CA' ) {
                               return 'Postal Code:';
                       } else {
                               return 'Zip/Postal Code:';
                       } # end if
                    ) ?></span></label>
				<input type="text" id="ToPostalCode" name="ToPostalCode" value="<?ToPostalCode?>" onkeyup="calc(this.form.name);"/>
			</li>
			<li class="ServiceTypes">
				<label>Service Type:</label>
				<span id="ServiceTypeDiv">
					Please wait while services types are loaded.
					<input type="hidden" name="ddmServiceType" value="<?ddmServiceType?>" />
				</span>
			</li>
			<li class="PickupTypes">
				<label>Pickup Type:</label>
				<span id="PickupTypeDiv">
					Please wait while pickup types are loaded.
					<input type="hidden" name="ddmPickupType" value="<?ddmPickupType?>" />
				</span>
			</li>
		</ul>
	</div>
	<div id="ShippingPrice" <? echo ( $$variable{'UPSShipping'} eq 'Y' ? '' : 'style="display:none;"' ) ?>>
		<ul>
			<li>
				<label>Delivery Cost <? echo ( openprint::Currency::get_current()->symbol() ) ?></label>
				<input type="text" id="ShippingPrice1" name="ShippingPrice1" size="9" readonly="readonly" onfocus="this.blur();" />
			</li>
		</ul>

	</div>
	<br class="spacer"/>
</div>
