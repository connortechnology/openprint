<? while ( @$variable{'SignatureGroupIndex','Reference'} = splice @{$$variable{'SignatureGroups'}},0,2; ) ?>

	Information for &nbsp;<b><?Reference?></b><br/>
	<? endif ( $$variable{'Reference'} ) ?>
	<label>Quantity, size &amp; type of proof</label>
	<? echo ( 
		my $html;
		foreach my $qty_index ( $$variable{Project}->quantity_indexes() ) {
			$html .= '<div class="value">';
			$html .= openprint::Estimating::Proofs::summary( $$variable{Project}, $$variable{ServiceIndex}, undef, $qty_index );

		} # end foreach qty_index

) ?>
