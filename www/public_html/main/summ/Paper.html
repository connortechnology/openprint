<p>
	<label>&nbsp;</label>
	<? eval ( $$variable{'QTYIndex'} = 1 ) ?>
	<? while ( $$variable{'QTYIndex'} <= 3 ) ?>
	<? if ( $$variable{'txtQuantity'.$$variable{'QTYIndex'}} ) ?>
	<span class="value">
		<? echo ( openprint::service::summary( $$variable{'Project'}->id(), $$variable{'ServiceIndex'}, $$variable{'QTYIndex'} ); ) ?>
	</span>
	<? endif ( $$variable{'txtQuantity'.$$variable{'QTYIndex'}} ) ?>
	<? eval ( $$variable{'QTYIndex'} += 1 ) ?>
	<? endwhile ( $$variable{'QTYIndex'} <= 3 ) ?>
</p>
<p>
	<label>MPrice:</label>
	<? eval ( $$variable{'QTYIndex'} = 1 ) ?>
	<? while ( $$variable{'QTYIndex'} <= 3 ) ?>
	<? if ( $$variable{'txtQuantity'.$$variable{'QTYIndex'}} ) ?>
	<span class="value"><? echo ( $$variable{'MPrice'.$$variable{'QTYIndex'}} ) ?></span>
	<? endif ( $$variable{'txtQuantity'.$$variable{'QTYIndex'}} ) ?>
	<? eval ( $$variable{'QTYIndex'} += 1 ) ?>
	<? endwhile ( $$variable{'QTYIndex'} <= 3 ) ?>
</p>
