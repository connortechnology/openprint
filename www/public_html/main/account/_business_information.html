<fieldset>
	<legend>Business Information:</legend>
	<p> 
		<label for="businessname">Legal Name: <span class="requiredFieldIndicator">*</span></label>
		<input type="text" id="businessname" name="business_name" value="<? hecho ( $$variable{'Company'}->business_name() ) ?>" />
	</p>
	<p> 
		<label>Legal Form: <span class="requiredFieldIndicator">*</span></label>
		<input type="radio" id="business_formCorporation" name="business_form" value="Corporation" <? echo ( 'checked="checked"' if $$variable{'Company'}->business_form() eq 'Corporation' ) ?> />
		<label class="radio" for="business_formCorporation">Corporation</label>
		<input type="radio" id="business_formSoleProprietor" name="business_form" value="SoleProprietor" <? echo ( 'checked="checked"' if $$variable{'Company'}->business_form() eq 'SoleProprietor' ) ?> />
		<label class="radio" for="business_formSoleProprietor">Sole Proprietor</label>
		<input type="radio" id="business_formPartnership" name="business_form" value="Partnership" <? echo ( 'checked="checked"' if $$variable{'Company'}->business_form() eq 'Partnership' ) ?> />
		<label class="radio" for="business_formPartnership">Partnership</label>
	</p>
	<p> 
		<label for="business_type">Business Type: <span class="requiredFieldIndicator">*</span></label>
		<input type="text" id="business_type" name="business_type" value="<? hecho ( $$variable{'Company'}->business_type() ) ?>" />
	</p>
	<p> 
		<label for="StartYear">Year Established: <span class="requiredFieldIndicator">*</span></label>
		<input type="text" id="StartYear" name="StartYear" size="6" style="width: auto;" maxlength="4" value="<? echo ( 
			if ( $$variable{'Company'}->established() ) {
			$$variable{'Company'}->established() =~ /(\d\d\d\d)-(\d\d)-(\d\d)/;
			return $1;
			} # end if
		) ?>" />
	</p>
	<p> 
		<label for="president_owner">President/CEO/Owner: <span class="requiredFieldIndicator">*</span></label>
		<input type="text" id="president_owner" name="president_owner" value="<? hecho ( $$variable{'Company'}->president_owner() ) ?>" />
	</p>
	<p> 
		<label for="employees">Number of Employees: <span class="requiredFieldIndicator">*</span></label>
		<select size="1" id="employees" name="employees">
			<option value="input"> Select </option>
			<? echo ( ssi::getemployee_numbers( $r, $log, $dbh, $$variable{'Company'}->employees() ); ) ?>
		 </select>
	</p>
	<p> 
		<label for="annual_sales">Annual Sales: <span class="requiredFieldIndicator">*</span></label>
		<select size="1" id="annual_sales" name="annual_sales">
			<option value=""> Select </option>
			<? echo ( ssi::getannual_sales( $r, $log, $dbh, $$variable{'Company'}->annual_sales() ); ) ?>
		</select>
	</p>
	<p> 
		<label for="gst_number">
			<? if ( $openprint::session{'Country'} eq 'US' ) ?>Federal ID #/SSN #:<? endif ( $openprint::session{'Country'} eq 'US' ) ?>
			<? if ( $openprint::session{'Country'} eq 'CA' ) ?>GST #:<? endif ( $openprint::session{'Country'} eq 'CA' ) ?>
			<span class="requiredFieldIndicator">*</span>
		</label>
		<input type="text" id="gst_number" name="gst_number" value="<? hecho ( $$variable{'Company'}->gst_number() ) ?>" />
	</p>
	<p> 
		<label for="pst_number">
		<? echo (
			if ( $openprint::session{'Country'} eq 'US' ) {
				return 'State Tax #:';
			} elsif ( $openprint::session{'Country'} eq 'CA' ) {
				return 'Provincial Tax #:';
			} else {
				return 'State/Provincial Tax #:';
			} # end if
		) ?> <span class="requiredFieldIndicator">*</span></label>
		<input type="text" id="pst_number" name="pst_number" value="<? hecho ( $$variable{'Company'}->pst_number() ) ?>" />
	</p>
</fieldset>
