<fieldset>
	<legend>Business Information:</legend>
	<p> 
		<label for="businessname">Legal Name: <span class="requiredFieldIndicator">*</span></label>
		<input type="text" id="businessname" name="business_name" value="<? hecho ( $param{'business_name'} ? $param{'business_name'} : $$variable{'Company'}->business_name() ) ?>" />
	</p>
	<p> 
		<label>Legal Form: <span class="requiredFieldIndicator">*</span></label>
		<? echo ( ssi::radio( 'business_form', [ 'Corporation','Corporation', 'SoleProprietor', 'Sole Proprietor', 'Partnership', 'Partnership' ], $param{'business_form'} ? $param{'business_form'} : $$variable{'Company'}->business_form() ); ) ?>
	</p>
	<p> 
		<label for="business_type">Business Type: <span class="requiredFieldIndicator">*</span></label>
		<input type="text" name="business_type" value="<? hecho ( $param{'business_type'} ? $param{'business_type'} : $$variable{'Company'}->business_type() ) ?>" />
	</p>
	<p> 
		<label for="StartYear">Year Established: <span class="requiredFieldIndicator">*</span></label>
		<input type="text" name="StartYear" id="StartYear" maxlength="4" value="<? echo ( 
			return $param{'StartYear'} if $param{'StartYear'};
			if ( $$variable{'Company'}->established() ) {
				$$variable{'Company'}->established() =~ /(\d\d\d\d)-(\d\d)-(\d\d)/;
				return $1;
			} # end if
		) ?>" />
	</p>
	<p> 
		<label for="president_owner">President/CEO/Owner: <span class="requiredFieldIndicator">*</span></label>
		<input type="text" id="president_owner" name="president_owner" value="<? hecho ( $param{'president_owner'} ? $param{'president_owner'} : $$variable{'Company'}->president_owner() ) ?>" />
	</p>
	<p> 
		<label for="employees">Number of Employees: <span class="requiredFieldIndicator">*</span></label>
		<select size="1" id="employees" name="employees">
			<option value="input"> Select </option>
			<? echo ( ssi::getemployee_numbers( $r, $log, $dbh, $param{'employees'} ? $param{'employees'} : $$variable{'Company'}->employees() ); ) ?>
		 </select>
	</p>
	<p> 
		<label for="annual_sales">Annual Sales: <span class="requiredFieldIndicator">*</span></label>
		<select size="1" id="annual_sales" name="annual_sales">
			<option value=""> Select </option>
			<? echo ( ssi::getannual_sales( $r, $log, $dbh, $param{'annual_sales'} ? $param{'annual_sales'} : $$variable{'Company'}->annual_sales() ); ) ?>
		</select>
	</p>
	<p> 
		<label for="gst_number">
			<? if ( $session{'Country'} eq 'US' ) ?>Federal ID #/SSN #:<? endif ( $session{'Country'} eq 'US' ) ?>
			<? if ( $session{'Country'} eq 'CA' ) ?>GST #:<? endif ( $session{'Country'} eq 'CA' ) ?>
			<span class="requiredFieldIndicator">*</span>
		</label>
		<input type="text" name="gst_number" value="<? hecho ( $param{'gst_number'} ? $param{'gst_number'} : $$variable{'Company'}->gst_number() ) ?>" />
	</p>
	<p> 
		<label for="pst_number">
		<? echo (
			if ( $session{'Country'} eq 'US' ) {
				return 'State Tax #:';
			} elsif ( $session{'Country'} eq 'CA' ) {
				return 'Provincial Tax #:';
			} else {
				return 'State/Provincial Tax #:';
			} # end if
		) ?> <span class="requiredFieldIndicator">*</span></label>
		<input type="text" id="pst_number" name="pst_number" value="<? hecho ( $param{'pst_number'} ? $param{'pst_number'} : $$variable{'Company'}->pst_number() ) ?>" />
	</p>
</fieldset>
