<div class="Order">
	<div class="error"><?error?><?Error?></div>

	<form method="post" name="f1" action="submit.html">
		If you have a purchase order number please enter it below.<br/>
		<br/>
		(Fields marked with an * are required.)
		<br/>
		<br/>
		<div style="float: left; width: 49%; min-width: 320px;">
			<fieldset>
				<p> 
					<label>Purchase Order:</label>
					<input type="text" name="txtPurchaseOrder" value="<?txtPurchaseOrder?>" />
				</p>
<? if ( (! $openprint::session{'company_id'}) and sets::isin($openprint::session{'user_type'}, ['A','E'] ) ) ?>
				<p>
					<label>Company:</label>
					<select name="company_id">
					<option value="">Select a Company</option>
					<? echo ( 
							openprint::obj_customer::get_customer_dropdown( $log, $dbh, $openprint::session{'company_id'} );
							) ?>
					</select>
				</p>
<? endif ( (! $openprint::session{'company_id'}) and sets::isin($openprint::session{'user_type'}, ['A','E'] ) ) ?>
			</fieldset>
			<!--#include virtual="_contact_information.html"-->
		</div>
		<div style="float: right; width: 49%; min-width: 320px;">
			<? eval ( 
				@{$$variable{'PROJECTS'}} = sql::execute( $log, $dbh, q{SELECT lngProjectIndex, strProjectReference, intQuantityIndex, shippingtype, intQuantity1, intQuantity2, intQUantity3 FROM Order_Contents, tbl_Projects WHERE lngProjectIndex=Index AND OrderIndex=?}, $$variable{'Order'}->id() );
				@{$$variable{'PRODUCTS'}} = $$variable{'Order'}->Products();
 ) ?>
			<? if ( @{$$variable{'PROJECTS'}} or @{$$variable{'PRODUCTS'}} ) ?>
				<? while ( @$variable{'ProjectIndex','Reference','SelectedQuantityIndex','ShippingType','Quantity1','Quantity2','Quantity3'} = splice @{$$variable{'PROJECTS'}},0,7; ) ?>
				<? eval ( $$variable{'Project'} = new openprint::Project( $$variable{'ProjectIndex'} ); ) ?>
				<!--#include virtual="_project_information.html"-->
				<? endwhile ( @$variable{'ProjectIndex','Reference','SelectedQuantityIndex','ShippingType','Quantity1','Quantity2','Quantity3'} = splice @{$$variable{'PROJECTS'}},0,7; ) ?>
				<? if ( @{$$variable{'PRODUCTS'}} ) ?>
				<!--#include virtual="_product_information.html"-->
				<? endif ( @{$$variable{'PRODUCTS'}} ) ?>
			<? else ( @{$$variable{'PROJECTS'}} or @{$$variable{'PRODUCTS'}} ) ?>
				<p>This order appears to be empty.</p>
			<? endif ( @{$$variable{'PROJECTS'}} or @{$$variable{'PRODUCTS'}} ) ?>
		</div>
		<br class="spacer"/>
		<div style="float: right;">
			<? echo ( ssi::writeButton( $log, $dbh, 'AddProject','add_project.gif','','/main/project/history.html','Add Project From History' ); ) ?>
			<? echo ( ssi::writeButton( $log, $dbh, 'SaveAndContinue','save_and_continue.gif','f1.submit();','','Save And Continue' ); ) ?>
		</div>
		<input type="hidden" name="OrderID" value="<?OrderID?>"/>
		<input type="hidden" name="btnFunction" value="Continue"/>
	</form>
</div>
<br class="spacer"/>
