<fieldset>
	<legend>Modification History</legend>
	<table class="List" style="table-layout: auto;">
		<tr>
			<th align="left">Company</th>
			<th align="left">User</th>
			<th align="left" width="150">When</th>
			<th align="left">Description</th>
		</tr>
		<? eval ( @{$$variable{'OrderLog'}} = sql::execute( undef, undef, 'SELECT company_id, user_id, dtmwhen, description FROM Order_Log WHERE order_id=?', $$variable{'OrderID'} ); ) ?>
		<? while ( @$variable{'company_id','user_id','When','Description'} = splice @{$$variable{'OrderLog'}},0,4; ) ?>
		<tr<?rowclass?>>
			<td><? echo ( new openprint::Company( $$variable{'company_id'} )->name() ) ?></td>
			<td><? echo ( new openprint::User( $$variable{'user_id'} )->name() ) ?></td>
			<td><? echo ( Date::Format::time2str( $openprint::config{'DateTimeFormat'}, Date::Parse::str2time( $$variable{'When'} ) ) ); ) ?></td>
			<td><?Description?></td>
		</tr>
		<? eval ( $$variable{'rowclass'} = $$variable{'rowclass'} ? '' : ' class="colRow"'; ) ?>
		<? endwhile ( @$variable{'company_id','user_id','When','Description'} = splice @{$$variable{'OrderLog'}},0,4; ) ?>
	</table>
</fieldset>
