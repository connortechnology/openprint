<p>
	<label>Shipping Type:</label>
	<? echo (
		my $html;
        my %Shipping_Services = map { $_->name(), $_->description() } openprint::ServiceType::find('category'=>'Shipping','order'=>'lower(name)');
		my $services = $$variable{'Project'}->services();
		foreach my $key ( keys %Shipping_Services ) {
			$html .= qq#<input type="checkbox" id="ShippingType$$variable{'ProjectIndex'}$key" name="ShippingType$$variable{'ProjectIndex'}" value="$key" #;
			$html .= 'checked="checked" ' if $$services{$key};
			$html .= qq#/><label class="radio" for="ShippingType$$variable{'ProjectIndex'}$key">$Shipping_Services{$key}</label>#;
		} # end foreach
		return $html;
	) ?>
</p>
