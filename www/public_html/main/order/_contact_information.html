<fieldset><legend>Contact Information</legend>
	<p> 
		<label>Company Name:<span class="requiredFieldIndicator">*</span></label>
		<input type="text" name="txtCompanyName" value="<?txtCompanyName?>"/>
	</p>
	<p> 
		<label>Salutation:<span class="requiredFieldIndicator">&nbsp;</span></label>
		<input type="radio" id="rdbSalutationMr." name="rdbSalutation" value="Mr." <? echo ( 'checked="checked"' if $$variable{'rdbSalutation'} eq 'Mr.' ) ?> />
		<label class="radio" for="rdbSalutationMr.">Mr.</label>
		<input type="radio" id="rdbSalutationMrs." name="rdbSalutation" value="Mrs." <? echo ( 'checked="checked"' if $$variable{'rdbSalutation'} eq 'Mrs.' ) ?> />
		<label class="radio" for="rdbSalutationMrs.">Mrs.</label>
		<input type="radio" id="rdbSalutationMs." name="rdbSalutation" value="Ms." <? echo ( 'checked="checked"' if $$variable{'rdbSalutation'} eq 'Ms.' ) ?> />
		<label class="radio" for="rdbSalutationMs.">Ms.</label>
		<input type="radio" id="rdbSalutationMiss" name="rdbSalutation" value="Miss" <? echo ( 'checked="checked"' if $$variable{'rdbSalutation'} eq 'Miss' ) ?> />
		<label class="radio" for="rdbSalutationMiss">Miss</label>
	</p>
<? if ( sets::isin( $openprint::session{'user_type'}, [ 'A','E'] ) ) ?>
	<p> 
		<label>Name:<span class="requiredFieldIndicator">&nbsp;</span></label>
		<input type="hidden" name="txtFirstName" value="<?txtFirstName?>"/>
		<input type="hidden" name="txtLastName" value="<?txtLastName?>"/>
		<select name="ddmUsers" onchange="ddmUsers_onchange(this.form);">
			<option value="">Please Select</option>
<? echo ( 
ssi::make_drop_down( [ map { $_->id(), $_->name() } openprint::User::find( 'company_id'=>$openprint::session{'company_id'}, 'order'=>'lower(strLastName),lower(strFirstName)' ) ], $openprint::session{'user_id'} );
) ?>
		</select>
	</p>
<? else ( sets::isin( $openprint::session{'user_type'}, [ 'A','E'] ) ) ?>
	<p> 
		<label >First Name:<span class="requiredFieldIndicator">&nbsp;</span></label>
		<input type="text" name="txtFirstName" value="<?txtFirstName?>"/>
	</p>
	<p> 
		<label>Last Name:<span class="requiredFieldIndicator">&nbsp;</span></label>
		<input type="text" name="txtLastName" value="<?txtLastName?>"/>
	</p>
<? endif ( sets::isin( $openprint::session{'user_type'}, [ 'A','E'] ) ) ?>
	<p> 
		<label>Address:<span class="requiredFieldIndicator">*</span></label>
		<input type="text" name="txtAddress1" value="<?txtAddress1?>" /><br/>
		<input type="text" name="txtAddress2" value="<?txtAddress2?>" />
	</p>
	<p> 
		<label>Country:<span class="requiredFieldIndicator">*</span></label>
		<select name="ddmCountry" onchange="Country_onchange(this, this.form.ddmStateProvince);">
			<option value=""> Select </option>
			<? echo ( 
				ssi::make_drop_down( \@countries::countries, $$variable{'ddmCountry'} );
			) ?> 
		</select>
	</p>
	<p> 
		<label>State/Province:<span class="requiredFieldIndicator">*</span></label>
		<select name="ddmStateProvince">
			<option value=""> Select </option>
			<? echo ( 
				ssi::make_drop_down( \@states::states, $$variable{'ddmStateProvince'} ).
				ssi::make_drop_down( \@provinces::provinces, $$variable{'ddmStateProvince'} );
			) ?> 
		</select>
	</p>
	<p> 
		<label>City:<span class="requiredFieldIndicator">*</span></label>
		<input type="text" name="txtCity" value="<?txtCity?>" />
	</p>
	<p> 
		<label>Zip/Postal Code:<span class="requiredFieldIndicator">*</span></label>
		<input type="text" name="txtPostalCode" value="<?txtPostalCode?>" />
	</p>
	<p> 
		<label>Phone:<span class="requiredFieldIndicator">&nbsp;</span></label>
		<input type="text" name="txtPhone" value="<?txtPhone?>" style="width: auto;" size="15" /> ext:
		<input type="text" name="txtExtension" value="<?txtExtension?>" style="width: auto;" size="4" />
	</p>
	<p> 
		<label>Fax:<span class="requiredFieldIndicator">&nbsp;</span></label>
		<input type="text" name="txtFax" value="<?txtFax?>" />
	</p>
	<p> 
		<label>E-mail:<span class="requiredFieldIndicator">*</span></label>
		<input type="text" name="txtEmail" value="<?txtEmail?>" />
	</p>
</fieldset>
