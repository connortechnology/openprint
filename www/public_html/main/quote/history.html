<script type="text/javascript">
	function delete_confirm(form) {
		var number_of_deleted_quotes = 0;
		for ( var index = 0; index < form.elements.length; index += 1 ) {
			if ( form.elements[index].name.substr(0,9) == 'chkDelete' && form.elements[index].checked ) {
				number_of_deleted_quotes += 1;
			} // end if

		} // end for
		if ( number_of_deleted_quotes == 0 ) {
			alert("To Delete Quotes, click the checkbox beside the quote.");
		} else if ( number_of_deleted_quotes == 1 ) {
			if ( confirm("Are you sure you wish to delete this quote from history?\n") ) {
				form.submit();
			} // end if
		} else {
			if ( confirm("Are you sure you wish to delete these " + number_of_deleted_quotes + " quotes from history?\n") ) {
				form.submit();
			} // end if
		} // end if
	} // end function delete_confirrm
	function load_quotes( form ) {
		$('QuoteList').innerHTML = 'Please wait...';
		new Ajax.Updater('QuoteList','/main/quote/_history.html', {method:'get',parameters:form.serialize(true)});
	} // end function load_quotes
</script>
