<fieldset><legend>Modification History</legend>
	<table class="List" style="table-layout: auto;">
	<tr>
	<th align="left">Customer</th>
	<th align="left">User</th>
	<th align="left" width="150">When</th>
	<th align="left">Description</th>
	</tr>
	<? eval ( 
		$_ = q{SELECT company_id, user_id, to_char(dtmTimestamp,'HH12:MIpm MM/DD/YYYY'), Description FROM Project_Log WHERE project_id=? ORDER BY dtmTimestamp DESC};
		@{$$variable{'ProjectLog'}} = sql::execute( $log, $dbh, $_, $openprint::param{'project_id'} );
	) ?>
	<? while ( @$variable{'CustomerIndex','UserIndex','When','Description'} = splice @{$$variable{'ProjectLog'}},0,4; ) ?>
	<tr<?rowclass?>>
	<td><? echo ( new openprint::Company( $$variable{'CustomerIndex'} )->name(); ) ?></td>
	<td><? echo ( new openprint::User( $$variable{'UserIndex'} )->name(); ) ?></td>
	<td width="150"><?When?></td>
	<td><? echo ( $$variable{'Description'} ) ?></td>
	</tr>
	<? eval ( $$variable{'rowclass'} = $$variable{'rowclass'} ? '' : ' class="colRow"'; ) ?>
	<? endwhile ( @$variable{'CustomerIndex','UserIndex','When','Description'} = splice @{$$variable{'ProjectLog'}},0,4; ) ?>
	</table>
</fieldset>
