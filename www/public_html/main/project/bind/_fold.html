<? eval (
	foreach my $p ( 'QTYIndex','index','SignatureIndex' ) {
		if ( ( exists $openprint::param{$p} ) and ! $$variable{$p} ) {
			$$variable{$p} = $openprint::param{$p};
		} # end if
	} # end foreach
) ?>
<span id="Fold-<?SignatureIndex?>-<?QTYIndex?>-<?index?>">
	<input type="text" id="FoldQty-<?SignatureIndex?>-<?QTYIndex?>-<?index?>" name="FoldQty-<?SignatureIndex?>-<?QTYIndex?>-<?index?>" value="<? echo ( $$variable{"FoldQty-$$variable{SignatureIndex}-$$variable{QTYIndex}-$$variable{index}"} ) ?>" size="2" onkeyup="Fold_onchange(this, '<?SignatureIndex?>', '<?QTYIndex?>', '<?index?>' );" />
	<select id="FoldType-<?SignatureIndex?>-<?QTYIndex?>-<?index?>" name="FoldType-<?SignatureIndex?>-<?QTYIndex?>-<?index?>" onchange="Fold_onchange(this, '<?SignatureIndex?>', '<?QTYIndex?>', '<?index?>' );">
		<option value="">select fold</option>
		<? echo ( 
			my @options;
			push @options, map { $_, $openprint::Estimating::Folding::fold_types{$_} } sort keys %openprint::Estimating::Folding::fold_types;
			return ssi::make_drop_down( \@options, $$variable{"FoldType-$$variable{SignatureIndex}-$$variable{QTYIndex}-$$variable{index}"} );
		) ?>
	</select>
	<input type="text" id="FoldFolds-<?SignatureIndex?>-<?QTYIndex?>-<?index?>" name="FoldFolds-<?SignatureIndex?>-<?QTYIndex?>-<?index?>" value="<? echo ( $$variable{"FoldFolds-$$variable{SignatureIndex}-$$variable{QTYIndex}-$$variable{index}"} ) ?>" size="2" onkeyup="Fold_onchange(this, '<?SignatureIndex?>', '<?QTYIndex?>', '<?index?>' );" /> Folds +
	<input type="text" id="FoldAngles-<?SignatureIndex?>-<?QTYIndex?>-<?index?>" name="FoldAngles-<?SignatureIndex?>-<?QTYIndex?>-<?index?>" value="<? echo ( $$variable{"FoldAngles-$$variable{SignatureIndex}-$$variable{QTYIndex}-$$variable{index}"} ) ?>" size="2" onkeyup="Fold_onchange(this, '<?SignatureIndex?>', '<?QTYIndex?>', '<?index?>' );" /> Angles<br/>
</span>
