<script type="text/javascript" src="<? echo ( hash_link('/javascripts/service.js') ) ?>"></script>
<? eval (
	if ( $$variable{'Project'}->quantity1() and $$variable{'Project'}->quantity2() and $$variable{'Project'}->quantity3() ) {
	$$variable{'Columns'} = 'Three';
	} else {
	$$variable{'Columns'} = 'Two';
	} # end if
) ?>
<div class="Service">
	<form id="f1" name="f1" method="post" action="/main/project/view.html">
		<fieldset><legend>Gluing Services</legend>
		<? eval ( @{$$variable{'SignatureGroups'}} = $$variable{'Project'}->signatures(); ) ?>
		<? while ( $$variable{'SignatureServiceIndex'} = shift @{$$variable{'SignatureGroups'}}; ) ?>
			<? eval ( 
					my $sig_specs = openprint::service::get_specs_ref( $$variable{'Project'}, $$variable{'SignatureServiceIndex'} );
					@$variable{'SignatureIndex','Reference'} = @$sig_specs{'SignatureIndex','txtServiceDescription'};
					) ?>
			<fieldset>
				<? if ( $$variable{'Reference'} ) ?>
				<legend><?Reference?></legend><p><? echo ( openprint::service::summary( @$variable{'ProjectIndex','SignatureServiceIndex'} ); ) ?></p>
				<? endif ( $$variable{'Reference'} ) ?>
				<ul>
				<li>
					<label>Glued Area (square inches)</label>
					<input type="number" name="txtArea-<?SignatureIndex?>" value="<? echo ( $$variable{'txtArea-'.$$variable{'SignatureIndex'}} ) ?>" onkeyup="calc(this.form.name);"/>
					<input type="checkbox" id="chkOverrideArea-<?SignatureIndex?>" name="chkOverrideArea-<?SignatureIndex?>" value="Y" onclick="if ( ! this.checked ) calc(this.form.name);" 
					<? echo ( $$variable{'chkOverrideArea-'.$$variable{'SignatureIndex'}} eq 'Y' ? 'checked="checked"' : '' ) ?>
					/>
					<label class="radio" for="chkOverrideArea-<?SignatureIndex?>">Override</label>
				</li>
				</ul>
			</fieldset>
		<? endwhile ( $$variable{'SignatureServiceIndex'} = shift @{$$variable{'SignatureGroups'}}; ) ?>
		</fieldset>
		<fieldset><legend>Results</legend>
			<? echo ( include('/includes/main/proj/quantities_prices.html'); ) ?>
		</fieldset>
		<hr/>
		<? echo ( include('/includes/main/proj/add_to_project.html'); ) ?>
		<input type="hidden" name="btnFunction" value="Save Service" />
		<input type="hidden" name="ProjectIndex" value="<?ProjectIndex?>" />
		<input type="hidden" name="ServiceIndex" value="<?ServiceIndex?>" />
		<input type="hidden" name="ServiceType" value="<?ServiceType?>" />
		<input type="hidden" name="ContinueProject" value="Y" />
	</form>
</div>
