<script type="text/javascript" src="/javascripts/service.js"></script>
<script type="text/javascript" src="/javascripts/scanning.js"></script>
<div class="Service">
	<!--#include virtual="/includes/main/proj/required_fields.html"-->
	<form name="f1" method="post" action="/main/project/view.html">
	<fieldset><legend>Scanning Services</legend>
		<ul>
		<li class="required"> 
			<label>Scanner type</label>
				<input type="radio" id="ScannerDrum" name="rdbScanner" value="Drum" <? echo ( 'checked="checked"' if $$variable{'rdbScanner'} eq 'Drum' ) ?> onclick="calc(this.form.name);" />
				<label class="radio" for="ScannerDrum">Drum</label>
				<input type="radio" id="ScannerFlatbed" name="rdbScanner" value="Flatbed" <? echo ( 'checked="checked"' if $$variable{'rdbScanner'} eq 'Flatbed' ) ?> onclick="calc(this.form.name);" />
				<label class="radio" for="ScannerFlatbed">Flatbed</label>
		</li>
<li class="required"> 
	<label>Original type?</label>
	<select name="ddmOriginal" size="1" onchange="calc('f1');"  >
		<option value="">Please select one</option>
		<option value="Transparency" <?ddmOriginalTransparency?> >Transparency</option>
		<option value="ColourPrint" <?ddmOriginalColourPrint?> >Colour Print</option>
		<option value="BWPrint" <?ddmOriginalBWPrint?> >B&amp;W Print</option>
		<option value="OriginalArtWork" <?ddmOriginalOriginalArtWork?> >Original Art Work</option>
	</select>
</li>
<li class="required"> 
	<label>What is the original dimensions of the item(s) being scanned? (W x H in Inches)</label>
	<input type="number" name="txtScanWidth" value="<?txtScanWidth?>" onkeyup="floatize(this);calc(this.form.name);" />
	<input type="number" name="txtScanHeight" value="<?txtScanHeight?>" onkeyup="floatize(this);calc(this.form.name);" />
	(W x H)
</li>
<li class="required"> 
	<label>Please select the % of enlargement or the final dimensions of the scan(s).</label>
	<input type="number" name="txtPercent" value="<?txtPercent?>" onkeyup="floatize(this);calc_size('f1');"/>
	% or <br/>
	<input type="number" name="txtScanWidthFinal" value="<?txtScanWidthFinal?>" onkeyup="floatize(this);calc_percent_from_width('f1');" />
	<input type="number" name="txtScanHeightFinal" value="<?txtScanHeightFinal?>" onkeyup="floatize(this);calc_percent_from_height('f1');" />
	(W x H)
</li>
<li> 
	<label>What is the required <? echo ( ssi::writeTip('line screen') ) ?>?</label>
	<input type="number" name="ddmLineScreen" value="<?ddmLineScreen?>" onkeyup="cardinalize(this);calc(this.form.name);" />
</li>
<li class="required"> 
	<label>What is the quantity of scan(s) required as per the above specifications?</label>
	<input name="txtQuantity" value="<?txtQuantity?>" type="number" onkeyup="cardinalize(this);calc(this.form.name);" />
</li>
<li> 
	<label>Do you require <? echo ( ssi::writeTip('proofs') ) ?> of the scanned images?</label>
	<input type="radio" id="RandomProofY" name="rdbRandomProof" value="Yes" <? echo ( 'checked="checked"' if $$variable{'rdbRandomProof'} eq 'Yes' ) ?> />
	<label class="radio" for="RandomProofY">Yes</label>
	<input type="radio" id="RandomProofN" name="rdbRandomProof" value="No" <? echo ( 'checked="checked"' if $$variable{'rdbRandomProof'} ne 'Yes' ) ?> /> 
	<label class="radio" for="RandomProofN">No</label>
</li>
<li> 
	<label>Do you require any additional scans for the current project?</label>
	<input type="radio" id="AdditionalY" name="rdbAdditional" value="Yes" />
	<label class="radio" for="AdditionalY">Yes</label>
	<input type="radio" id="AdditionalN" name="rdbAdditional" value="No" checked="checked" />
	<label class="radio" for="AdditionalN">No</label>
</li>
	<!--#include virtual="/includes/main/proj/prices_prepress.html"-->
		</ul>
	</fieldset>
	<!--#include virtual="/includes/main/proj/add_to_project.html"-->
	<!--#include virtual="/includes/main/proj/hdn_fields_prepress.html"-->
	</form>
</div><!--Service-->
