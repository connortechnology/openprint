<div class="PageTitle">
	<h1>PROJECTS</h1>
	<h2>Project Summary</h2>
</div>
<style type="text/css">
<? eval ( 
	$$variable{'QTYS'} = scalar $$variable{Project}->quantity_indexes();
	@{$$variable{quantity_indexes}} = $$variable{Project}->quantity_indexes();
    if ( $$variable{'QTYS'} == 3 ) {
		$$variable{'Columns'} = 'Three';
    } elsif ( $$variable{'QTYS'} == 2 ) {
		$$variable{'Columns'} = 'Two';
    } else {
		$$variable{'Columns'} = 'One';
    } # end if
) ?>

.ProjectSummary .value {
	float: left;
<? if ( $$variable{'QTYS'} == 1 ) ?>
    width: 60%;
<? endif ( $$variable{'QTYS'} == 1 ) ?>
<? if ( $$variable{'QTYS'} == 2 ) ?>
    width: 30%;
<? endif ( $$variable{'QTYS'} == 2 ) ?>
<? if ( $$variable{'QTYS'} == 3 ) ?>
    width: 21%;
<? endif ( $$variable{'QTYS'} == 3 ) ?>
}
</style>
<? if ( $$variable{'ProjectIndex'} eq '' ) ?>
There is no current project. 
<? else ( $$variable{'ProjectIndex'} eq '' ) ?>
<p class="buttons">
	<? echo ( button( 'Print', { onclick=>'window.print();' } ); ) ?>
</p>
<div class="Project">
<?include('/includes/project_header.html')?>
<div class="ProjectSummary">
	<fieldset><legend>Project Information</legend>
	<? echo ( include('/includes/main/summ/project_create_edit.html'); ) ?>
	</fieldset>
	<? while ( @$variable{'ServiceIndex','ServiceTypeName','prod_url'} = splice @{$$variable{'SERVICES'}},0,3; ) ?>
		<? eval ( 
			foreach my $k ( keys %$variable ) {
				if ( $k =~ /^chk/ ) {
				delete $$variable{$k};
				} # end if
			} # end foreach
			openprint::print_project::get_service_specifications( $r, $log, $dbh, $variable, @$variable{'ProjectIndex','ServiceIndex'} );
			$$variable{'ServiceSpecifications'} = openprint::service::get_specs_ref( @$variable{'Project','ServiceIndex'} );
		) ?>
		
		<fieldset><legend><?ServiceTypeName?> <?txtServiceDescription?><?if($$variable{ServiceTypeName} eq 'Signature')?> Form <?SignatureIndex?><?endif($$variable{ServiceTypeName} eq 'Signature')?></legend>
			<? if ( $$variable{'prod_url'} ) ?>
			<? echo ( include('/main/summ/'.$$variable{prod_url}, $variable ); ) ?>
			<? endif ( $$variable{'prod_url'} ) ?>
		</fieldset>
	<? endwhile ( @$variable{'ServiceIndex','ServiceTypeName','prod_url'} = splice @{$$variable{'SERVICES'}},0,3; ) ?>
</div><!-- Project Summary -->
</div>
<? endif ( $$variable{'ProjectIndex'} eq '' ) ?>
<br/>
<p class="buttons">
<? echo ( button( 'ReturnToProjectView', { href=>'view.html?ProjectIndex='.$$variable{'ProjectIndex'}, text=>'Return to Project View' } ); ) ?>
</p>
