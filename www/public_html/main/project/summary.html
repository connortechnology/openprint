<div class="PageTitle">
	<h1>PROJECTS</h1>
	<h2>Project Summary</h2>
</div>
<style type="text/css">
<? eval ( 
	$$variable{'QTYS'} = 0;

	foreach my $qty_index ( 1 .. 3 ) {
		if ( $$variable{'Project'}{'quantity'.$qty_index} ) {
			$$variable{'QTYS'} += 1;
		} # end if
	} # end foreach
) ?>

div.ProjectSummary div.row span.label {
    width: 40%;
}
div.ProjectSummary div.row span.value {
<? if ( $$variable{'QTYS'} == 1 ) ?>
    width: 57%;
<? endif ( $$variable{'QTYS'} == 1 ) ?>
<? if ( $$variable{'QTYS'} == 2 ) ?>
    width: 24%;
<? endif ( $$variable{'QTYS'} == 2 ) ?>
<? if ( $$variable{'QTYS'} == 3 ) ?>
    width: 18%;
<? endif ( $$variable{'QTYS'} == 3 ) ?>
}
</style>
<? if ( $$variable{'ProjectIndex'} eq '' ) ?>
There is no current project. 
<? else ( $$variable{'ProjectIndex'} eq '' ) ?>
	<? echo ( ssi::writeButton( $log, $dbh, 'Print', 'print.gif', 'window.print();', '', 'Print' ); ) ?>
<br class="spacer"/>
<!--#include virtual="/includes/project_header.html" -->
<div class="ProjectSummary">
	<fieldset><legend>Project Information</legend>
	<!--#include virtual="/includes/main/summ/project_create_edit.html" -->
	</fieldset>
	<? while ( @$variable{'ServiceIndex','ServiceTypeName','prod_url'} = splice @{$$variable{'SERVICES'}},0,3; ) ?>
		<? eval ( 
			foreach my $k ( keys %$variable ) {
				if ( $k =~ /^chk/ ) {
				delete $$variable{$k};
				} # end if
			} # end foreach
			openprint::print_project::get_service_specifications( $r, $log, $dbh, $variable, @$variable{'ProjectIndex','ServiceIndex'} );
			$$variable{'ServiceSpecifications'} = openprint::service::get_specs_ref( @$variable{'Project','ServiceIndex'} );
		) ?>
		
		<fieldset><legend><?ServiceTypeName?> <?txtServiceDescription?></legend>
			<? if ( $$variable{'prod_url'} ) ?>
			<!--#include virtual="/main/summ/<?prod_url?>"--><br/>
			<? else ( $$variable{'prod_url'} ) ?>
			<? endif ( $$variable{'prod_url'} ) ?>
		</fieldset>
	<? endwhile ( @$variable{'ServiceIndex','ServiceTypeName','prod_url'} = splice @{$$variable{'SERVICES'}},0,3; ) ?>
</div><!-- Project Summary -->
<? endif ( $$variable{'ProjectIndex'} eq '' ) ?>
<br/>
<span style="float: right;">
<? echo ( ssi::writeButton($log, $dbh, 'ReturnToProjectView', 'back.gif', '', 'view.html?ProjectIndex='.$$variable{'ProjectIndex'}, 'Return to Project View' ); ) ?>
