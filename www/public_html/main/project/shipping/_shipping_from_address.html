<fieldset><legend>From</legend>
	<ul>
	<li> 
		<label>Company</label>
		<input type="text" name="FromCompanyName" value="<?FromCompanyName?>" oninput="calc(this.form.name);"/> 
	</li>
	<li> 
		<label>Address</label>
		<input type="text" name="FromAddress1" value="<?FromAddress1?>" oninput="calc(this.form.name);" /><br/>
		<input type="text" name="FromAddress2" value="<?FromAddress2?>" /> 
	</li>
	<li> 
		<label>City</label>
		<input type="text" name="FromCity" value="<?FromCity?>" oninput="calc(this.form.name);"/> 
	</li>
	<li> 
		<label>Country</label>
		<select name="FromCountry" oninput="Country_oninput(this, this.form.FromStateProvince);calc(this.form.name);">
		<option value=""> Select </option>
		<? echo ( return_countries( $$variable{'FromCountry'} ); ) ?>
		</select>
	</li>
	<li> 
		<label><span id="FromCountry_state">State/Province</span></label>
		<select name="FromStateProvince" oninput="calc(this.form.name);">
		<option value=""> Select </option>
		<? echo ( return_states_and_provinces( $$variable{'FromStateProvince'} ); ) ?>
		</select>
	</li>
	<li> 
		<label><span id="FromCountry_postal">Zip/Postal Code</span></label>
		<input type="text" name="FromPostalCode" value="<?FromPostalCode?>" oninput="calc(this.form.name);"/>
	</li>
	<li> 
		<label>Phone</label>
		<input type="tel" name="FromPhone" value="<?FromPhone?>" oninput="calc(this.form.name);"/>
	</li>
	<li> 
		<label>Fax</label>
		<input type="tel" name="FromFax" value="<?FromFax?>" oninput="calc(this.form.name);"/>
	</li>
	<li> 
		<label>Email</label>
		<input type="email" name="FromEmail" value="<?FromEmail?>" oninput="calc(this.form.name);"/>
	</li>
	</ul>
</fieldset>
