<fieldset><legend>To</legend>
	<ul>
	<li> 
		<label>Company</label>
		<input type="text" name="ToCompanyName" value="<?ToCompanyName?>" oninput="calc(this.form.name);"/> 
	</li>
	<li> 
		<label>Address</label>
		<input type="text" name="ToAddress1" value="<?ToAddress1?>" oninput="calc(this.form.name);" /><br/>
		<input type="text" name="ToAddress2" value="<?ToAddress2?>" oninput="calc(this.form.name);" /> 
	</li>
	<li> 
		<label>City</label>
		<input type="text" name="ToCity" value="<?ToCity?>" oninput="calc(this.form.name);"/> 
	</li>
	<li> 
		<label>Country</label>
		<select name="ToCountry" oninput="Country_oninput(this, this.form.ToStateProvince);calc(this.form.name);">
		<option value=""> Select </option>
		<? echo ( return_countries( $$variable{'ToCountry'} ); ) ?>
		</select>
	</li>
	<li> 
		<label><span id="ToCountry_state">State/Province</span></label>
		<span id="ToStateProvince_container">
		<select name="ToStateProvince" id="ToStateProvince" oninput="calc(this.form.name);">
		<option value=""> Select </option>
		<? echo ( return_states_and_provinces( $$variable{'ToStateProvince'} ); ) ?>
		</select>
		</span>
	</li>
	<li> 
		<label><span id="ToCountry_postal">Zip/Postal Code</span></label>
		<input type="text" name="ToPostalCode" value="<?ToPostalCode?>" oninput="calc(this.form.name);"/>
	</li>
	<li> 
		<label>Phone</label>
		<input type="tel" name="ToPhone" value="<?ToPhone?>" oninput="calc(this.form.name);"/>
	</li>
	<li> 
		<label>Fax</label>
		<input type="tel" name="ToFax" value="<?ToFax?>" oninput="calc(this.form.name);"/>
	</li>
	<li> 
		<label>Email</label>
		<input type="email" name="ToEmail" value="<?ToEmail?>" oninput="calc(this.form.name);"/>
	</li>
	</ul>
</fieldset>
