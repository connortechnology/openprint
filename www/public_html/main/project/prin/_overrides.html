<div class="Overrides">
<fieldset><legend>Overrides</legend>
	<ul>
	<li>
		<label>Stock Format</label>
		<? echo ( radio( 'StockType-'.$$variable{Signature}, [ '', 'Auto', 'Roll', 'Roll', 'Sheet','Sheet' ], $$variable{'StockType-'.$$variable{'Signature'}} ); ) ?>
	</li>
	<li>
		<label>Runstyle</label>
		<select name="ddmRunStyle-<?Signature?>" size="1">
			<option value="">Auto</option>
			<? echo ( make_drop_down( $$variable{'RunStyleOptions'}, $$variable{"ddmRunStyle-$$variable{Signature}"} ); ) ?>
		</select>
	</li>
	<li>
		<label>Press</label>
		<select name="ddmPress-<?Signature?>" size="1">
			<option value="">Auto</option>
			<? echo ( make_drop_down( [ map { $_->strid(), $_->name() } openprint::Equipment->find('category any'=>'Printing',useinestimating=>1, order=>'lower(strname)') ], $$variable{"ddmPress-$$variable{Signature}"} ); ) ?>
		</select>
	</li>
<? echo ( my $html;
	my @PrintingTypes = sql::execute( undef, undef, q{SELECT DISTINCT strValue FROM tbl_Equipment_Specifications WHERE strName='Printing Type'} );
	if ( @PrintingTypes > 1 ) {
		$html .= '<li><label>Printing type</label>';
		$html .= ssi::select( [ '', 'Auto', map { $_, $_ } @PrintingTypes ], $$variable{"PrintingType-$$variable{Signature}"}, { name=>"PrintingType-$$variable{Signature}", size=>1 } );
		$html .= '</li>';
	} # end if
	return $html;
) ?>
	</ul>
</fieldset>
</div>
