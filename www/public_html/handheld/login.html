<script type="text/javascript">
	var Users = new Array();
	<? echo (
		my $html;
		foreach my $U ( openprint::User::find( 'type'=>['A','E'] ) ) {
			$html .= sprintf( qq{	Users[%d] = '%s';\n}, $U->id(), $U->email() );
		} # end foreach
		return $html;
	) ?>
	function select_user( element ) {
		if ( element.value.charAt(0) == 'E' ) {
			element.value = element.value.substr(1,element.value.length-1);
		} // end if
		if ( Users[1*element.value] ) {
			element.form.txtEmail.value = Users[1*element.value];
			element.form.txtPassword.focus();
		} else {
			element.form.txtEmail.value = 'User not found: ' + element.value;
		
		} // end if

	}
</script>
