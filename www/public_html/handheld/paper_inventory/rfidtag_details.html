<div class="error"><?error?></div>
<div class="information"><?information?></div>
<form id="f1" name="f1" action="rfidtag_details.html" method="post">
	<fieldset>
		<p>
			<label for="rfidtag_id">RFID #:</label>
			<input type="text" id="rfidtag_id" name="rfidtag_id" onkeypress="return input_handler(this, event);" onchange="change_handler(this);if(this.value){this.form.submit();}" onfocus="if(this.value.length>16){this.value='';}" size="16"/>
			<? echo ( ssi::writeButton( $log, $dbh, 'Go', 'go.gif', "f1.submit();", '', 'Go' ) ) ?>
		</p>
	</fieldset>
</form>
<hr/>
<? if ( $$variable{'RFIDTag'} ) ?>

	<input type="hidden" name="rfidtag_id" value="<? echo ( $$variable{'RFIDTag'}->id() ) ?>" />
	<fieldset>
		<p class="buttons">
			<? echo ( join('',
						ssi::writeButton( $log, $dbh, 'Save', 'save.gif', "f2.btnFunction.value='Save';f2.submit();", '', 'Save' ),

						ssi::writeButton( $log, $dbh, 'Reset', 'reset.gif', 'f2.reset();', '', 'Reset' ),
						); ) ?>
		</p>
		<p>
			<label>Tag #:</label>
			<? echo ( $$variable{'RFIDTag'}->id() ) ?>
		</p>
		<? if ( $$variable{'RFIDTag'}->type() eq 'Skid' ) ?>
		<p>
			<label for="skid_id">Skid #:</label>
			<input type="text" id="skid_id" name="skid_id" value="<? echo ( $$variable{'RFIDTag'}->skid_id() ) ?>" onkeypress="return input_handler(this, event);" onchange="change_handler(this);" />
		</p>
		<p>
			<label for="verification_code">Verification:</label>
			<input type="text" id="verification_code" name="verification_code" onchange="change_handler(this);" onkeypress="return input_handler(this,event);" />
		</p>

			<label for="location_id">Location:</label>
			<select id="location_id" name="location_id">
				<option value="">select</option>

					return ssi::make_drop_down( [ map { $_->id(), $_->name() } openprint::Location::find('order'=>'lower(name)')], $openprint::param{'location_id'} ? $openprint::param{'location_id'} : $$variable{'RFIDTag'}->location_id() );
					) ?>
			</select>
		</p>
<? if ( $$variable{'RFIDTag'}->type() eq 'Skid' ) ?>
<? eval ( $$variable{'Skid'} = $$variable{'RFIDTag'}->Skid() ) ?>

			<!--#include virtual="_map.html"-->
		</div>

	<input type="hidden" name="btnFunction" value="" />
</form>

<? eval ( $$variable{'Skid'}=$$variable{'RFIDTag'}->Skid(); ) ?>
