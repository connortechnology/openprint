<form id="config_form" name="config_form" action="/administrator/managerial/configuration.html" method="post">
	<input type="hidden" name="btnFunction" value="New"/>
	<fieldset><legend>New Configuration Entry</legend>

			<ul>
				<li><label>Name:</label>
					<input type="text" id="name" name="name"/>
				</li>
				<li><label>Description:</label>
					<textarea id="description" name="description" cols="" rows="" onkeyup="textarea_resize(this);"></textarea>

				<li><label>Type:</label>
					<select id="type" name="type">

						<? echo ( ssi::make_drop_down( [ map { $_, $_ } sql::execute( $log, $dbh, 'SELECT DISTINCT category FROM configuration' ) ] ); ) ?>

		</div>
		<p class="buttons">
			<? echo (
				return join('',
					ssi::writeButton( $log, $dbh, 'SaveNew', 'save.gif', q`$('config_form').submit();`, '', 'Save' ),

			) ?>

	</fieldset>
