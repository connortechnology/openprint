<script type="text/javascript">
	function newField( ) {
		new Ajax.Request( '_field_tr.html', { 
				method: 'get', 
				parameters: { 
					action: 'Add'
				},
				onSuccess: function( transport ) {
					$('fields').insert({top: transport.responseText} );
				}
			} 
		);
	} // end function newField
	function copyField( id ) {
		var form = $('f1');
		new Ajax.Request( '_field_tr.html', { 
				parameters: { 
					field_id: id,
					action: 'Copy',
					required: get_value(form.elements['required-'+id])
				},
				onSuccess: function( transport ) {
					$('field-'+ id).insert({after: transport.responseText} );
				}
			} 
		);
	}
	function delField( id ) {
		new Ajax.Request('_field_tr.html', 
			{ 
				method: 'get', 
				parameters: { 
					field_id: id,
					action: 'Delete'
				},
				onSuccess: function( transport ) {
					if ( transport.responseText ) {
						alert( transport.responseText );
					} else {
						var tr = $('field-'+id); tr.parentNode.removeChild(tr);
					} // end if
				}
			} 
		);
	}

	function savePrices( form ) {
		new Ajax.Updater('fields','_fields.html', { 
				method: 'get', 
				parameters : Form.serialize( form ), 
				onSuccess: function(){$('fields').removeClassName('changed');}
			 }
		);
	}
</script>
<div class="UserProfileFields">
<form id="f1" name="f1" action="user_profile_fields.html">
	<table class="List">
		<thead>
			<tr>
				<th>Name</th>
				<th>Type</th>
				<th>Values</th>
				<th>Required</th>
				<th class="buttons">
			<? echo ( ssi::writeButton( $log, $dbh, 'New', 'new.gif', "newField( );", '', 'New' ); ) ?>
				</th>
			</tr>
		</thead>
		<tbody id="fields">
	<? echo ( 
		my $html;
		foreach my $Field ( openprint::User_Profile_Fields->find('order'=>'lower(name)') ) {
			$$variable{'Field'} = $Field;
			$html .= ssi::include( '_field_tr.html' );
		} # end foreach Field
		return $html;
	) ?>
		</tbody>
	</table>
</form>
</div>
