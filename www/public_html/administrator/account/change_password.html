<?message?><br>
<br>
<form name="f1" method="post" action="<?SecureSiteURL?>/administrator/account/change_password_confirmation.html">
	<div class="row"> 
		<span class="label">Old Password:</span>
		<span class="input"> 
			<input type="password" name="txtOldPassword">
		</span>
		<br class="spacer"/>
	</div>
	<div class="row"> 
		<span class="label">New Password:</span>
		<span class="input"> 
			<input type="password" name="txtNewPassword">
		</span>
		<br class="spacer"/>
	</div>
	<div class="row"> 
		<span class="label">Confirm Password:</span>
		<span class="input"> 
			<input type="password" name="txtConfirmPassword">
		</span>
		<br class="spacer"/>
	</div>
	<div class="row"> 
		<span class="buttons">
			<script type="text/javascript">
				writeButton( 'Submit', 'submit.gif', 'f1.submit();', '', 'Submit' );
				writeButton( 'Reset', 'reset.gif', 'f1.reset();', '', 'Reset' );
			</script>
		</span>
		<br class="spacer"/>
	</div>
</form>
