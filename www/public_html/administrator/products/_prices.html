<? eval (
	if ( $openprint::param{'btnFunction'} ) {
		require openprint::administrator_products;
		openprint::administrator_products::prices( );
	} # end if
) ?>
<style type="text/css">
	.Add {
		width: 20px;
		text-align: center;
	}
	.Range  {
		width: auto;
		text-align: center;
	}
	table.List tr td.Range input, table.List tr td.Range input[type="text"] {
		width: 48%;
	}
	.Units {
		width: 90px;
		text-align: center;
	}
	.Cost {
		width: 90px;
		text-align: center;
	}
	.Markup {
		width: 80px;
		text-align: center;
	}
	.Price {
		width: 90px;
		text-align: center;
	}
	.Discount {
		width: 100px;
		text-align: center;
	}

	.Equipment {
		width: 100%;
		padding: 5px;
		margin-bottom: 5px;
		background-color: #f1eee5;
border: 1px solid;
	}
</style>
<script type="text/javascript" src="/javascripts/pricing.js"></script>
<form id="PricesForm" name="PricesForm" method="post" action="prices.html" enctype="multipart/form-data">
	
	<? eval ( 
		@{$$variable{'Pricelists'}} = openprint::Pricelist::find();
		$$variable{'Product'} = new openprint::Product( $openprint::param{'product_id'} ) if ! $$variable{'Product'};
	) ?>
	<? while ( $$variable{'Pricelist'} = shift @{$$variable{'Pricelists'}} ) ?>
	<fieldset><legend>Prices for Price List: <? echo ( $$variable{'Pricelist'}->name(); ) ?></legend>
		<? eval ( @{$$variable{'Prices'}} = openprint::ProductPrice::find( 'product' => $$variable{'Product'}, 'pricelist' => $$variable{'Pricelist'}, 'order' => 'min' ); ) ?>
		<div class="Equipment">
			<table class="List">
				<tr>
				<th class="Add">&nbsp;</th>
				<th class="Range">Unit Range</th>
				<th class="Units">Units</th>
				<th class="Cost">Cost</th>
				<th class="Markup">Markup</th>
				<th class="Price">Price</th>
				<th class="Discount">Discount</th>
			</tr>
			<? while ( $$variable{'Price'} = shift @{$$variable{'Prices'}}; ) ?>
			<tr> 
				<td class="Add"><input type="checkbox" name="chk-<? echo ( $$variable{'Price'}->id(); ) ?>" checked="checked" /></span>
				<td class="Range"> 
					<input type="text" name="min-<? echo ( $$variable{'Price'}->id(); ) ?>" value="<? echo ( $$variable{'Price'}->min(); ) ?>" >
					<input type="text" name="max-<? echo ( $$variable{'Price'}->id(); ) ?>" value="<? echo ( $$variable{'Price'}->max(); ) ?>" >
				</td>
				<td class="Units"> 
					<input type="text" name="units-<? echo ( $$variable{'Price'}->id(); ) ?>" value="<? echo (  $$variable{'Price'}->units(); ) ?>" >
				</td>
				<td class="Cost"> 
					<input type="text" name="cost-<? echo ( $$variable{'Price'}->id(); ) ?>" value="<? echo (  $$variable{'Price'}->cost(); ) ?>"  onkeyup="calc_from_cost(this);">
				</td>
				<td class="Markup"> 
					<input type="text" name="markup-<? echo ( $$variable{'Price'}->id(); ) ?>" value="<? echo (  $$variable{'Price'}->markup(); ) ?>"  onkeyup="calc_from_markup(this);">
				</td>
				<td class="Price"> 
					<input type="text" name="price-<? echo ( $$variable{'Price'}->id(); ) ?>" value="<? echo (  $$variable{'Price'}->price(); ) ?>"  onkeyup="calc_from_price(this);">
				</td>
				<td class="Discount"> 
					<input type="radio" id="discount-<? echo ( $$variable{'Price'}->id(); ) ?>Y" name="discount-<? echo ( $$variable{'Price'}->id(); ) ?>" value='Y' 
<? echo ( 'checked="checked"' if $$variable{'discount'} ne 'N' ) ?>
 />
					<label class="radio" for="discount-<? echo ( $$variable{'Price'}->id(); ) ?>Y">Yes</label>
					<input type="radio" id="discount-<? echo ( $$variable{'Price'}->id(); ) ?>N" name="discount-<? echo ( $$variable{'Price'}->id(); ) ?>" value='N' 
<? echo ( 'checked="checked"' if $$variable{'discount'} eq 'N' ) ?>
 />
					 <label class="radio" for="discount-<? echo ( $$variable{'Pricelist'}->id(); ) ?>-<? echo ( $$variable{'Price'}->id(); ) ?>N">No</label>
				</td>
			</tr>
			<? endwhile ( $$variable{'Price'} = shift @{$$variable{'Prices'}}; ) ?>
<? endif ( @{$$variable{'PRICES_'.$$variable{'listid'}.'-'.$$variable{'equipment_index'}}} ) ?>
		<? endwhile ( @$variable{'equipment_index','equipment'} = splice @{$$variable{'Equipment'.$$variable{'listid'}}},0,2; ) ?>
			<tr>
				<td class="Add"><input type="checkbox" name="chk-<? echo ( $$variable{'Pricelist'}->id(); ) ?>-New" /></td>
				<td class="Range"> 
					<input type="text" name="min-<? echo ( $$variable{'Pricelist'}->id(); ) ?>-New" />
					<input type="text" name="max-<? echo ( $$variable{'Pricelist'}->id(); ) ?>-New" />
				</td>
				<td class="Units"> 
					<input type="text" name="units-<? echo ( $$variable{'Pricelist'}->id(); ) ?>-New" />
				</td>
				<td class="Cost"> 
					<input type="text" name="cost-<? echo ( $$variable{'Pricelist'}->id(); ) ?>-New" onkeyup="calc_from_cost(this);" />
				</td>
				<td class="Markup"> 
					<input type="text" name="markup-<? echo ( $$variable{'Pricelist'}->id(); ) ?>-New" size="6"  onkeyup="calc_from_markup(this);" />
				</td>
				<td class="Price"> 
					<input type="text" name="price-<? echo ( $$variable{'Pricelist'}->id(); ) ?>-New" size="9"  onkeyup="calc_from_price(this);" />
				</td>
				<td class="Discount"> 
					<input type="radio" id="discount-<? echo ( $$variable{'Pricelist'}->id(); ) ?>-NewY" name="rdbDiscount-<? echo ( $$variable{'Pricelist'}->id(); ) ?>-New" value='Y' checked="checked"  />
					<label class="radio" for="discount-<? echo ( $$variable{'Pricelist'}->id(); ) ?>-NewY">Yes</label>
					<input type="radio" id="discount-<? echo ( $$variable{'Pricelist'}->id(); ) ?>-NewN" name="rdbDiscount-<? echo ( $$variable{'Pricelist'}->id(); ) ?>-New" value='N'  />
					<label class="radio" for="discount-<? echo ( $$variable{'Pricelist'}->id(); ) ?>-NewN">No</label>
				</td>
			</tr>
			</table>
		</div><!--Equipment-->
	</fieldset>
	<? endwhile ( $$variable{'Pricelist'} = shift @{$$variable{'Pricelists'}} ) ?>
	<input type="hidden" name="btnFunction"/>
	<input type="hidden" name="product_id" value="<? echo ( $$variable{'Product'}->id() ) ?>" />
</form>
<p class="buttons"><? echo ( join('',
		ssi::writeButton( $log, $dbh, 'SavePrices','save.gif',"document.PricesForm.btnFunction.value='Save';LoadContent('Prices','/administrator/products/_prices.html',Serialize(document.forms['PricesForm']) );",'','Save'),
		ssi::writeButton( $log, $dbh, 'ResetPrices','reset.gif','PricesForm.reset();','','Reset'),
		); ) ?>
</p>
