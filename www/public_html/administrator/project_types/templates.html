<script type="text/javascript">
	function copy_template(id) {

new Ajax.Updater( 'T'+id, '_template_line.html', {
                parameters: {
                    template_id:    id,
                    action:         'C'
                },
                insertion: 'after',
                } );
}
function delete_template(id) {
new Ajax.Updater( 'T'+id, '_template_line.html', {
                parameters: {
                    template_id:    id,
                    action:         'X'
                }
                } );
}
</script>
