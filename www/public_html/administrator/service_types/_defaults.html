<table class="List">
	<tr> 
		<th align="left">Field Name</th>
		<th align="left">Field Value</th>
	</tr>
	<? eval ( 
		@{$$variable{'Defaults'}} = sql::execute( undef, undef, q{SELECT strFieldName, strDefaultValue FROM tbl_Service_Defaults WHERE lngServiceTypeIndex=? ORDER BY strFieldName, strFieldName}, $$variable{'ServiceType'}->id() ? $$variable{'ServiceType'}->id() : undef);
	 ) ?>

	<? while ( @{$$variable{'Defaults'}} ) ?>
		<? eval ( @$variable{'name','value'} = splice @{$$variable{'Defaults'}},0,2; ) ?>
		<? eval ( $$variable{'index'} = @{$$variable{'Defaults'}}; ) ?>
		<tr<?rowclass?>> 
			<td><input type="text" name="txtName-<?index?>" value="<?name?>" /></td>
			<td><input type="text" name="txtValue-<?index?>" value="<?value?>" /></td>
		</tr>
		<? eval ( $$variable{'rowclass'} = $$variable{'rowclass'} ? '' : ' class="colRow"'; ) ?>
	<? endwhile ( @{$$variable{'Defaults'}} ) ?>
	<tr class="totals"> 
		<td colspan="2">Add New</td>
	</tr>
	<tr> 
		<td><input type="text" name="txtName-New" /></td>
		<td><input type="text" name="txtValue-New" /></td>
	</tr>
</table>
