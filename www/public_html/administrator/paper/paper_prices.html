<script type="text/javascript" src="/administrator/production/pricing.js"></script>
<script type="text/javascript" >
	function addPrice( list_index ) {
		jsrsExecute( '/jsrs.htm', cbFillPrices, 'openprint::administrator_paper::jsrs_add_price', new Array( <?paper_id?>, list_index ) );
	}
	function delPrice( id ) {
		jsrsExecute( '/jsrs.htm', cbFillPrices, 'openprint::administrator_paper::jsrs_del_price', new Array( <?paper_id?>, id ) );
	}

	function savePrices( form ) {
		jsrsExecute( '/jsrs.htm', cbFillPrices, 'openprint::administrator_paper::jsrs_save_prices', Serialize( form ) ); 
	
	}
	function cbFillPrices( results ) {
		// results should be html to dump into the prices div
		var div = $('Prices');
		div.innerHTML = results;
	}
</script>

	<fieldset><legend>Pricing</legend>
	<div id="Prices"><!--#include virtual="_prices.html"--></div>
	<div class="row">
		<span style="float: right;">
			<form name="paper_prices">
			<? echo ( ssi::writeButton( $log, $dbh, 'SavePrices', 'savePrices.gif', 'savePrices(document.Prices);', '', 'Save All Prices' ); ) ?>
			<? echo ( ssi::writeButton( $log, $dbh, 'AddNewPrice', 'addPrice.gif', "addPrice(get_ddm_value(document.paper_prices.Pricelist) );", '', 'Add Price to:' ); ) ?>
			<select name="Pricelist" size="1">
				<option value="">select pricelist</option>
				<? echo (
						my @pricelists = openprint::Pricelist::find('order'=>'lower(name)');
						if ( @pricelists == 1 ) {
							return ssi::make_drop_down( [ map { $_->id(), $_->name() } @pricelists ], $pricelists[0]->id() );
						} else {
							return ssi::make_drop_down( [ map { $_->id(), $_->name() } @pricelists ] );
						} # end if
					) ?>
			</select>
			<input type="hidden" name="paper_id" value="<? echo ( $$variable{'Paper'}->id(); ) ?>" />
			</form>
		</span>
	</div>
	</fieldset>
