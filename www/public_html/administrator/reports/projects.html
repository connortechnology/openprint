<br/>
<form name="f1" method="post" action="projects.html">
	<fieldset class="filters"><legend>Report Criteria</legend>
		<p>
			<label>Project ID:</label>
			<input type="text" size="10" name="ProjectIndex" />
			<? echo ( ssi::writeButton( $log, $dbh, 'Go1','go.gif',"f1.action='../project/view.html';f1.submit();", '', 'Go' ); ) ?>	
		</p>
		<p>
			<label>Company:</label>
			<input type="text" onKeyUp="filterDDM(this, f1.ddmCustomers);" size="4" />
			<select name="ddmCustomers" onchange="if(this.options[this.selectedIndex].value != '') f1.submit();" >
				<option value=""> Select a Customer</option>
				<? echo ( ssi::make_drop_down( [ map { $_->id(), $_->name() } openprint::Company::find('order'=>'lower(strname)')], $openprint::param{'ddmCustomers'} ); ) ?>
			</select>
		</p>
		<p>
			<label>Estimator:</label>
			<select  name="ddmEstimator" size="1"> 
				<option value="">All Estimators</option>
				<? echo ( ssi::make_drop_down( [ map { $_->id(), $_->name() } openprint::User::find('type'=>['E','A'], 'web_active'=>'Y', 'order'=>'lower(strfirstname),lower(strlastname)','web_active'=>1) ], $$variable{'ddmEstimator'} ); ) ?>
			</select>
		</p>
		<p> 
			<label>Status:</label>
			<select name="ddmStatus" size="1">
				<option value="">All</option>
				<?ddmStatus?>
			</select>
		</p>
		<p> 
			<label>Sales Reps:</label>
			<select name="ddmEmployees" size="1">
				<option value="">All Employees</option>
				<? echo ( ssi::make_drop_down( [ map { $_->id(), $_->name() } openprint::User::find('type'=>['E','A'], 'web_active'=>'Y', 'order'=>'lower(strfirstname),lower(strlastname)','web_active'=>1) ], $$variable{'ddmEmployees'} ); ) ?>
			</select>
		</p>
		<p> 
			<label>Created Date:</label>
			<select name="ddmStartMonth"><?startmonths?></select>
			<select name="ddmStartDay"><?startdays?></select>
			<select name="ddmStartYear"><?startyears?></select> to
			<select name="ddmEndMonth"><?endmonths?></select>
			<select name="ddmEndDay"><?enddays?></select>
			<select name="ddmEndYear"><?endyears?></select>
		</p>
		<p class="buttons">
			<? echo ( join('',
				ssi::writeButton( $log, $dbh, 'ShowResults', 'showResults.gif', "f1.btnFunction.value='Show Results';f1.submit();", '', 'Show Results' ),
				ssi::writeButton( $log, $dbh, 'DownloadCSV', 'downloadCSVFormat.gif', "f1.action='reports_orders.html?Download';f1.btnFunction.value='Download in CSV format';f1.submit();", '', 'Download in CSV Format' ),
				ssi::writeButton( $log, $dbh, 'Reset', 'reset.gif', "f1.reset();", '', 'Reset' ),
); ) ?>
		</p>
	</fieldset>
	<? if ( @{$$variable{'DATA'}} ) ?>
	<table class="List">
		<tr> 
			<th align="left" width="75">Project #</th>
			<th align="left">Company</th>
			<th align="left">Reference</th>
			<th align="center" width="75">Created</th>
			<th align="right" width="100">Status</th>
		</tr>
		<? while ( @$variable{'cust_index','cust_name','proj_index','proj_ref','date','status'} = splice @{$$variable{'DATA'}},0,6; ) ?>
		<tr<?rowclass?>> 
			<td><a href="../project/view.html?ProjectIndex=<?proj_index?>">&nbsp;<?proj_index?></a></td>
			<td><a href="../project/view.html?ProjectIndex=<?proj_index?>">&nbsp;<?cust_name?></a></td>
			<td><a href="../project/view.html?ProjectIndex=<?proj_index?>">&nbsp;<?proj_ref?></a></td>
			<td align="center">&nbsp;<?date?></td>
			<td align="right">&nbsp;<?status?></td>
		</tr>
		<? eval ( $$variable{'rowclass'} = $$variable{'rowclass'} ? '' : ' class="colRow"' ) ?>
		<? endwhile ( @$variable{'cust_index','cust_name','proj_index','proj_ref','date','status'} = splice @{$$variable{'DATA'}},0,6; ) ?>
	</table>
	<? else ( @{$$variable{'DATA'}} ) ?>
	There were no results matching your criteria.<br>
	<? endif ( @{$$variable{'DATA'}} ) ?>
	<input type="hidden" name="btnFunction"/>
</form>
