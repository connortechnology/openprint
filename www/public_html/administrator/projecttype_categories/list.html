<div class="error"><?error?></div>
<table class="List">
	<tr>
		<th align="left">Name</th>
		<th align="left">Description</th>
		<th align="left" width="100"># of Project Types</th>
	</tr>

<? eval (
	@{$$variable{'Categories'}} = openprint::ProjectTypeCategory::find( 'order' => 'sort,lower(name)' );
) ?>
<? while ( $$variable{'Category'} = shift @{$$variable{'Categories'}} ) ?>
<tr<?rowclass?>>
	<td><a href="edit.html?category_id=<? echo ( $$variable{'Category'}->id(); ) ?>"><? echo ( $$variable{'Category'}->name(); ) ?></a></td>
	<td><? echo ( $$variable{'Category'}->description(); ) ?></td>
	<td><? echo ( $$variable{'Category'}->project_types(); ) ?></td>
</tr>
<? endwhile ( $$variable{'Category'} = shift @{$$variable{'Categories'}} ) ?>
</table>
<? eval ( delete $openprint::param{'category_id'}; ) ?>
