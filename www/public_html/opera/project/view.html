<!--#include virtual="/includes/project_header.html" -->
<br/>
<form name="f1" method="post" action="project_view.html">
	<table class="List">
		<tr> 
			<th align="left">Service</th>
			<th width="100" align="right">Status</th>
		</tr>
		<? while ( @$variable{'index','name','url','price1','price2','price3','status'} = splice @{$$variable{'SERVICES'}},0,7; ) ?>
		<tr<?rowclass?>> 
			<td>
<? if ( $$variable{'url'} ne '' ) ?>
<a href="/employee/proj/<?url?>?OrderID=<?OrderID?>&ProjectIndex=<?ProjectIndex?>&ServiceIndex=<?index?>"><?name?></a>
<? else ( $$variable{'url'} ne '' ) ?>
<?name?>
<? endif ( $$variable{'url'} ne '' ) ?>
&nbsp;</td>
			<td align="right">&nbsp;<?status?></td>
		</tr>
		<? eval ( $$variable{'rowclass'} = $$variable{'rowclass'} eq ' class="colRow"' ? '' : ' class="colRow"'; ) ?>
		<? endwhile ( @$variable{'index','name','url','price1','price2','price3','status'} = splice @{$$variable{'SERVICES'}},0,7; ) ?>
		<? if ( sets::isin( $$variable{'email'}, 'iconnor@point-one.com', 'rick@point-one.com') ) ?>
		<tr>
			<td colspan="2"><hr/></td>
		</tr>
		<tr>
			<td>Add Service:<select name="NewServiceType"><option value=""> select </option><? echo ( ssi::fill_drop_down( $log, $dbh, q{SELECT lngIndex, strName FROM tbl_Service_Types ORDER BY lower(strName)} ); ) ?>
			</td>
			<td><span style="float:right;"><? echo ( ssi::writeButton( $log, $dbh, 'AddServiceType', 'add.gif', "f1.btnFunction.value='Add Service';f1.submit();", '', 'Add Service' ); ) ?></span></td>
		</tr>
		<? endif ( sets::isin( $$variable{'email'}, 'iconnor@point-one.com', 'rick@point-one.com') ) ?>
	</table>
	<br/>
	<span style="float: left;">
		<script type="text/JavaScript">
		writeButton( 'Docket', 'Docket.gif', "open_window('/employee/production/docket_sheet.html?ProjectIndex=<?ProjectIndex?>');", '', 'Docket' );
		writeButton( 'DocketLabel', 'label.gif', "open_window('/employee/production/label.html?ProjectIndex=<?ProjectIndex?>');", '', 'Docket Label' );
		writeButton( 'SkidLabel', 'label.gif', "open_window('/employee/production/skid_label.html?ProjectIndex=<?ProjectIndex?>');", '', 'Skid Label' );
		</script>
	</span>
	<span style="float: right;">
		<script type="text/javascript">
		writeButton( 'Complete', 'complete.gif', "f1.btnFunction.value='Complete';f1.submit();", '', 'Complete' );
		writeButton( 'CompleteBindery', 'completeBindery.gif', "f1.btnFunction.value='BinderyComplete';f1.submit();", '', 'Complete Bindery' );
		<? if ( $$variable{'ShippingType'} eq 'Delivery' and $$variable{'ProjectStatus'} ne 'Shipped' ) ?>

		writeButton( 'Shipped', 'shipped.gif', "f1.btnFunction.value='Shipped';f1.submit();", '', 'Shipped' );
		<? else ( $$variable{'ShippingType'} eq 'Delivery' and $$variable{'ProjectStatus'} ne 'Shipped' ) ?>
			<? if ( $$variable{'ProjectStatus'} eq 'Complete' ) ?>
		writeButton( 'Shipped', 'shipped.gif', "f1.btnFunction.value='Shipped';f1.submit();", '', 'Shipped' );
		writeButton( 'Picked Up', 'pickedUp.gif', "f1.btnFunction.value='Picked Up';f1.submit();", '', 'Picked Up' );
			<? endif ( $$variable{'ProjectStatus'} eq 'Complete' ) ?>
		<? endif ( $$variable{'ShippingType'} eq 'Delivery' and $$variable{'ProjectStatus'} ne 'Shipped' ) ?>
		<? if ( $$variable{'ShippingType'} eq 'Customer Pickup' and $$variable{'ProjectStatus'} ne 'Picked Up' ) ?>
		writeButton( 'Picked Up', 'pickedUp.gif', "f1.btnFunction.value='Picked Up';f1.submit();", '', 'Picked Up' );
		<? endif ( $$variable{'ShippingType'} eq 'Customer Pickup' and $$variable{'ProjectStatus'} ne 'Picked Up' ) ?>
		</script>
	</span>
	<br/>
	<br/>
	<a href="/employee/production/projects.html">Back to Projects</a><br>
	<input type="hidden" name="btnFunction"/>
	<input type="hidden" name="ProjectIndex" value="<?ProjectIndex?>"/>
	<input type="hidden" name="OrderID" value="<?OrderID?>"/>
</form>
<br/>
<fieldset><legend>Modification History</legend>
	<table class="List">
	<tr>
	<th align="left">Customer</th>
	<th align="left">User</th>
	<th align="left" width="150">When</th>
	<th align="left">Description</th>
	</tr>
	<? eval ( @{$$variable{'ProjectLog'}} = eprint::project::get_log( $log, $dbh, $$variable{'ProjectIndex'}); ) ?>
	<? while ( @$variable{'CustomerIndex','CustomerName','UserIndex','UserName','When','Description'} = splice @{$$variable{'ProjectLog'}},0,6; ) ?>
	<tr<?rowclass?>>
	<td><?CustomerName?></td>
	<td><?UserName?></td>
	<td width="150"><?When?></td>
	<td><?Description?></td>
	</tr>
	<? eval ( $$variable{'rowclass'} = $$variable{'rowclass'} eq ' class="colRow"' ? '' : ' class="colRow"'; ) ?>
	<? endwhile ( @$variable{'CustomerIndex','CustomerName','UserIndex','UserName','When','Description'} = splice @{$$variable{'ProjectLog'}},0,6; ) ?>
	</table>
</fieldset>
