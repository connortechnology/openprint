<script type="text/javascript">
function click_order( form ) {
	if ( ! form.txtPrice1.value ) {
		alert( "The project is not complete, and so cannot be ordered yet." );
		return;
	} // end if
	form.action='/main/order/information.html';
	form.btnFunction.value='Process Order';
	form.submit();
}
function click_quote( form ) {
	if ( ! form.txtPrice1.value ) {
		alert( "The project is not complete, and so cannot be quoted yet." );
		return;
	} // end if 
	form.action='/main/quote/information.html';
	form.btnFunction.value='Process Quote';
	form.submit();
}
function click_upload( form ) {
	window.location = '/upload/upload_center.html?ProjectIndex=' + form.ProjectIndex.value;
}
</script>
<div id="Help"></div>
<div id="AlertDiv" class="row" style="display:none;">
</div>

   <div id="CalculateBtn"><? echo ( ssi::writeButton( $log, $dbh, 'Calculate', '', "gettingNewPrice=false;calc('f1');", '', 'Calculate'); ) ?></div>
	<br class="spacer"/>
   </div>
   
<? echo ( ssi::writeButton( $log, $dbh, 'Breakdown', 'price_breakdown.gif', "breakdown_window(document.f1.ProjectIndex.value);", '', 'Detailed Pricing' ); ) ?>
	<div id="OrderButton" <? echo ( 'style="display:none;"' if $$variable{'Status'} ne 'Unordered' ) ?> >
	<? echo ( ssi::writeButton( $log, $dbh, 'UPS', '', "open_window('/main/project/shipping/UPS.html','popup','resizeable,width=800,menubar');", '', 'Get UPS Shipping Estimate'); ) ?><br class="spacer" />
	<? echo ( ssi::writeButton( $log, $dbh, 'Upload', '', "click_upload( document.f1 );", '', 'Upload Files'); ) ?>
	<? echo ( ssi::writeButton( $log, $dbh, 'Quote', '', "click_quote( document.f1 );", '', 'Email Quote'); ) ?>
	<? echo ( ssi::writeButton( $log, $dbh, 'Order', '', "click_order( document.f1 );", '', 'Place Order') if $openprint::config{AllowOrdering} ne 'false'; ) ?>
