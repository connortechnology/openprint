<? eval (
	if ( !$$variable{'ProjectTypeID'} ) {
		$$variable{'ProjectTypeID'} = $$variable{'ProjectTypeName'};
	} # end if
) ?>
<p>
	<label>Type:</label>
		<select name="ddmStockBrand<?Signature?>" size="1" onchange="ddmStockBrand_onchange( this, '<?Signature?>' );">
			<option value=""> Please select one </option>
				<? echo ( 
					ssi::make_drop_down( [ openprint::paper::get_names( @$variable{'ProjectTypeID',
							'ddmStockBrand'.$$variable{'Signature'},
							'ddmStockFinish'.$$variable{'Signature'},
							'ddmStockColour'.$$variable{'Signature'},
							'ddmStockWeight'.$$variable{'Signature'},
} ) ], $$variable{'ddmStockBrand'} );
					) ?>
		</select>
</p>
<p><label>Finish:</label>
		<select name="ddmStockFinish<?Signature?>" size="1" onchange="ddmStockFinish_onchange( this, '<?Signature?>' );">
			<option value=""> Please select one </option>
				<? echo ( 
					ssi::make_drop_down( [ openprint::paper::get_finishes( @$variable{'ProjectTypeID',
							'ddmStockBrand'.$$variable{'Signature'},
							'ddmStockFinish'.$$variable{'Signature'},
							'ddmStockColour'.$$variable{'Signature'},
							'ddmStockWeight'.$$variable{'Signature'},
} ) ], $$variable{'ddmStockFinish'} );
					) ?>
		</select>
</p>
<p><label>Colour:</label>
		<select name="ddmStockColour<?Signature?>" size="1" onchange="ddmStockColour_onchange( this, '<?Signature?>' );">
			<option value=""> Please select one </option>
				<? echo ( 
					ssi::make_drop_down( [ openprint::paper::get_colours( @$variable{'ProjectTypeID',
							'ddmStockBrand'.$$variable{'Signature'},
							'ddmStockFinish'.$$variable{'Signature'},
							'ddmStockColour'.$$variable{'Signature'},
							'ddmStockWeight'.$$variable{'Signature'},
} ) ], $$variable{'ddmStockColour'} );
					) ?>
		</select>
</p>
<p id="StockWeightSelect<?Signature?>">
<? if ( $$variable{'ProjectTypeID'} ne 'Envelopes' ) ?>
	<label>Weight:</label>
	<select name="ddmStockWeight<?Signature?>" size="1" onchange="ddmStockWeight_onchange( this, '<?Signature?>' );">
		<option value=""> Please select one </option>
		<? echo (
			ssi::make_drop_down( [ openprint::paper::get_weights( @$variable{'ProjectTypeID',
					'ddmStockBrand'.$$variable{'Signature'},
					'ddmStockFinish'.$$variable{'Signature'},
					'ddmStockColour'.$$variable{'Signature'},
					'ddmStockWeight'.$$variable{'Signature'},
					} ) ], $$variable{'ddmStockWeight'} );
			) ?>
	</select>
<? else ( $$variable{'ProjectTypeID'} ne 'Envelopes' ) ?>
	<input type="hidden" name="ddmStockWeight<?Signature?>" id="ddmStockWeight<?Signature?>" value="<? echo ( $$variable{'ddmStockWeight'.$$variable{'Signature'}} ) ?>" />
<? endif ( $$variable{'ProjectTypeID'} ne 'Envelopes' ) ?>
</p>
