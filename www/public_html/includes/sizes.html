<div class="row">
	<span class="label">Size:</span>
	<span class="input">
		<select id="Dimensions" name="Dimensions" onchange="Dimensions_onchange( this );">
			<option value=""> select </option>
			<? echo ( 
				$$variable{'FoldType'} = 'NoFold' if ( ! $$variable{'FoldType'} ) and ! sets::isin( $$variable{'ProjectTypeName'}, ['BusinessCards', 'Door Hangers', 'ScratchPads', 'Covers','Postcards','Posters','Rack Cards','Magazines','Inserts','Labels','Letterhead','Manuals','Custom','Newsletters','Reports','PresentationFolders','Calendars'] );

				if ( $$variable{'DimensionsDisplay'} eq 'Finished' ) {
					$_ = q{SELECT DISTINCT dblFinishedWidth::float || 'x' || dblFinishedHeight::float || 'Finished' AS size, dblFinishedWidth::float || '" x ' || dblFinishedHeight::float || '" Finished' FROM projecttemplate WHERE projecttype_id = (SELECT id FROM project_types where name=?)};
				} else {
					$_ = q{SELECT DISTINCT dblFlatWidth::float || 'x' || dblFlatHeight::float || 'Flat' AS size, dblFlatWidth::float || '" x ' || dblFlatHeight::float || '" Flat' FROM projecttemplate WHERE projecttype_id = (SELECT id FROM project_types where name=?)};
				} # end if
				

				my $html = $$variable{'FoldType'} ? 
ssi::make_drop_down( [ sql::execute( undef, undef, $_ . ' AND type=? ORDER BY SIZE', @$variable{'ProjectTypeName','FoldType'} ) ] ) :
ssi::make_drop_down( [ sql::execute( undef, undef, $_, $$variable{'ProjectTypeName'} ) ] );
				if ( ! $html ) {
					$$variable{'Dimensions'} = 'Custom';
				} # end if
				return $html;
			) ?>
			<option value="Custom">Custom</option>
		</select>
	</span>
</div>
