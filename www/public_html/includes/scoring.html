<div class="row">
	<span class="label">Scoring:</span>
	<span class="input">
		<input type="radio" id="ScoringY" name="Scoring" value="Y" onclick="add_div('ScoringDiv');remove_div('OrderButton');" <? echo ( 'checked="checked"' if $$variable{'Scoring'} eq 'Y' ) ?> />
		<label class="radio" for="ScoringY">Yes</label>
		<input type="radio" id="ScoringN" name="Scoring" value="N" onclick="remove_div('ScoringDiv');remove_div('OrderButton');" <? echo ( 'checked="checked"' if $$variable{'Scoring'} ne 'Y' ) ?> />
		<label class="radio" for="ScoringN">No</label>
	</span>
</div>
<div class="row" id="ScoringDiv" <? echo ( 'style="display:none;"' if $$variable{'Scoring'} ne 'Y' ) ?> >
	<span class="label">
		<label for="txtScoreQty"># of Scores:</label>
	</span>
	<span class="input">
		<input type="text" id="txtScoreQty" name="txtScoreQty" value="<?txtScoreQty?>" size="2" onkeyup="this.value=this.value.replace(/\D/g,'');remove_div('OrderButton');"/>
		<input type="checkbox" id="chkOverrideScoreQty" name="chkOverrideScoreQty" value="Y" <? echo ( 'checked="checked"' if $$variable{'chkOverrideScoreQty'} eq 'Y' ) ?> onclick="remove_div('OrderButton');" />
		<label class="radio" for="chkOverrideScoreQty">Override</label>
	</span>
</div>
