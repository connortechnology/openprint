<div class="row"> 
    <span class="label">Number of holes per item:</span>
	<? eval ( $$variable{'QTYIndex'} = 1 ) ?>
	<? while ( $$variable{'QTYIndex'} <= 3 ) ?>
	<? if ( $$variable{'txtQuantity'.$$variable{'QTYIndex'}} ) ?>
    <span class="value"><?txtHoleQty?></span>
	<? endif ( $$variable{'txtQuantity'.$$variable{'QTYIndex'}} ) ?>
	<? eval ( $$variable{'QTYIndex'} += 1 ) ?>
	<? endwhile ( $$variable{'QTYIndex'} <= 3 ) ?>
</div>
<div class="row"> 
    <span class="label">Size of the hole(s):</span>
	<? eval ( $$variable{'QTYIndex'} = 1 ) ?>
	<? while ( $$variable{'QTYIndex'} <= 3 ) ?>
	<? if ( $$variable{'txtQuantity'.$$variable{'QTYIndex'}} ) ?>
    <span class="value"><?txtHoleSize?></span>
	<? endif ( $$variable{'txtQuantity'.$$variable{'QTYIndex'}} ) ?>
	<? eval ( $$variable{'QTYIndex'} += 1 ) ?>
	<? endwhile ( $$variable{'QTYIndex'} <= 3 ) ?>
</div>
