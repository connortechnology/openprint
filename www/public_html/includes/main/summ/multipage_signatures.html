<div class="row">
	<span class="label">Pages on signature:</span>
<? eval ( $$variable{'QTYIndex'} = 1 ) ?>
<? while ( $$variable{'QTYIndex'} <= 3 ) ?>
<? if ( $$variable{'txtQuantity'.$$variable{'QTYIndex'}} ) ?>
	<span class="value">
<? echo ( 
	if ( $$variable{'PageQuantity'.$$variable{'QTYIndex'}} ) {
		return $$variable{'PageQuantity'.$$variable{'QTYIndex'}} . ' pages';
	} else {
		return 'unknown';
	} 
) ?>
	</span>
<? endif ( $$variable{'txtQuantity'.$$variable{'QTYIndex'}} ) ?>
    <? eval ( $$variable{'QTYIndex'} += 1 ) ?>
<? endwhile ( $$variable{'QTYIndex'} <= 3 ) ?>
	<br class="spacer"/>
</div>
