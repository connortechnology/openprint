<div class="row">
	<span class="label">Quantity of spreads on signature:</span>
<? eval ( $$variable{'QTYIndex'} = 1 ) ?>
<? while ( $$variable{'QTYIndex'} <= 3 ) ?>
<? if ( $$variable{'txtQuantity'.$$variable{'QTYIndex'}} ) ?>
	<span class="value"><? echo ( sprintf('%d spread%s => %d pages', $$variable{"txtSignatureSpreadQuantity$$variable{'QTYIndex'}"},
($$variable{"txtSignatureSpreadQuantity$$variable{'QTYIndex'}"} > 1 ? 's' : '' ), $$variable{"PageQuantity$$variable{'QTYIndex'}"} ); ) ?></span>
<? endif ( $$variable{'txtQuantity'.$$variable{'QTYIndex'}} ) ?>
    <? eval ( $$variable{'QTYIndex'} += 1 ) ?>
<? endwhile ( $$variable{'QTYIndex'} <= 3 ) ?>
	<br class="spacer"/>
</div>
