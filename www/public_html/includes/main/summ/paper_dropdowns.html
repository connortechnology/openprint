<div class="row">
	<span class="label">Is stock supplied?</span>
<? eval ( $$variable{'QTYIndex'} = 1 ) ?>
<? while ( $$variable{'QTYIndex'} <= 3 ) ?>
<? if ( $$variable{'txtQuantity'.$$variable{'QTYIndex'}} ) ?>
	<span class="value"><? echo ( $$variable{'rdbSuppliedStock'} eq 'Y' ? 'Yes' : 'No' ) ?></span>
<? endif ( $$variable{'txtQuantity'.$$variable{'QTYIndex'}} ) ?>
    <? eval ( $$variable{'QTYIndex'} += 1 ) ?>
<? endwhile ( $$variable{'QTYIndex'} <= 3 ) ?>
</div>
