<div class="row"> 
	<span class="label">Bleeds:</span>
<? if ( $$variable{'ServiceSpecifications'}{'chkBleedLeft'} or $$variable{'ServiceSpecifications'}{'chkBleedRight'} or $$variable{'ServiceSpecifications'}{'chkBleedTop'} or $$variable{'ServiceSpecifications'}{'chkBleedBottom'} ) ?> 
<? echo (
	my $html = '';
	my $sig_specs = $$variable{'ServiceSpecifications'};
	foreach my $qty_index ( 1 .. 3 ) {
		next if ! $$variable{'Project'}->quantity( $qty_index );

		$html .= '<span class="value">'.$$variable{'ddmBleedSize'.$qty_index}.'&quot; ';
		$html .= join(' ', @$sig_specs{'chkBleedLeft','chkBleedRight','chkBleedTop','chkBleedBottom'} ) .'</span>';
	} # end foreach
	return $html;
) ?>
<? else ( $$variable{'ServiceSpecifications'}{'chkBleedLeft'} or $$variable{'ServiceSpecifications'}{'chkBleedRight'} or $$variable{'ServiceSpecifications'}{'chkBleedTop'} or $$variable{'ServiceSpecifications'}{'chkBleedBottom'} ) ?>

<? endif ( $$variable{'ServiceSpecifications'}{'chkBleedLeft'} or $$variable{'ServiceSpecifications'}{'chkBleedRight'} or $$variable{'ServiceSpecifications'}{'chkBleedTop'} or $$variable{'ServiceSpecifications'}{'chkBleedBottom'} ) ?>
