<p> 
	<label>Bleeds:</label>
<? if ( $$variable{'ServiceSpecifications'}{'BleedLeft'} or $$variable{'ServiceSpecifications'}{'BleedRight'} or $$variable{'ServiceSpecifications'}{'BleedTop'} or $$variable{'ServiceSpecifications'}{'BleedBottom'} ) ?> 
<? echo (
	my $html = '';
	my $sig_specs = $$variable{'ServiceSpecifications'};
	foreach my $qty_index ( $$variable{'Project'}->quantity_indexes() ) {
		$html .= '<span class="value">'.$$variable{'ddmBleedSize'.$qty_index}.'&quot; ';
		$html .= join(' ', @$sig_specs{'BleedLeft','BleedRight','BleedTop','BleedBottom'} ) .'</span>';
	} # end foreach
	return $html;
) ?>
<? else ( $$variable{'ServiceSpecifications'}{'BleedLeft'} or $$variable{'ServiceSpecifications'}{'BleedRight'} or $$variable{'ServiceSpecifications'}{'BleedTop'} or $$variable{'ServiceSpecifications'}{'BleedBottom'} ) ?> 
<? echo (
	my $html = '';
	foreach my $qty_index ( 1 .. 3 ) {
		next if ! $$variable{'Project'}->quantity( $qty_index );
		$html .= '<span class="value">No bleed</span>';
	} # end foreach
	return $html;
) ?>
<? endif ( $$variable{'ServiceSpecifications'}{'BleedLeft'} or $$variable{'ServiceSpecifications'}{'BleedRight'} or $$variable{'ServiceSpecifications'}{'BleedTop'} or $$variable{'ServiceSpecifications'}{'BleedBottom'} ) ?> 
</p>
