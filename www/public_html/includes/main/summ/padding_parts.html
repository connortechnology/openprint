<div class="row">
    <span class="label">Pages or form sets in each pad?</span>
   <? eval ( $$variable{'QTYIndex'} = 1 ) ?>
    <? while ( $$variable{'QTYIndex'} <= 3 ) ?>

    <span class="value"><?PageQuantity?> <?txtPartQty?></span>
    <? endif ( $$variable{'txtQuantity'.$$variable{'QTYIndex'}} ) ?>

</div>
