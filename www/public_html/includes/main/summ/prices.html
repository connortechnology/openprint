<div class="row">
	<span class="label">Price:</span>
<? echo (
	my $html;
	foreach my $qty_index ( 1 .. 3 ) {
		next if ! $$variable{"txtQuantity$qty_index"};
		if ( ( ! $$variable{'OrderedQuantityIndex'} ) or ( $$variable{'OrderedQuantityIndex'} == $qty_index ) ) {
			if ( $$variable{"txtPrice$qty_index"} and ( $$variable{"txtPrice$qty_index"} ne 'n/a' ) ) {
				$html .= '<span class="value"><b>$'.$$variable{"txtPrice$qty_index"} .'</b></span>';
			} # end if
		} # end if
	} # end foreach
	return $html;
) ?>
	<br class="spacer"/>
</div>
