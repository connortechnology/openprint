<div class="row">
    <span class="label">Total weight:</span>
   <? eval ( $$variable{'QTYIndex'} = 1 ) ?>
    <? while ( $$variable{'QTYIndex'} <= 3 ) ?>
    <? if ( $$variable{'txtQuantity'.$$variable{'QTYIndex'}} ) ?>
    <span class="value"><? echo ( 
my $g = Math::Units::convert( $$variable{'totalWeight'.$$variable{'QTYIndex'}}, 'lbs','g' );
if ( $g > 1000 ) {
return sprintf( '%.0flbs (%.0fkg)', $$variable{'totalWeight'.$$variable{'QTYIndex'}}, $g/1000 );
} # end nif
return sprintf( '%.0flbs (%.0fg)', $$variable{'totalWeight'.$$variable{'QTYIndex'}}, $g );
 ) ?>
</span>
    <? endif ( $$variable{'txtQuantity'.$$variable{'QTYIndex'}} ) ?>
    <? eval ( $$variable{'QTYIndex'} += 1 ) ?>
    <? endwhile ( $$variable{'QTYIndex'} <= 3 ) ?>
	<br class="spacer"/>
</div>
