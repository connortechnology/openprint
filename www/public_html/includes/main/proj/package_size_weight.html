<? eval (
	@{$$variable{'PackageTypes'}} = openprint::Material::find('category'=>$$variable{'ServiceTypeID'} );
) ?>
<? if ( @{$$variable{'PackageTypes'}} ) ?>
<p>
	<label><?ServiceTypeName?> dimensions:</label>
	<select name="ddmPackageType" size="1" onchange="calc(this.form.name);">
<? echo ( ssi::make_drop_down( [ map { $_->id(), $_->name() } @{$$variable{'PackageTypes'}} ], $$variable{'ddmPackageType'} ); ) ?>
	</select>
	<input type="checkbox" id="chkOverridePackageType" name="chkOverridePackageType" value="Y" onclick="if (!this.checked) calc(this.form.name);"
	<? echo ( $$variable{'chkOverridePackageType'} eq 'Y' ? 'checked="checked"' : '' ) ?>
	/> 
	<label class="radio" for="chkOverridePackageType">Override</label>
</p>
<? endif ( @{$$variable{'PackageTypes'}} ) ?>
<input type="hidden" name="txtPackageWidth" />
<input type="hidden" name="txtPackageHeight" />
<input type="hidden" name="txtPackageDepth" />
<p>
	<label>Weight of <?ServiceTypeName?>:</label>
	<input name="txtPackageWeight" value="<?txtPackageWeight?>" type="text" size="9" readonly="readonly" /> lbs
</p>
<p>
    <label>Maximum Quantity per <?ServiceTypeName?>:</label>
	<input name="txtItemsPerPackage" value="<?txtItemsPerPackage?>" type="text" size="9" onkeyup="calc(this.form.name);" />
	<input type="checkbox" id="chkOverrideItemsPerPackage" name="chkOverrideItemsPerPackage" value="Y" onclick="if (this.checked == false) calc(this.form.name);" 
	<? echo ( $$variable{'chkOverrideItemsPerPackage'} eq 'Y' ? 'checked="checked"' : '' ) ?>
	/>
	<label class="radio" for="chkOverrideItemsPerPackage">Override</label>
</p>
