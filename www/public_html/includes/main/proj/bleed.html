<? if ( $$variable{'Mode'} eq 'Easy' ) ?>
	<input type="hidden" name="chkBleedLeft<?Signature?>" value="<? echo ( $$variable{'chkBleedLeft'.$$variable{'Signature'}} ) ?>" />
	<input type="hidden" name="chkBleedRight<?Signature?>" value="<? echo ( $$variable{'chkBleedRight'.$$variable{'Signature'}} ) ?>" />
	<input type="hidden" name="chkBleedTop<?Signature?>" value="<? echo ( $$variable{'chkBleedTop'.$$variable{'Signature'}} ) ?>" />
	<input type="hidden" name="chkBleedBottom<?Signature?>" value="<? echo ( $$variable{'chkBleedBottom'.$$variable{'Signature'}} ) ?>" />
<? else ( $$variable{'Mode'} eq 'Easy' ) ?>
<p>
	<label>Bleed:</label>
	<span class="BleedOption">
		<input type="checkbox" id="BleedNone<?Signature?>" name="BleedNone<?Signature?>" value="None" onclick="if(this.checked){$('BleedLeft<?Signature?>').checked=false;$('BleedRight<?Signature?>').checked=false;$('BleedTop<?Signature?>').checked=false;$('BleedBottom<?Signature?>').checked=false;}else{$('BleedLeft<?Signature?>').checked=true;$('BleedRight<?Signature?>').checked=true;$('BleedTop<?Signature?>').checked=true;$('BleedBottom<?Signature?>').checked=true;};calc(this.form.name);" 
		<? echo ( ( $$variable{'chkBleedLeft'.$$variable{'Signature'}} eq 'Left' or $$variable{'chkBleedRight'.$$variable{'Signature'}} eq 'Right' or $$variable{'chkBleedTop'.$$variable{'Signature'}} eq 'Top' or $$variable{'chkBleedBottom'.$$variable{'Signature'}} eq 'Bottom' ) ? '' : 'checked="checked"' ) ?>
		/> <label class="radio" for="BleedNone<?Signature?>">None</label>
	</span>
	<span class="BleedOption">
		<input type="checkbox" id="BleedLeft<?Signature?>" name="chkBleedLeft<?Signature?>" value="Left" onclick="if(this.checked){$('BleedNone').checked=false;} else if ( ! ( $('BleedRight<?Signature?>').checked || $('BleedTop<?Signature?>').checked || $('BleedBottom<?Signature?>').checked) ) { $('BleedNone').checked=true;};calc(this.form.name);" 
		<? echo ( $$variable{'chkBleedLeft'.$$variable{'Signature'}} eq 'Left' ? 'checked="checked"' : '' ) ?>
		/> <label class="radio" for="BleedLeft<?Signature?>">Left</label>
	</span>
	<span class="BleedOption">
		<input type="checkbox" id="BleedRight<?Signature?>" name="chkBleedRight<?Signature?>" value="Right" onclick="if(this.checked){$('BleedNone').checked=false;} else if ( ! ( $('BleedLeft<?Signature?>').checked || $('BleedTop<?Signature?>').checked || $('BleedBottom<?Signature?>').checked) ) { $('BleedNone').checked=true;};calc(this.form.name);" 
		<? echo ( $$variable{'chkBleedRight'.$$variable{'Signature'}} eq 'Right' ? 'checked="checked"' : '' ) ?>
		/> <label class="radio" for="BleedRight<?Signature?>">Right</label>
	</span>
	<span class="BleedOption">
		<input type="checkbox" id="BleedTop<?Signature?>" name="chkBleedTop<?Signature?>" value="Top" onclick="if(this.checked){$('BleedNone').checked=false;} else if ( ! ( $('BleedRight<?Signature?>').checked || $('BleedLeft<?Signature?>').checked || $('BleedBottom<?Signature?>').checked) ) { $('BleedNone').checked=true;};calc(this.form.name);" 
		<? echo ( $$variable{'chkBleedTop'.$$variable{'Signature'}} eq 'Top' ? 'checked="checked"' : '' ) ?>
		/> <label class="radio" for="BleedTop<?Signature?>">Top</label>
	</span>
	<span class="BleedOption">
		<input type="checkbox" id="BleedBottom<?Signature?>" name="chkBleedBottom<?Signature?>" value="Bottom" onclick="if(this.checked){$('BleedNone').checked=false;} else if ( ! ( $('BleedRight<?Signature?>').checked || $('BleedTop<?Signature?>').checked || $('BleedLeft<?Signature?>').checked) ) { $('BleedNone').checked=true;};calc(this.form.name);" 
		<? echo ( $$variable{'chkBleedBottom'.$$variable{'Signature'}} eq 'Bottom' ? 'checked="checked"' : '' ) ?>
		/> <label class="radio" for="BleedBottom<?Signature?>">Bottom</label>
	</span>
</p>
<? endif ( $$variable{'Mode'} eq 'Easy' ) ?>
