<div id="GateFoldFit">
		Will your <? echo ( ssi::writeTip('Gate Folded'); ) ?>
		Page(s) require an exact fit? Choosing short will be more cost-effective, 
		however the <? echo ( ssi::writeTip('Gate Folded'); ) ?>
		page will be approximately 1/16&quot; short of the finished size.
	<p>
		<label>Gate Fold Fit:</label>
		<input type="radio" id="rdbGateFoldFitExact" name="rdbGateFoldFit" value="Exact" onclick="calc('f1')" <? echo ( 'checked="checked"' if $$variable{'rdbGateFoldFit'} eq 'Exact' ) ?> />
		<label class="radio" for="rdbGateFoldFitExact">Exact</label>
		<input type="radio" id="rdbGateFoldDitShort" name="rdbGateFoldFit" value="Short" onclick="calc('f1')" <? echo ( 'checked="checked"' if $$variable{'rdbGateFoldFit'} ne 'Exact' ) ?> />
		<label class="radio" for="rdbGateFoldFitShort">Short</label>
	</p>
</div>
<div id="Inserts">
	The # of inserts must be set on the book printing page.
	<p>
		<label># of inserts:</label>
		<?txtInsertQuantity?>
		<input name="txtInsertQuantity" value="<?txtInsertQuantity?>" type="hidden" size="9" onkeyup="calc(this.form.name);" />
	</p>
<? if ( $$variable{'txtInsertQuantity'} ) ?>
    <? eval ( $$variable{'InsertIndex'} = 1; ) ?>
    <? while ( $$variable{'InsertIndex'} <= $$variable{'txtInsertQuantity'} ) ?>
	<p>
		<label>Insert <?InsertIndex?> falls between:</label>
		Pages:
		<input name="txtInsertPage1-<?InsertIndex?>" size="9" value="<? hecho ( $$variable{'txtInsertPage1-'.$$variable{'InsertIndex'}} ) ?>" /> &amp;
		<input name="txtInsertPage2-<?InsertIndex?>" size="9" value="<? hecho ( $$variable{'txtInsertPage2-'.$$variable{'InsertIndex'}} ) ?>" />
	</p>
    <? eval ( $$variable{'InsertIndex'} += 1; ) ?>
    <? endwhile ( $$variable{'InsertIndex'} <= $$variable{'txtInsertQuantity'} ) ?>
<? endif ( $$variable{'txtInsertQuantity'} ) ?>
</div>
