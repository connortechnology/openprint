<div class="row"> 
	<span class="required">*</span>
	<span class="label">Will you be supplying a <? echo ( ssi::writeTip( 'custom die'); ) ?>?</span>
	<span class="input">
		<input type="radio" id="rdbSuppliedDieY" name="rdbSuppliedDie" value="Y" onclick="if ( this.checked ) { remove_div('CustomDie' ); } calc('f1');" <? echo ( 'checked' if $$variable{'rdbSuppliedDie'} eq 'Y' ) ?> />
		<label for="rdbSuppliedDieY">Yes</label>
		<input type="radio" id="rdbSuppliedDieN" name="rdbSuppliedDie" value="N" onclick="if ( this.checked ) { add_div('CustomDie' ); } calc('f1');" <? echo ( 'checked' if $$variable{'rdbSuppliedDie'} ne 'Y' ) ?> />
		<label for="rdbSuppliedDieN">No</label>
	</span>
</div>
<div id="CustomDie" style="<? echo ( 'display: none;' if $$variable{'rdbSuppliedDie'} eq 'Y' ) ?>" >
	<div class="row"> 
		<span class="required">*</span>
		<span class="label">What are the dimensions of the die cut image? (WxH In Inches)</span>
		<span class="input">
			<input name="txtDieWidth" size="9" value="<?txtDieWidth?>" onkeyup="calc('f1');" /> x <input name="txtDieHeight" size="9" value="<?txtDieHeight?>" onkeyup="calc('f1');" />
			<input type="checkbox" id="chkOverrideDimensions" name="chkOverrideDimensions" value="Y" <? echo ( 'checked="checked"' if $$variable{"chkOverrideDimensions"} eq 'Y' ) ?> />
			<label for="chkOverrideDimensions">Override</label>
		</span>
	</div>
	<div class="row"> 
		<span class="required">*</span>
		<span class="label">What type of die is required for the project? If known, please 
			input the amount of steel rule that will be required to create the die.</span>
		<span class="input">
				<input type="radio" id="rdbDieCuttingSimple" name="rdbDieCutting" value="Simple" onclick="calc('f1');" <? echo ( 'checked' if $$variable{'rdbDieCutting'} eq 'Simple' ) ?> />
				<label for="rdbDieCuttingSimple">Simple</label>
				<input type="radio" id="rdbDieCuttingAverage" name="rdbDieCutting" value="Average" onclick="calc('f1');" <? echo ( 'checked' if $$variable{'rdbDieCutting'} eq 'Average' ) ?> />
				<label for="rdbDieCuttingAverage">Average</label>
				<input type="radio" id="rdbDieCuttingComplex" name="rdbDieCutting" value="Complex" onclick="calc('f1');" <? echo ( 'checked' if $$variable{'rdbDieCutting'} eq 'Complex' ) ?> />
				<label for="rdbDieCuttingComplex">Complex</label>
			<br/>
				<input name="txtSteelRuleLength" size="9" value="<?txtSteelRuleLength?>"  onkeyup="calc('f1');" /> 
				Linear Inches
		</span>
	</div>
