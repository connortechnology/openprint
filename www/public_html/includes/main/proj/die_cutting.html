<p> 
	<label>Will you be supplying the die:</label>
	<input type="radio" id="rdbSuppliedDieY" name="rdbSuppliedDie" value="Y" onclick="if ( this.checked ) { $('CustomDie' ).hide(); } calc(this.form.name);" <? echo ( 'checked' if $$variable{'rdbSuppliedDie'} eq 'Y' ) ?> />
	<label class="radio" for="rdbSuppliedDieY">Yes</label>
	<input type="radio" id="rdbSuppliedDieN" name="rdbSuppliedDie" value="N" onclick="if ( this.checked ) { $('CustomDie').show(); } calc(this.form.name);" <? echo ( 'checked' if $$variable{'rdbSuppliedDie'} ne 'Y' ) ?> />
	<label class="radio" for="rdbSuppliedDieN">No</label>
</p>
<div id="CustomDie" style="<? echo ( 'display: none;' if $$variable{'rdbSuppliedDie'} eq 'Y' ) ?>" >

		<label>Die image size? (WxH In Inches)</label>
		<input name="txtDieWidth" size="9" value="<?txtDieWidth?>" onkeyup="calc(this.form.name);" /> x <input name="txtDieHeight" size="9" value="<?txtDieHeight?>" onkeyup="calc(this.form.name);" />
		<input type="checkbox" id="chkOverrideDimensions" name="chkOverrideDimensions" value="Y" <? echo ( 'checked="checked"' if $$variable{"chkOverrideDimensions"} eq 'Y' ) ?> />
		<label class="radio" for="chkOverrideDimensions">Override</label>
	</p>
	<p> 
		<label>Die Type:</label>
		<input type="radio" id="rdbDieCuttingSimple" name="rdbDieCutting" value="Simple" onclick="calc(this.form.name);" <? echo ( 'checked' if $$variable{'rdbDieCutting'} eq 'Simple' ) ?> />
		<label class="radio" for="rdbDieCuttingSimple">Simple</label>
		<input type="radio" id="rdbDieCuttingAverage" name="rdbDieCutting" value="Average" onclick="calc(this.form.name);" <? echo ( 'checked' if $$variable{'rdbDieCutting'} eq 'Average' ) ?> />
		<label class="radio" for="rdbDieCuttingAverage">Average</label>
		<input type="radio" id="rdbDieCuttingComplex" name="rdbDieCutting" value="Complex" onclick="calc(this.form.name);" <? echo ( 'checked' if $$variable{'rdbDieCutting'} eq 'Complex' ) ?> />
		<label class="radio" for="rdbDieCuttingComplex">Complex</label>
		<br/>
		<input name="txtSteelRuleLength" size="9" value="<?txtSteelRuleLength?>"  onkeyup="calc(this.form.name);" /> 
		Linear Inches
	</p>
