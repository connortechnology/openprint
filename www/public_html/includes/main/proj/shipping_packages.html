<p>
	<label>Full Package Weight:</label>
		<input name="txtPackageWeight" value="<?txtPackageWeight?>" type="text" size="9"  onkeyup="calc('f1');" /> lbs
		<input type="checkbox" id="chkOverridePackageWeight" name="chkOverridePackageWeight" value="Y" onclick="if ( ! this.checked ) { calc('f1'); }" <? echo ( 'checked' if $$variable{'chkOverridePackageWeight'} eq 'Y' ) ?> /> 
		<label class="radio" for="chkOverridePackageWeight">Override</label>
</p>
<p>
	<label>Package Quantity:</label>
		<input type="checkbox" id="chkOverridePackageQuantity" name="chkOverridePackageQuantity" value="Y" onclick="if ( ! this.checked ) { calc('f1'); }" <? echo ( 'checked' if $$variable{'chkOverridePackageQuantity'} eq 'Y' ) ?> /> 
		<label class="radio" for="chkOverridePackageQuantity">Override</label>
		<br/>
<? eval ( $$variable{'QTYIndex'} = 1 ) ?>
<? while ( $$variable{'QTYIndex'} <= 3 ) ?>
<? if ( $$variable{'txtQuantity'.$$variable{'QTYIndex'}} ) ?>
	<span class="<?Columns?>Columns">
		<input name="txtPackageQuantity<?QTYIndex?>" value="<? echo ( $$variable{"txtPackageQuantity$$variable{'QTYIndex'}"} ) ?>" type="text" size="9" onkeyup="calc('f1');" />
	</span>
<? endif ( $$variable{'txtQuantity'.$$variable{'QTYIndex'}} ) ?>
    <? eval ( $$variable{'QTYIndex'} += 1 ) ?>
<? endwhile ( $$variable{'QTYIndex'} <= 3 ) ?>
</p>
<p>
	<label>Total Weight:</label>
	<? eval ( $$variable{'QTYIndex'} = 1 ) ?>
	<? while ( $$variable{'QTYIndex'} <= 3 ) ?>
	<? if ( $$variable{'txtQuantity'.$$variable{'QTYIndex'}} ) ?>
	<span class="<?Columns?>Columns">
		<input name="txtTotalWeight<?QTYIndex?>" value="<? echo ( $$variable{"txtTotalWeight$$variable{'QTYIndex'}"} ) ?>" type="text" size="9" readonly="readonly" /> lbs
	 </span>
	 <? endif ( $$variable{'txtQuantity'.$$variable{'QTYIndex'}} ) ?>
	 <? eval ( $$variable{'QTYIndex'} += 1 ) ?>
	 <? endwhile ( $$variable{'QTYIndex'} <= 3 ) ?>
</p>
