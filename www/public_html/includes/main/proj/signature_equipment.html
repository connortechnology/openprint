<p>
	<label>Equipment:</label>
	<? eval ( $$variable{'QTYIndex'} = 1 ) ?>
	<? while ( $$variable{'QTYIndex'} <= 3 ) ?>
	<? if ( $$variable{'Project'}->{'quantity'.$$variable{'QTYIndex'}} ) ?>
	<span class="<?Columns?>Columns">
		<select name="ddmEquipment-<?SignatureIndex?>-<?QTYIndex?>" size="1" onchange="calc('f1');">
		<option value="">Equipment Options</option>
<? echo ( ssi::fill_drop_down( $log, $dbh, "SELECT strID, strName FROM tbl_Equipment WHERE lngIndex IN (".join(',', @{$$variable{'EquipmentArray'}}).") ORDER BY lower(strName)", $$variable{"ddmEquipment-$$variable{'SignatureIndex'}-$$variable{'QTYIndex'}"} ); ) ?>
		</select>
		<input type="checkbox" id="chkOverrideEquipment-<?SignatureIndex?>-<?QTYIndex?>" name="chkOverrideEquipment-<?SignatureIndex?>-<?QTYIndex?>" value="Y" onclick="if ( ! this.checked ) calc('f1');"
		<? echo ( $$variable{"chkOverrideEquipment-$$variable{'SignatureIndex'}-$$variable{'QTYIndex'}"} eq 'Y' ? 'checked="checked"' : '' ) ?>
/>
		<label class="radio" for="chkOverrideEquipment-<?SignatureIndex?>-<?QTYIndex?>">Override</label>
	</span>
	<? endif ( $$variable{'Project'}->{'quantity'.$$variable{'QTYIndex'}} ) ?>
	<? eval ( $$variable{'QTYIndex'} += 1 ) ?>
	<? endwhile ( $$variable{'QTYIndex'} <= 3 ) ?>
</p>
