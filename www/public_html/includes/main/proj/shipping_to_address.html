<fieldset><legend>To</legend>
	<p> 
		<label>Company:</label>
		<input type="text" name="ToCompanyName" value="<?ToCompanyName?>" onchange="calc(this.form.name);"/> 
	</p>
	<p> 
		<label>Address:</label>
		<input type="text" name="ToAddress1" value="<?ToAddress1?>" onchange="calc(this.form.name);" /><br/>
		<input type="text" name="ToAddress2" value="<?ToAddress2?>" onchange="calc(this.form.name);" /> 
	</p>
	<p> 
		<label>City:</label>
		<input type="text" name="ToCity" value="<?ToCity?>" onchange="calc(this.form.name);"/> 
	</p>
	<p> 
		<label>Country:</label>
		<select name="ToCountry" onchange="Country_onchange(this, this.form.ToStateProvince);calc(this.form.name);">
		<option value=""> Select </option>
		<? echo ( ssi::return_countries( $$variable{'ToCountry'} ); ) ?>
		</select>
	</p>
	<p> 
		<label>State/Province:</label>
		<select name="ToStateProvince" onchange="calc(this.form.name);">
		<option value=""> Select </option>
		<? echo ( ssi::return_states_and_provinces( $$variable{'ToStateProvince'} ); ) ?>
		</select>
	</p>
	<p> 
		<label>Zip/Postal Code:</label>
		<input type="text" name="ToPostalCode" value="<?ToPostalCode?>" onkeyup="calc(this.form.name);"/>
	</p>
	<p> 
		<label>Phone:</label>
		<input type="text" name="ToPhone" value="<?ToPhone?>" onchange="calc(this.form.name);"/>
	</p>
	<p> 
		<label>Fax:</label>
		<input type="text" name="ToFax" value="<?ToFax?>" onchange="calc(this.form.name);"/>
	</p>
	<p> 
		<label>Email:</label>
		<input type="text" name="ToEmail" value="<?ToEmail?>" onchange="calc(this.form.name);"/>
	</p>
</fieldset>
