<!--#include virtual="/includes/main/proj/_quantities.html"-->
<li class="equipment">
	<label>Equipment</label>
	<? eval ( $$variable{'QTYIndex'} = 1 ) ?>
	<? while ( $$variable{'QTYIndex'} <= 3 ) ?>
	<? if ( $$variable{'Project'}->{'quantity'.$$variable{'QTYIndex'}} ) ?>
	<span class="<?Columns?>Columns">
		<select name="ddmEquipment<?QTYIndex?>" size="1" onchange="calc(this.form.name);">
		<option value="">Equipment Options</option>
<? echo (
	if ( $$variable{'Equipment'} ) {
		return ssi::make_drop_down( [ map { $_->id(), $_->name() } @{$$variable{'Equipment'}} ], $$variable{'ddmEquipment'.$$variable{'QTYIndex'}} ? $$variable{'ddmEquipment'.$$variable{'QTYIndex'}} : $$variable{'Equipment'.$$variable{'QTYIndex'}} );
	} elsif ( $$variable{"ddmEquipment$$variable{'QTYIndex'}"} ) {
		return $$variable{"ddmEquipment$$variable{'QTYIndex'}"};
	} elsif ( $$variable{'EquipmentArray'} ) {
		return ssi::fill_drop_down( $log, $dbh, "SELECT strID, strName FROM tbl_Equipment WHERE lngIndex IN (".join(',', @{$$variable{'EquipmentArray'}}).") ORDER BY lower(strName)", $$variable{"ddmEquipment-$$variable{'SignatureIndex'}-$$variable{'QTYIndex'}"} ); 
	} elsif ( $$variable{'ddmEquipment'} ) {
		return $$variable{'ddmEquipment'};
	}
) ?>
		</select>
		<input type="checkbox" id="chkOverrideEquipment<?QTYIndex?>" name="chkOverrideEquipment<?QTYIndex?>" value="Y" onclick="if ( ! this.checked ) calc('f1');" 
		<? echo ( ssi::checked( $$variable{'chkOverrideEquipment'.$$variable{'QTYIndex'}} eq 'Y' ); ) ?> />
		<label class="radio" for="chkOverrideEquipment<?QTYIndex?>">Override</label>
	</span>
	<? endif ( $$variable{'Project'}->{'quantity'.$$variable{'QTYIndex'}} ) ?>
	<? eval ( $$variable{'QTYIndex'} += 1 ) ?>
	<? endwhile ( $$variable{'QTYIndex'} <= 3 ) ?>
</li>
