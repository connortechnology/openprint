<? eval (
	foreach my $p ( 'Side','index','Signature' ) {
		if ( $param{$p} and ! $$variable{$p} ) {
			$$variable{$p} = $param{$p};
		} # end if
	} # end foreach
) ?>
<span id="ColourCoating<?index?><?Side?><?Signature?>" class="SpecialColour">
	<span class="checkOption">
		<input type="checkbox" id="chkColourCoating<?index?><?Side?><?Signature?>" name="chkColourCoating<?index?><?Side?><?Signature?>" value="Y" onclick="if (this.checked){SpecialColour_onchange(this, '<?Side?>', '<?index?>', '<?Signature?>' );};calc(this.form.name);"
		<? echo ( ssi::checked( $$variable{"chkColourCoating$$variable{index}$$variable{Side}$$variable{Signature}"} eq 'Y' ); ) ?> />
		<label class="radio" for="chkColourCoating<?index?><?Side?><?Signature?>">Colour/Coating <?index?></label>
	</span>
<select id="ColourCoatingType<?index?><?Side?><?Signature?>" name="ColourCoatingType<?index?><?Side?><?Signature?>" onchange="SpecialColour_onchange(this, '<?Side?>', '<?index?>', '<?Signature?>' );">
	<option value=""> select type </option>
	<? echo ( 
		my @options = (
			'PMS', 'PMS Colour',
		);
		my @Services = openprint::Service->find('category'=>'Coating','order'=>'lower(name)');
		foreach my $index ( 1 .. $$variable{index}-1 ) {
			for ( my $j = 0; $j < @Services; $j += 1 ) {
				if ( $$variable{"ColourCoatingType$index$$variable{Side}$$variable{Signature}"} eq $Services[$j]->name() ) {
					splice @Services, $j, 1;
					last;
				} # end if
			} # end for
		} # end foreach
		push @options, map { $_->name(), $_->description() } @Services;
		return ssi::make_drop_down( \@options, $$variable{"ColourCoatingType$$variable{index}$$variable{Side}$$variable{Signature}"} );
	) ?>
</select>
	<input type="text" id="ColourCoatingColour<?index?><?Side?><?Signature?>" name="ColourCoatingColour<?index?><?Side?><?Signature?>" value="<? echo ( $$variable{"ColourCoatingColour$$variable{index}$$variable{Side}$$variable{Signature}"} ) ?>" size="9" onkeyup="SpecialColour_onchange(this, '<?Side?>', '<?index?>', '<?Signature?>' );" <? echo ( $$variable{"ColourCoatingType$$variable{index}$$variable{Side}$$variable{Signature}"} =~ /PMS/ ? '' : 'style="display:none;"' ) ?> />
	<span id="ColourCoatingCoverage<?index?><?Side?><?Signature?>" <? echo ( $$variable{"ColourCoatingType$$variable{index}$$variable{Side}$$variable{Signature}"} =~ /Overall/ ? 'style="display:none;"' : '' ) ?> >
	<input type="text" name="ColourCoatingCoverage<?index?><?Side?><?Signature?>" value="<? echo ( $$variable{"ColourCoatingCoverage$$variable{index}$$variable{Side}$$variable{Signature}"} ) ?>" size="4" onkeyup="SpecialColour_onchange(this, '<?Side?>', '<?index?>', '<?Signature?>' );" /> %</span>
</span>
