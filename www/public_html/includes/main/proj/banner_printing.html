<div id="BannerOptions">
	<fieldset><legend>Banner Options</legend>
		<div class="content">
			<ul>
				<li><label># of Grommets per Banner:</label>
					<input type="text" size="4" name="grommets" id="grommets" value="<?grommets?>" onkeyup="this.value=this.value.replace(/\D/g, '');calc(this.form.name);" />
				</li>
				<li id="hemmed"><label>Will your banner have pole pockets?</label>
					<input type="radio" name="pockets" id="pocketsY" value="Y" <? echo ( ssi::checked( $$variable{'pockets'} eq 'Y' ); ) ?> onclick="$('PocketSizeli').show();calc(this.form.name);" />
					<label class="radio" for="pocketsY">Yes</label>
					<input type="radio" name="pockets" id="pocketsN" value="N" <? echo ( ssi::checked( $$variable{'pockets'} ne 'Y' ); ) ?> onclick="$('PocketSizeli').hide();calc(this.form.name);" />
					<label class="radio" for="pocketsN">No</label>
				</li>
				<li id="PocketSizeli" <? echo ( $$variable{'pockets'} ne 'Y' ? 'style="display:none;"' : '' ) ?>><label>Pole pocket diameter:</label>
					<input type="text" size="4" name="PocketSize" id="PocketSize" value="<?PocketSize?>" onkeyup="this.value=this.value.replace(/[^\.\d]/g, '');calc(this.form.name);" />
				</li>
				<li id="hemmed"><label>Will your banner be hemmed?</label>
					<input type="radio" name="hemmed" id="hemmedY" value="Y" <? echo ( ssi::checked( $$variable{'hemmed'} ne 'N' ); ) ?> onclick="calc(this.form.name);" />
					<label class="radio" for="hemmedY">Yes</label>
					<input type="radio" name="hemmed" id="hemmedN" value="N" <? echo ( ssi::checked( $$variable{'hemmed'} eq 'N' ); ) ?> onclick="calc(this.form.name);" />
					<label class="radio" for="hemmedN">No</label>
				</li>
			</ul>
		</div>
	</fieldset>
</div>
