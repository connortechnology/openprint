<? eval ( @{$$variable{'tempSignatureGroups'}} = @{$$variable{'SignatureGroups'}} ) ?>
<? while ( @$variable{'SignatureIndex','Reference'} = splice @{$$variable{'tempSignatureGroups'}},0,2; ) ?>
	<? if ( $$variable{'Reference'} ne '' ) ?>
	<div class="row"> Information for <?Reference?> </div>
	<? endif ( $$variable{'Reference'} ne '' ) ?>
	<div class="row"> 
		<span class="required">*</span>
		<span class="label">
			What are the <? echo ( ssi::writeTip( 'flat' ); ) ?> dimensions of the <?ProjectTypeName?>?<br/>
			(Width x Height in Inches)
		</span>
		<span class="input">
			<input name="txtWidth-<?SignatureIndex?>" size="9" value="<? echo ( $$variable{"txtWidth-$$variable{'SignatureIndex'}"} ) ?>"  onkeyup="calc('f1');" /> 
			<input name="txtHeight-<?SignatureIndex?>" size="9" value="<? echo ( $$variable{"txtHeight-$$variable{'SignatureIndex'}"} ) ?>"  onkeyup="calc('f1');" /> 
			(W x H)
			<input type="checkbox" id="chkOverrideDimensions-<?SignatureIndex?>" name="chkOverrideDimensions-<?SignatureIndex?>" value="Y" <? echo ( 'checked="checked"' if $$variable{"chkOverrideDimensions-$$variable{'SignatureIndex'}"} eq 'Y' ) ?> />
			<label for="chkOverrideDimensions-<?SignatureIndex?>">Override</label>
		</span>
	</div>
	<div class="row"> 
		<span class="required">*</span>
		<span class="label">
			What is the number of <? echo ( ssi::writeTip( $$variable{'ServiceTypeName'}.'s' ); ) ?> per item?</span>
		<span class="input">
			<input name="txtQty-<?SignatureIndex?>" value="<? echo ( $$variable{"txtQty-$$variable{'SignatureIndex'}"} ) ?>" type="text" size="9"  onkeyup="calc('f1');" /> 
			<input type="checkbox" id="chkOverrideQty-<?SignatureIndex?>" name="chkOverrideQty-<?SignatureIndex?>" value="Y" <? echo ( 'checked="checked"' if $$variable{"chkOverrideQty-$$variable{'SignatureIndex'}"} eq 'Y' ) ?> onclick="if ( ! this.checked ) calc(this.form.name);" />
			<label for="chkOverrideQty-<?SignatureIndex?>">Override</label>
		</span>
	</div>
	<!--#include virtual="/includes/main/proj/score_direction.html"-->
	<!--#include virtual="/includes/main/proj/score_length.html"-->
<? endwhile ( @$variable{'SignatureIndex','Reference'} = splice @{$$variable{'tempSignatureGroups'}},0,2; ) ?>
<br class="spacer"/>
