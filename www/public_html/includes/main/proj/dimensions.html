<div class="Dimensions">
	<fieldset><legend>Dimensions</legend>
		<div class="leftColumn">
			<select name="ddmProjectSize" size="1" onchange="ddmProjectSize_onChange(this.form);">
<? if ( $$variable{'ddmProjectSize'} ) ?>
				<option value="<?ddmProjectSize?>"><?ddmProjectSize?></option>
<? else ( $$variable{'ddmProjectSize'} ) ?>
				<option value="custom">custom</option>
<? endif ( $$variable{'ddmProjectSize'} ) ?>
			</select>
		</div>
		<div class="rightColumn">
			<input type="number" id="txtFinalWidth" name="txtFinalWidth" value="<?txtFinalWidth?>" onkeyup="this.value=this.value.replace(/[^\d\.]/,'');dimensions_onChange(this.form);" /> 
			<input type="number" id="txtFinalHeight" name="txtFinalHeight" value="<?txtFinalHeight?>" onkeyup="this.value=this.value.replace(/[^\d\.]/,'');dimensions_onChange(this.form);" /> 
			(<? echo ( ssi::writeTip( 'Finished' ); ) ?> - W x H in inches)<br/>
			<input type="number" id="txtWidth" name="txtWidth" value="<?txtWidth?>" onkeyup="this.value=this.value.replace(/[^\d\.]/,'');dimensions_onChange(this.form);" /> 
			<input type="number" id="txtHeight" name="txtHeight" value="<?txtHeight?>" onkeyup="this.value=this.value.replace(/[^\d\.]/,'');dimensions_onChange(this.form);" /> 
			(<? echo ( ssi::writeTip( 'Flat' ); ) ?> - W x H in inches)
		</div>
	</fieldset>
</div>
