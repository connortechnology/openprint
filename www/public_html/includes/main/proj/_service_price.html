<p>
	<label><b>Service Price (<?CurrencySymbol?>):</b></label>
	<? eval ( $$variable{'QTYIndex'} = 1 ) ?>
	<? while ( $$variable{'QTYIndex'} <= 3 ) ?>
	<? if ( $$variable{'Project'}->{'quantity'.$$variable{'QTYIndex'}} ) ?>
	<span class="<?Columns?>Columns">
<? if ( openprint::usergroup::is_user_in( ['Price Overrides'], $session{'user_id'} ) ) ?>
		<input name="txtPrice<?QTYIndex?>" size="9" value="<? echo ( $$variable{'txtPrice'.$$variable{'QTYIndex'}} ) ?>" onchange="calc(this.form.name);" />
		<input type="checkbox" id="OverridePrice<?QTYIndex?>" name="OverridePrice<?QTYIndex?>" value="Y" onclick="if(!this.checked)calc(this.form.name);" <? echo ( $$variable{'OverridePrice'.$$variable{'QTYIndex'}} eq 'Y' ? 'checked="checked"' : '' ) ?> />
		<label class="radio" for="OverridePrice<?QTYIndex?>">Override</label>
<? else ( openprint::usergroup::is_user_in( ['Price Overrides'], $session{'user_id'} ) ) ?>
		<input name="txtPrice<?QTYIndex?>" size="9" onfocus="this.blur();" readonly="readonly" />
		<? if ( $$variable{'OverridePrice'.$$variable{'QTYIndex'}} eq 'Y' ) ?>
		<input type="hidden" name="OverridePrice<?QTYIndex?>" value="Y" />
		Overridden
		<? else ( $$variable{'OverridePrice'.$$variable{'QTYIndex'}} eq 'Y' ) ?>
		<input type="hidden" name="OverridePrice<?QTYIndex?>" value="N" />
		<? endif ( $$variable{'OverridePrice'.$$variable{'QTYIndex'}} eq 'Y' ) ?>
<? endif ( openprint::usergroup::is_user_in( ['Price Overrides'], $session{'user_id'} ) ) ?>
	</span>
	<? endif ( $$variable{'Project'}->{'quantity'.$$variable{'QTYIndex'}} ) ?>
	<? eval ( $$variable{'QTYIndex'} += 1 ) ?>
	<? endwhile ( $$variable{'QTYIndex'} <= 3 ) ?>
</p>
