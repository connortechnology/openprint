<fieldset><legend>From</legend>
	<p> 
		<label>Company:</label>
		<input type="text" name="FromCompanyName" value="<?FromCompanyName?>" onchange="calc(this.form.name);"/> 
	</p>
	<p> 
		<label>Address:</label>
		<input type="text" name="FromAddress1" value="<?FromAddress1?>" onchange="calc(this.form.name);" /><br/>
		<input type="text" name="FromAddress2" value="<?FromAddress2?>" /> 
	</p>
	<p> 
		<label>City:</label>
		<input type="text" name="FromCity" value="<?FromCity?>" onchange="calc(this.form.name);"/> 
	</p>
	<p> 
		<label>Country:</label>
		<select name="FromCountry" onchange="Country_onchange(this, this.form.FromStateProvince);calc(this.form.name);">
		<option value=""> Select </option>
		<? echo ( ssi::return_countries( $$variable{'FromCountry'} ); ) ?>
		</select>
	</p>
	<p> 
		<label><span id="FromCountry_state">State/Province:</span></label>
		<select name="FromStateProvince" onchange="calc(this.form.name);">
		<option value=""> Select </option>
		<? echo ( ssi::return_states_and_provinces( $$variable{'FromStateProvince'} ); ) ?>
		</select>
	</p>
	<p> 
		<label><span id="FromCountry_postal">Zip/Postal Code:</span></label>
		<input type="text" name="FromPostalCode" value="<?FromPostalCode?>" onkeyup="calc(this.form.name);"/>
	</p>
	<p> 
		<label>Phone:</label>
		<input type="text" name="FromPhone" value="<?FromPhone?>" onchange="calc(this.form.name);"/>
	</p>
	<p> 
		<label>Fax:</label>
		<input type="text" name="FromFax" value="<?FromFax?>" onchange="calc(this.form.name);"/>
	</p>
	<p> 
		<label>Email:</label>
		<input type="text" name="FromEmail" value="<?FromEmail?>" onchange="calc(this.form.name);"/>
	</p>
</fieldset>
