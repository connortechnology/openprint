<fieldset><legend>Vacation Auto-Responder Settings</legend>
	<ul>
		<li>
			<label>Subject</label>
			<input type="text" name="VacationSubject" value="<?VacationSubject?>" />
		</li>
		<li>
			<label>Message</label>
			<textarea name="VacationMessage" onkeyup="textarea_resize(this);" rows="<? echo ( ssi::count_lines($$variable{VacationMessage});) ?>"><?VacationMessage?></textarea>
		</li>
		<li>
			<label>Vacation Status</label>
			<input type="radio" id="VacationState1" name="VacationState" <? echo ( 'checked' if $$variable{'VacationState'} ) ?> value="1"/>
			<label class="radio" for="VacationState1">Enabled</label>
			<input type="radio" id="VacationState0" name="VacationState" <? echo ( 'checked' if ! $$variable{'VacationState'} ) ?> value="0"/>
			<label class="radio" for="VacationState0">Disabled</label>
		</li>
	</ul>
</fieldset>
