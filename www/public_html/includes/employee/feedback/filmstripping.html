<!--#include virtual="/includes/employee/feedback/line.html"-->
<div style="color: red;"><?ErrorMessage?></div>
<form method="post" name="f1" action="/employee/production/project_view.html">
	<div class="row"><b class="lgTxt">Production Feedback</b></div>
<div style="float: left;"/>
<!--#include virtual="/includes/employee/feedback/employee.html"-->
<!--#include virtual="/includes/employee/feedback/comments.html"-->
<!--#include virtual="/includes/employee/feedback/complete.html"-->
<!--#include virtual="/includes/employee/feedback/complete_date.html"-->
    <div class="row">
        <span class="label">Due Date:</span>
        <span class="input">
          <? eval ( $$variable{'days'} = ssi::getdays($$variable{'ddmDueDateDay'}?$$variable{'ddmDueDateDay'}:(localtime(time))[3]); ) ?>
            <? eval ( $$variable{'months'} = ssi::getmonths($$variable{'ddmDueDateMonth'}?$$variable{'ddmDueDateMonth'}:(localtime(time))[4]+1); ) ?>
            <? eval ( $$variable{'years'} = ssi::getyears(undef,undef,$$variable{'ddmDueDateYear'}?$$variable{'ddmDueDateYear'}:(localtime(time))[5]+1900); ) ?>
            <select name="ddmDueDateMonth" size="1"> <?months?> </select>
            <select name="ddmDueDateDay" size="1"> <?days?> </select>
            <select name="ddmDueDateYear" size="1"> <?years?> </select>
        </span>
    </div>
</div><!-- Column -->
<div style="float: left;"/>
<? while ( @$variable{'SignatureIndex','Reference'} = splice @{$$variable{'Signatures'}}, 0, 2; ) ?>
<div class="Signature">
    <div class="row">
        <span class="label" valign="top">Press <? echo ( 'for ' . $$variable{'Reference'} if $$variable{'Reference'} ne '' ) ?>:</span>
        <span class="input">
            <? eval ( @{$$variable{'tempPresses'}} = @{$$variable{'Presses'}} ) ?>
            <? while ( @$variable{'id','name'} = splice @{$$variable{"tempPresses"}},0,2; ) ?>
            <input type="radio" name="UsePress-<?SignatureIndex?>" value="<?id?>" <? echo ( 'checked' if $$variable{"UsePress-$$variable{'SignatureIndex'}"} eq $$variable{'id'} ) ?> /> <?name?><br>
            <? endwhile ( @$variable{'id','name'} = splice @{$$variable{"tempPresses"}},0,2; ) ?>
        </span>
        <br class="spacer"/>
    </div>
    <br class="spacer"/>
</div>
<? endwhile ( @$variable{'SignatureIndex','Reference'} = splice @{$$variable{'Signatures'}}, 0, 2; ) ?>
</div><!-- Column -->

<!--#include virtual="/includes/employee/feedback/buttons.html"-->
<!--#include virtual="/includes/employee/feedback/hidden_fields.html"-->
</form>
