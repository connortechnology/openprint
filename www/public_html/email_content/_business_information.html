<fieldset><legend>Business Information:</legend>
	<p> 
		<label for="businessname">Legal Name: </label>
		<? hecho ( $$variable{'Company'}->business_name() ) ?>
	</p>
	<p> 
		<label>Legal Form: </label>
		<? echo ( $$variable{'Company'}->business_form() ) ?>
	</p>
	<p> 
		<label for="business_type">Business Type: </label>
<? hecho ( $$variable{'Company'}->business_type() ) ?>
	</p>
	<p> 
		<label for="StartYear">Year Established: </label>
<? echo ( 
			$$variable{'Company'}->established() =~ /(\d\d\d\d)-(\d\d)-(\d\d)/;
			return $1;
		) ?>
	</p>
	<p> 
		<label for="president_owner">President/CEO/Owner: </label>
		<? hecho ( $$variable{'Company'}->president_owner() ) ?>
	</p>
	<p> 
		<label for="employees">Number of Employees: </label>
    <? echo ( ssi::get_range_text( sql::execute( undef, undef, 'SELECT Min,Max FROM EmployeeNumbers WHERE id=?', $$variable{Company}->employees() ) ); ) ?>
	</p>
	<p> 
		<label for="annual_sales">Annual Sales: </label>
		<? echo ( 
    ssi::get_range_text( sql::execute( undef, undef, 'SELECT Min,Max FROM AnnualSales WHERE id=?', $$variable{Company}->annual_sales() ) );
) ?>
	</p>
	<p> 
		<label for="gst_number">
			<? if ( $openprint::session{'Country'} eq 'US' ) ?>Federal ID #/SSN #:<? endif ( $openprint::session{'Country'} eq 'US' ) ?>
			<? if ( $openprint::session{'Country'} eq 'CA' ) ?>GST #:<? endif ( $openprint::session{'Country'} eq 'CA' ) ?>
			
		</label>
		<? hecho ( $$variable{'Company'}->gst_number() ) ?>
	</p>
	<p> 
		<label for="pst_number">
		<? echo (
			if ( $openprint::session{'Country'} eq 'US' ) {
				return 'State Tax #:';
			} elsif ( $openprint::session{'Country'} eq 'CA' ) {
				return 'Provincial Tax #:';
			} else {
				return 'State/Provincial Tax #:';
			} # end if
		) ?> </label>
		<? hecho ( $$variable{'Company'}->pst_number() ) ?>
	</p>
</fieldset>
