<fieldset><legend>Business Information:</legend>
	<p class="business_name"> 
		<label>Legal Name: </label>
		<? hecho ( $$variable{'Company'}->business_name() ) ?>
	</p>
	<p class="legal_form"> 
		<label>Legal Form: </label>
		<? echo ( $$variable{'Company'}->business_form() ) ?>
	</p>
	<p class="business_type"> 
		<label>Business Type: </label>
<? hecho ( $$variable{'Company'}->business_type() ) ?>
	</p>
	<p class="year_established"> 
		<label>Year Established: </label>
<? echo ( 
			$$variable{'Company'}->established() =~ /(\d\d\d\d)-(\d\d)-(\d\d)/;
			return $1;
		) ?>
	</p>
	<p class="president_owner"> 
		<label>President/CEO/Owner:</label>
		<? hecho ( $$variable{'Company'}->president_owner() ) ?>
	</p>
	<p class="employees"> 
		<label>Number of Employees: </label>
    <? echo ( ssi::get_range_text( sql::execute( undef, undef, 'SELECT Min,Max FROM EmployeeNumbers WHERE id=?', $$variable{Company}->employees() ) ); ) ?>
	</p>
	<p class="annual_sales"> 
		<label>Annual Sales: </label>
		<? echo ( 
    ssi::get_range_text( sql::execute( undef, undef, 'SELECT Min,Max FROM AnnualSales WHERE id=?', $$variable{Company}->annual_sales() ) );
) ?>
	</p>
	<p class="gst_number"> 
		<label>
			<? if ( $session{'Country'} eq 'US' ) ?>Federal ID #/SSN #:<? endif ( $session{'Country'} eq 'US' ) ?>
			<? if ( $session{'Country'} eq 'CA' ) ?>GST #:<? endif ( $session{'Country'} eq 'CA' ) ?>
			
		</label>
		<? hecho ( $$variable{'Company'}->gst_number() ) ?>
	</p>
	<p class="pst_number"> 
		<label>
		<? echo (
			if ( $session{'Country'} eq 'US' ) {
				return 'State Tax #:';
			} elsif ( $session{'Country'} eq 'CA' ) {
				return 'Provincial Tax #:';
			} else {
				return 'State/Provincial Tax #:';
			} # end if
		) ?> </label>
		<? hecho ( $$variable{'Company'}->pst_number() ) ?>
	</p>
</fieldset>
