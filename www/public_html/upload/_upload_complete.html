<style type="text/css">
 #upload_SuccessMessage,
 #upload_ErrorMessage
 {
	font-family: arial, tahoma, verdana;
	font-size: 12pt;
	margin-top: 1em;
	margin-bottom: 1em;
	padding-bottom: 1.5em;
	background-color: #bde2ba;
	background-image: url('/images/success.gif');
	background-repeat: no-repeat;
	background-position: 20px 10px;
 }
 .information,
 .error
 {
	padding-top: 10px;
	margin-left: 75px;
	color: #5f5f5f;
 }
 div.information span.fileMessage,
 div.error span.errorMessage
 {
	font-weight: bold;
 }
 div.information h3,
 div.error h3
 {
	color: #009700;
	margin: 5px 0px 15px 0px;
	padding: 0px;
 }

 #upload_ErrorMessage
 {
	background-color: #ffdede;
	background-image: url('/images/failure.gif');
	background-repeat: no-repeat;
	background-position: 20px 10px;
 }
 
 div.error h3
 {
	 color: #f15004;
 }
 
 div.error span.errorMessage
 {
	color: #ff0000;
 }
</style>
<div id="bodyPage">
	<? if ( $$variable{'error'} ) ?>
		<div id="upload_ErrorMessage">
		   <div class="error">
			  <h3>Error!</h3>
			  <span class="errorMessage"><?error?></span><br />
			  Please <a href="/upload/upload_center.html">try again</a> or <a href="/main/company/contact.html">contact us</a> for assistance.
		   </div>
		</div>
	<? else ( $$variable{'error'} ) ?>
		<div id="upload_SuccessMessage">
		   <div class="information">
			  <h3>Success!</h3>
			  <span class="fileMessage"><?information?></span>
			  You will receive an e-mail transcript shortly.
		   </div>
		</div>		
	<? endif ( $$variable{'error'} ) ?>
</div>
